:4,"type":"sub_sub_header","properties":{"title":[["批处理系统"]]},"created_time":1702259796512,"last_edited_time":1702259796513,"parent_id":"dfabe6a4-81f4-49a6-b941-ca7b069d2e45","parent_table":"block","alive":true,"ignore_block_count":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"pLSSJ5i9y60Sjwbg6W5yAA,\"start\",\"end\"","n":{"pLSSJ5i9y60Sjwbg6W5yAA,\"start\",\"end\"":{"s":{"x":"pLSSJ5i9y60Sjwbg6W5yAA","i":[{"t":"s"},{"t":"t","i":["NQMDbvKiug1H",1],"o":"start","l":5,"c":"批处理系统"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"3e153cb4-cfa6-4d38-bc7f-eb3b73b46612":{"value":{"id":"3e153cb4-cfa6-4d38-bc7f-eb3b73b46612","version":14,"type":"text","properties":{"title":[["     首先启动计算机上的一个监督程序，在监督程序的控制下，计算机能够自动的、成批的处理一个或多个用户的作业。完成一批作业后，监督程度又从输入机读取作业存入磁带机。按照上面的步骤重复处理任务。监督程序不停的处理各个作业，实现了作业的自动转接，减少了作业的建立时间和手工操作时间，提高了计算机资源的利用率。 批处理系统又可以分为单道批处理系统、多道批处理系统、联机批处理系统、脱机批处理系统。"]]},"created_time":1702259796512,"last_edited_time":1702261022381,"parent_id":"dfabe6a4-81f4-49a6-b941-ca7b069d2e45","parent_table":"block","alive":true,"ignore_block_count":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"Pv5aYhYVZDHni_1FAQ4Hkw,\"start\",\"end\"","n":{"Pv5aYhYVZDHni_1FAQ4Hkw,\"start\",\"end\"":{"s":{"x":"Pv5aYhYVZDHni_1FAQ4Hkw","i":[{"t":"s"},{"t":"t","i":["rO1V62Sd0OrV",1],"o":"start","l":196,"c":"     首先启动计算机上的一个监督程序，在监督程序的控制下，计算机能够自动的、成批的处理一个或多个用户的作业。完成一批作业后，监督程度又从输入机读取作业存入磁带机。按照上面的步骤重复处理任务。监督程序不停的处理各个作业，实现了作业的自动转接，减少了作业的建立时间和手工操作时间，提高了计算机资源的利用率。 批处理系统又可以分为单道批处理系统、多道批处理系统、联机批处理系统、脱机批处理系统。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"8d740d12-58f7-4bae-bf70-e486b1ae1411":{"value":{"id":"8d740d12-58f7-4bae-bf70-e486b1ae1411","version":4,"type":"sub_sub_header","properties":{"title":[["分时系统和实时系统"]]},"created_time":1702259796513,"last_edited_time":1702259796514,"parent_id":"dfabe6a4-81f4-49a6-b941-ca7b069d2e45","parent_table":"block","alive":true,"ignore_block_count":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"6uNyprXnYFnFowEvYBDQcA,\"start\",\"end\"","n":{"6uNyprXnYFnFowEvYBDQcA,\"start\",\"end\"":{"s":{"x":"6uNyprXnYFnFowEvYBDQcA","i":[{"t":"s"},{"t":"t","i":["tU543scCJBKf",1],"o":"start","l":9,"c":"分时系统和实时系统"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"6269a162-3e79-441b-a91d-938d3abc831e":{"value":{"id":"6269a162-3e79-441b-a91d-938d3abc831e","version":12,"type":"text","properties":{"title":[["    分时系统是把处理器的运行时间分成很短的时间片，按时间片轮流把处理机分配给各联机作业使用。 若某个作业在分配给它的时间片内不能完成其计算，则该作业暂时中断，把处理机让给另一作业使用，等待下一轮调度时再继续其运行。由于计算机速度很快，作业运行轮转得很快，给每个用户的感觉是他独占了一台计算机。而每个用户可以通过自己的终端向系统发出各种操作控制命令，在充分的人机交互情况下，完成作业的运行。为了解决分时系统不能及时响应用户指令的情况，又出现了能够在在严格的时间范围内完成事件处理，及时响应随机外部事件的实时系统。"]]},"created_time":1702259796513,"last_edited_time":1702261023544,"parent_id":"dfabe6a4-81f4-49a6-b941-ca7b069d2e45","parent_table":"block","alive":true,"ignore_block_count":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"QGKJs0UD45E-dve2ooDjaA,\"start\",\"end\"","n":{"QGKJs0UD45E-dve2ooDjaA,\"start\",\"end\"":{"s":{"x":"QGKJs0UD45E-dve2ooDjaA","i":[{"t":"s"},{"t":"t","i":["VcqEIUS986or",1],"o":"start","l":257,"c":"    分时系统是把处理器的运行时间分成很短的时间片，按时间片轮流把处理机分配给各联机作业使用。 若某个作业在分配给它的时间片内不能完成其计算，则该作业暂时中断，把处理机让给另一作业使用，等待下一轮调度时再继续其运行。由于计算机速度很快，作业运行轮转得很快，给每个用户的感觉是他独占了一台计算机。而每个用户可以通过自己的终端向系统发出各种操作控制命令，在充分的人机交互情况下，完成作业的运行。为了解决分时系统不能及时响应用户指令的情况，又出现了能够在在严格的时间范围内完成事件处理，及时响应随机外部事件的实时系统。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"76bc30ec-5a75-47ed-91d3-36a950cc5035":{"value":{"id":"76bc30ec-5a75-47ed-91d3-36a950cc5035","version":4,"type":"sub_sub_header","properties":{"title":[["通用操作系统"]]},"created_time":1702259796514,"last_edited_time":1702259796515,"parent_id":"dfabe6a4-81f4-49a6-b941-ca7b069d2e45","parent_table":"block","alive":true,"ignore_block_count":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"H5V14vAFKa7Ng2W_E "title":[["之前我们提到过，Shell是一个连接用户和操作系统的应用程序，它提供了人机交互的界面（接口），用户通过这个界面访问操作系统内核的服务。Shell脚本是一种为Shell编写的脚本程序，我们可以通过Shell脚本来进行系统管理，同时也可以通过它进行文件操作。总之，编写Shell脚本对于使用Linux系统的人来说，应该是一项标配技能。"]]},"created_time":1702259796777,"last_edited_time":1702259796777,"parent_id":"dfabe6a4-81f4-49a6-b941-ca7b069d2e45","parent_table":"block","alive":true,"ignore_block_count":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"228caf1d-534f-4907-bcd4-4748993c25f0":{"value":{"id":"228caf1d-534f-4907-bcd4-4748993c25f0","version":1,"type":"text","properties":{"title":[["互联网上有大量关于Shell脚本的相关知识，我不打算再此对Shell脚本做一个全面系统的讲解，我们通过下面的代码来感性的认识下Shell脚本就行了。"]]},"created_time":1702259796778,"last_edited_time":1702259796778,"parent_id":"dfabe6a4-81f4-49a6-b941-ca7b069d2e45","parent_table":"block","alive":true,"ignore_block_count":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"cf1bca98-225c-4753-99c2-e0be9c91b1d5":{"value":{"id":"cf1bca98-225c-4753-99c2-e0be9c91b1d5","version":1,"type":"text","properties":{"title":[["例子1：输入两个整数m和n，计算从m到n的整数求和的结果。"]]},"created_time":1702259796779,"last_edited_time":1702259796779,"parent_id":"dfabe6a4-81f4-49a6-b941-ca7b069d2e45","parent_table":"block","alive":true,"ignore_block_count":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"a5f1d400-c4cd-423c-b0be-978d2d34111c":{"value":{"id":"a5f1d400-c4cd-423c-b0be-978d2d34111c","version":1,"type":"code","properties":{"title":[["#!/usr/bin/bash\nprintf 'm = '\nread m\nprintf 'n = '\nread n\na=$m\nsum=0\nwhile [ $a -le $n ]\ndo\n    sum=$[ sum + a ]\n    a=$[ a + 1 ]\ndone\necho '结果: '$sum"]],"language":[["Plain Text"]]},"format":{"code_wrap":true},"created_time":1702259796779,"last_edited_time":1702259796779,"parent_id":"dfabe6a4-81f4-49a6-b941-ca7b069d2e45","parent_table":"block","alive":true,"ignore_block_count":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"f6255539-9257-4416-82e3-7e009a94bb5d":{"value":{"id":"f6255539-9257-4416-82e3-7e009a94bb5d","version":1,"type":"text","properties":{"title":[["例子2：自动创建文件夹和指定数量的文件。"]]},"created_time":1702259796780,"last_edited_time":1702259796780,"parent_id":"dfabe6a4-81f4-49a6-b941-ca7b069d2e45","parent_table":"block","alive":true,"ignore_block_count":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"61f2ce3e-f471-413c-9606-109a09e9daf2":{"value":{"id":"61f2ce3e-f471-413c-9606-109a09e9daf2","version":1,"type":"code","properties":{"title":[["#!/usr/bin/bash\nprintf '输入文件夹名: '\nread dir\nprintf '输入文件名: '\nread file\nprintf '输入文件数量(\u003c1000): '\nread num\nif [ $num -ge 1000 ]\nthen\n    echo '文件数量不能超过1000'\nelse\n    if [ -e $dir -a -d $dir ]\n    then\n        rm -rf $dir\n    else\n        if [ -e $dir -a -f $dir ]\n        then\n            rm -f $dir\n        fi\n    fi\n    mkdir -p $dir\n    index=1\n    while [ $index -le $num ]\n    do\n        if [ $index -lt 10 ]\n        then\n            pre='00'\n        elif [ $index -lt 100 ]\n        then\n            pre='0'\n        else\n            pre=''\n        fi\n        touch $dir'/'$file'_'$pre$index\n        index=$[ index + 1 ]\n    done\nfi"]],"language":[["Plain Text"]]},"format":{"code_wrap":true},"created_time":1702259796780,"last_edited_time":1702259796780,"parent_id":"dfabe6a4-81f4-49a6-b941-ca7b069d2e45","parent_table":"block","alive":true,"ignore_block_count":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"cb30774b-7612-4b4e-b323-722472e4e0cd":{"value":{"id":"cb30774b-7612-4b4e-b323-722472e4e0cd","version":1,"type":"text","properties":{"title":[["例子3：自动安装指定版本的Redis。"]]},"created_time":1702259796781,"last_edited_time":1702259796781,"parent_id":"dfabe6a4-81f4-49a6-b941-ca7b069d2e45","parent_table":"block","alive":true,"ignore_block_count":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"d36170c8-41e6-43ab-b6b6-f2275723f550":{"value":{"id":"d36170c8-41e6-43ab-b6b6-f2275723f550","version":1,"type":"code","properties":{"title":[["#!/usr/bin/bash\ninstall_redis() {\n    if ! which redis-server \u003e /dev/null\n    then\n        cd /root\n        wget $1$2'.tar.gz' \u003e\u003e install.log\n        gunzip /root/$2'.tar.gz'\n        tar -xf /root/$2'.tar'\n        cd /root/$2\n        make \u003e\u003e install.log\n        make install \u003e\u003e install.log\n        echo '安装完成'\n    else\n        echo '已经安装过Redis'\n    fi\n}\n\ninstall_redis 'http://download.redis.io/releases/' $1"]],"language":[["Plain Text"]]},"format":{"code_wrap":true},"created_time":1702259796781,"last_edited_time":1702259796781,"parent_id":"dfabe6a4-81f4-49a6-b941-ca7b069d2e45","parent_table":"block","alive":true,"ignore_block_count":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"4837a1fe-4e1b-4da1-905b-a7803aa86ef0":{"value":{"id":"4837a1fe-4e1b-4da1-905b-a7803aa86ef0","version":1,"type":"sub_sub_header","properties":{"title":[["相关资源"]]},"created_time":1702259796781,"last_edited_time":1702259796781,"parent_id":"dfabe6a4-81f4-49a6-b941-ca7b069d2e45","parent_table":"block","alive":true,"ignore_block_count":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"ae8af915-85e4-4744-99c5-04011a5d9cd4":{"value":{"id":"ae8af915-85e4-4744-99c5-04011a5d9cd4","version":1,"type":"numbered_list","properties":{"title":[["Linux命令行常用快捷键"]]},"content":["d411b868-495e-4315-9b42-93aa7818e4d9"],"created_time":1702259796824,"last_edited_time":1702259796824,"parent_id":"dfabe6a4-81f4-49a6-b941-ca7b069d2e45","parent_table":"block","alive":true,"ignore_block_count":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"98025d6e-b82d-4355-9777-5d342363e1e5":{"value":{"id":"98025d6e-b82d-4355-9777-5d342363e1e5","version":5,"type":"numbered_list","properties":{"title":[["man查阅命令手册的内容说明"]]},"content":["9b515ec6-ab49-4df8-8fc4-c613ac7cda8c"],"created_time":1702259796835,"last_edited_time":1702260417680,"parent_id":"dfabe6a4-81f4-49a6-b941-ca7b069d2e45","parent_table":"blo
