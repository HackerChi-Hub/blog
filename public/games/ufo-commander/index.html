<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞碟指挥官 — UFO Commander</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:monospace;color:#fff;overflow:hidden}
canvas{border:2px solid #333;image-rendering:pixelated;cursor:crosshair}
#ui{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:250px 190px 250px 34px;gap:8px;align-items:start;font-size:11px;z-index:10}
.hud-panel{background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.14);border-radius:4px;padding:6px 8px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.meter{display:grid;grid-template-columns:42px 1fr 48px;gap:6px;align-items:center;margin:3px 0}
.meter label{color:#cfe8ff;white-space:nowrap}
.meter b{font-weight:700;text-align:right;font-size:10px;color:#fff}
.bar{height:7px;background:#171717;border:1px solid #303030;overflow:hidden}
.fill{display:block;height:100%;width:100%;background:#4f4}
.fill.ufo{background:#56d8ff}.fill.castle{background:#ff4d4d}.fill.beam{background:#0ff}.fill.cannon{background:#ffcf44}
.hud-center{text-align:center;line-height:1.35}
.hud-center strong{display:block;font-size:18px;color:#fff;margin-bottom:2px}
.hud-center span{display:block;color:#b8d6ff}
.hud-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;line-height:1.2}
.hud-actions div{background:rgba(255,255,255,.06);padding:4px 5px;border-radius:3px}
.hud-actions small{display:block;color:#aaa;margin-bottom:2px}
#soundBtn{width:34px;height:34px;border:1px solid rgba(255,255,255,.18);border-radius:4px;background:rgba(0,0,0,.78);color:#fff;cursor:pointer;font:16px monospace}
#soundBtn.off{color:#777}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.8);z-index:20}
#overlay h1{font-size:44px;margin-bottom:12px}
#overlay p{font-size:16px;margin-bottom:24px;text-align:center;line-height:1.7;max-width:520px}
#overlay button{font-size:20px;padding:10px 32px;background:#4a2;border:none;color:#fff;border-radius:6px;cursor:pointer;font-family:monospace}
#overlay button:hover{background:#5b3}
#hud{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:6px;font-size:11px;z-index:10}
.hud-box{background:rgba(0,0,0,.75);padding:3px 7px;border-radius:3px}
</style>
</head>
<body>
<div id="ui">
  <div class="hud-panel">
    <div class="meter"><label>基地</label><div class="bar"><span id="uiBaseBar" class="fill"></span></div><b id="uiBaseHp">2000</b></div>
    <div class="meter"><label>飞碟</label><div class="bar"><span id="uiUfoBar" class="fill ufo"></span></div><b id="uiUfoHp">100</b></div>
    <div class="meter"><label>城堡</label><div class="bar"><span id="uiCastleBar" class="fill castle"></span></div><b id="uiCastleHp">2000</b></div>
  </div>
  <div class="hud-panel hud-center">
    <strong id="uiWave">第 0 波</strong>
    <span id="uiPosition">距敌城 --m</span>
  </div>
  <div class="hud-panel hud-actions">
    <div><small>俘虏</small><b id="uiCapture">0</b></div>
    <div><small>光束</small><b id="uiBeam">100%</b><div class="bar"><span id="uiBeamBar" class="fill beam"></span></div></div>
    <div><small>炮弹</small><b id="uiCannon">READY</b><div class="bar"><span id="uiCannonBar" class="fill cannon"></span></div></div>
    <div><small>在场</small><b id="uiShells">0/3</b></div>
  </div>
  <button id="soundBtn" title="声音开关">🔊</button>
</div>
<canvas id="game"></canvas>
<div id="hud">
  <div class="hud-box">WASD/方向键: 前后左右移动</div>
  <div class="hud-box">空格: 慢速吸引前方敌兵</div>
  <div class="hud-box">J/点击: 发射炮弹(冷却)</div>
  <div class="hud-box">1步兵(2) 2盾兵(3) 3弓兵(2) 4爆破(4)</div>
</div>
<div id="overlay">
  <h1>🛸 飞碟指挥官</h1>
  <p>
    从下方向上进攻，操控飞碟在战场中穿梭<br>
    空格会吸引飞碟前方固定区域内的敌兵<br>
    消耗俘虏在飞碟附近释放我方士兵<br>
    攻破敌方城堡获胜！
  </p>
  <button id="startBtn">开始游戏</button>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 960, H = 540;
canvas.width = W; canvas.height = H;

const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const uiBaseHp = document.getElementById('uiBaseHp');
const uiUfoHp = document.getElementById('uiUfoHp');
const uiBeam = document.getElementById('uiBeam');
const uiCapture = document.getElementById('uiCapture');
const uiPosition = document.getElementById('uiPosition');
const uiCastleHp = document.getElementById('uiCastleHp');
const uiWave = document.getElementById('uiWave');
const uiBaseBar = document.getElementById('uiBaseBar');
const uiUfoBar = document.getElementById('uiUfoBar');
const uiCastleBar = document.getElementById('uiCastleBar');
const uiBeamBar = document.getElementById('uiBeamBar');
const uiCannon = document.getElementById('uiCannon');
const uiCannonBar = document.getElementById('uiCannonBar');
const uiShells = document.getElementById('uiShells');
const soundBtn = document.getElementById('soundBtn');

const FIELD_LEFT = 85;
const FIELD_RIGHT = W - 85;
const FIELD_TOP = 62;
const FIELD_BOTTOM = H - 54;
const WORLD_TOP = 0;
const WORLD_BOTTOM = 1880;
const CASTLE_Y = WORLD_TOP + 90;
const BASE_Y = WORLD_BOTTOM - 70;
const BEAM_RANGE = 132;
const BEAM_WIDTH = 96;
const UFO_SPEED = 2.65;
const BEAM_PULL = 0.062;
const BEAM_DAMAGE = 0.58;
const CANNON_COOLDOWN = 76;
const MAX_UFO_SHELLS = 3;
const CANNON_AIM_RADIUS = 110;
const CANNON_SPEED = 6.4;
const CANNON_TURN = 0.18;
const CAMERA_CENTER_Y = 310;
const keys = {};
const pointer = { x: W/2, y: H/2 };
const audioState = {
  ctx: null,
  enabled: true,
  musicTimer: null,
  musicStep: 0,
};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (handleDiscreteControl(e.code)) {
    keys[e.code] = false;
    e.preventDefault();
    return;
  }
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  pointer.x = (e.clientX - rect.left) * (canvas.width / rect.width);
  pointer.y = (e.clientY - rect.top) * (canvas.height / rect.height);
});
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  pointer.x = (e.clientX - rect.left) * (canvas.width / rect.width);
  pointer.y = (e.clientY - rect.top) * (canvas.height / rect.height);
  if (game && game.state === 'playing') fireUfoShell(game, pointer.x, pointer.y + game.cameraY);
});

let game = null;

const SOLDIER_TYPES = {
  infantry: { name:'步兵', hp:70, speed:1.3, atk:10, range:22, atkSpeed:35, cost:2, castleDmg:1 },
  shield:   { name:'盾兵', hp:200, speed:0.6, atk:4, range:18, atkSpeed:55, cost:3, castleDmg:1 },
  archer:   { name:'弓兵', hp:40, speed:1.1, atk:15, range:130, atkSpeed:55, cost:2, castleDmg:1 },
  bomber:   { name:'爆破兵', hp:55, speed:0.85, atk:5, range:20, atkSpeed:45, cost:4, castleDmg:10 },
};
const TYPE_ORDER = ['infantry','shield','archer','bomber'];

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function depthScale(y) {
  const t = (y - WORLD_TOP) / (WORLD_BOTTOM - WORLD_TOP);
  return clamp(0.72 + t * 0.38, 0.72, 1.1);
}

function initAudio() {
  if (!audioState.ctx) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return null;
    audioState.ctx = new AudioCtx();
  }
  if (audioState.ctx.state === 'suspended') audioState.ctx.resume();
  return audioState.ctx;
}

function playTone(freq, duration = 0.12, type = 'square', gain = 0.05, slideTo = null) {
  const ctxAudio = initAudio();
  if (!ctxAudio || !audioState.enabled) return;
  const now = ctxAudio.currentTime;
  const osc = ctxAudio.createOscillator();
  const amp = ctxAudio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), now + duration);
  amp.gain.setValueAtTime(0.0001, now);
  amp.gain.exponentialRampToValueAtTime(gain, now + 0.015);
  amp.gain.exponentialRampToValueAtTime(0.0001, now + duration);
  osc.connect(amp);
  amp.connect(ctxAudio.destination);
  osc.start(now);
  osc.stop(now + duration + 0.02);
}

function playNoise(duration = 0.16, gain = 0.04) {
  const ctxAudio = initAudio();
  if (!ctxAudio || !audioState.enabled) return;
  const buffer = ctxAudio.createBuffer(1, Math.floor(ctxAudio.sampleRate * duration), ctxAudio.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  const src = ctxAudio.createBufferSource();
  const amp = ctxAudio.createGain();
  amp.gain.value = gain;
  src.buffer = buffer;
  src.connect(amp);
  amp.connect(ctxAudio.destination);
  src.start();
}

function playSfx(name) {
  if (!audioState.enabled) return;
  if (name === 'start') { playTone(196, 0.1, 'triangle', 0.04); setTimeout(() => playTone(294, 0.12, 'triangle', 0.04), 90); }
  if (name === 'deploy') playTone(420, 0.09, 'square', 0.035, 620);
  if (name === 'capture') { playTone(740, 0.08, 'sine', 0.04); setTimeout(() => playTone(980, 0.1, 'sine', 0.035), 70); }
  if (name === 'beam') playTone(240, 0.04, 'sawtooth', 0.015, 180);
  if (name === 'shoot') playTone(180, 0.1, 'square', 0.045, 90);
  if (name === 'explode') { playNoise(0.2, 0.055); playTone(95, 0.18, 'triangle', 0.04, 55); }
  if (name === 'hit') playTone(120, 0.06, 'square', 0.035, 80);
  if (name === 'win') { playTone(330, 0.12, 'triangle', 0.04); setTimeout(() => playTone(494, 0.16, 'triangle', 0.045), 120); setTimeout(() => playTone(660, 0.2, 'triangle', 0.05), 260); }
  if (name === 'lose') { playTone(220, 0.18, 'sawtooth', 0.04, 110); setTimeout(() => playTone(140, 0.22, 'sawtooth', 0.035, 70), 160); }
}

function startMusic() {
  const ctxAudio = initAudio();
  if (!ctxAudio || audioState.musicTimer) return;
  const notes = [98, 123.47, 146.83, 123.47, 110, 146.83, 164.81, 146.83];
  audioState.musicTimer = setInterval(() => {
    if (!audioState.enabled || !game || game.state !== 'playing') return;
    const note = notes[audioState.musicStep % notes.length];
    playTone(note, 0.18, 'triangle', 0.018);
    if (audioState.musicStep % 4 === 0) playTone(note / 2, 0.22, 'sine', 0.012);
    audioState.musicStep++;
  }, 420);
}

function updateSoundButton() {
  soundBtn.textContent = audioState.enabled ? '🔊' : '🔇';
  soundBtn.classList.toggle('off', !audioState.enabled);
}

function handleDiscreteControl(code) {
  if (!game || game.state !== 'playing') return false;
  if (code === 'KeyJ') {
    fireUfoShell(game, pointer.x, pointer.y + game.cameraY);
    return true;
  }
  for (let i = 0; i < TYPE_ORDER.length; i++) {
    if (code === 'Digit' + (i + 1)) {
      tryDeploySoldier(game, TYPE_ORDER[i]);
      return true;
    }
  }
  return false;
}

class Entity {
  constructor(x, y, team, type) {
    const t = SOLDIER_TYPES[type];
    this.x = x; this.y = y; this.team = team; this.type = type;
    this.maxHp = t.hp; this.hp = t.hp;
    this.speed = t.speed; this.atk = t.atk;
    this.range = t.range; this.atkSpeed = t.atkSpeed;
    this.cost = t.cost; this.castleDmg = t.castleDmg;
    this.atkCooldown = 0; this.alive = true;
    this.w = 14; this.h = 20;
    this.animFrame = 0; this.animTimer = 0;
    this.beingSucked = false;
  }
}

class Base {
  constructor(x, y, team) {
    this.x = x; this.y = y; this.team = team;
    this.maxHp = 2000; this.hp = 2000;
    this.w = 55; this.h = 75;
  }
}

function createGame() {
  return {
    base: new Base(W/2, BASE_Y, 'player'),
    castle: new Base(W/2, CASTLE_Y, 'enemy'),
    soldiers: [],
    projectiles: [],
    ufoShells: [],
    particles: [],
    ufo: {
      x: W/2, y: BASE_Y - 120, w: 40, h: 20,
      hp: 100, maxHp: 100,
      beamGauge: 100, maxBeamGauge: 100,
      beamTarget: null, beamActive: false,
      captures: 8,
      invulnTimer: 0,
      cannonCooldown: 0,
    },
    cameraY: clamp(BASE_Y - FIELD_BOTTOM, 0, WORLD_BOTTOM - H),
    wave: 0, waveTimer: 0, waveInterval: 720,
    state: 'playing', time: 0,
    autoSpawnTimer: 0,
    ufoHitFlash: 0,
  };
}

function spawnEnemyWave(g) {
  const enemyCount = g.soldiers.filter(s => s.alive && s.team === 'enemy').length;
  const cap = Math.min(10 + Math.floor(g.wave * 2.2), 34);
  if (enemyCount >= cap) return;
  const baseCount = g.wave <= 1 ? 1 : (g.wave <= 3 ? 2 : 3);
  const count = Math.min(baseCount + Math.floor(g.wave * 0.35), cap - enemyCount);
  for (let i = 0; i < count; i++) {
    let pool;
    if (g.wave <= 2) {
      pool = ['infantry','infantry','infantry','infantry','infantry'];
    } else if (g.wave <= 5) {
      pool = ['infantry','infantry','infantry','infantry','shield','archer'];
    } else {
      pool = ['infantry','infantry','infantry','shield','shield','archer','archer','bomber'];
    }
    const t = pool[Math.floor(Math.random() * pool.length)];
    const spawnX = FIELD_LEFT + 40 + Math.random() * (FIELD_RIGHT - FIELD_LEFT - 80);
    const s = new Entity(spawnX, CASTLE_Y + 66 + Math.random()*28, 'enemy', t);
    g.soldiers.push(s);
  }
}

function tryDeploySoldier(g, type) {
  const cost = SOLDIER_TYPES[type].cost;
  if (g.ufo.captures < cost) return;
  g.ufo.captures -= cost;
  const spawnX = clamp(g.ufo.x + (Math.random() - 0.5) * 42, FIELD_LEFT + 18, FIELD_RIGHT - 18);
  const spawnY = clamp(g.ufo.y + 48 + Math.random() * 18, WORLD_TOP + 120, WORLD_BOTTOM - 50);
  const s = new Entity(spawnX, spawnY, 'player', type);
  g.soldiers.push(s);
  spawnParticles(g, s.x, s.y, '#4f4', 6);
  playSfx('deploy');
}

function spawnParticles(g, x, y, color, count) {
  if (g.particles.length > 300) return;
  for (let i = 0; i < count; i++) {
    g.particles.push({
      x, y, vx: (Math.random()-0.5)*4, vy: -Math.random()*3-1,
      life: 12 + Math.random()*15, maxLife: 27, color,
    });
  }
}

function fireProjectile(g, from, to) {
  const dx = to.x - from.x, dy = (to.y - to.h/2) - from.y;
  const d = Math.max(1, Math.sqrt(dx*dx+dy*dy));
  const spd = 4;
  g.projectiles.push({
    x: from.x, y: from.y,
    vx: dx/d*spd, vy: dy/d*spd,
    team: from.team, damage: from.atk,
    life: 60, color: from.team === 'player' ? '#ff0' : '#f80',
  });
}

function fireUfoShell(g, targetX, targetY) {
  if (g.ufo.cannonCooldown > 0) return;
  const activeShells = g.ufoShells.filter(p => !p.dead).length;
  if (activeShells >= MAX_UFO_SHELLS) return;
  const target = findCannonTarget(g, targetX, targetY);
  const aimX = target ? target.x : targetX;
  const aimY = target ? target.y - target.h / 2 : targetY;
  const dx = aimX - g.ufo.x;
  const dy = aimY - g.ufo.y;
  const d = Math.max(1, Math.sqrt(dx*dx + dy*dy));
  g.ufoShells.push({
    x: g.ufo.x,
    y: g.ufo.y - 12,
    vx: dx / d * CANNON_SPEED,
    vy: dy / d * CANNON_SPEED,
    target,
    targetX: aimX,
    targetY: aimY,
    damage: 38,
    radius: 34,
    life: 82,
    maxLife: 82,
  });
  g.ufo.cannonCooldown = CANNON_COOLDOWN;
  spawnParticles(g, g.ufo.x, g.ufo.y - 14, '#ff0', 5);
  playSfx('shoot');
}

function findCannonTarget(g, targetX, targetY) {
  let best = null;
  let bestDist = CANNON_AIM_RADIUS;
  for (const s of g.soldiers) {
    if (!s.alive || s.team !== 'enemy' || s.beingSucked) continue;
    const dx = s.x - targetX;
    const dy = (s.y - s.h/2) - targetY;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < bestDist) {
      best = s;
      bestDist = d;
    }
  }
  return best;
}

function explodeUfoShell(g, p) {
  if (p.exploded) return;
  p.exploded = true;
  p.dead = true;
  spawnParticles(g, p.x, p.y, '#ff0', 14);
  playSfx('explode');
  for (const o of g.soldiers) {
    if (!o.alive || o.team !== 'enemy' || o.beingSucked) continue;
    const odx = o.x - p.x;
    const ody = o.y - p.y;
    const dist = Math.sqrt(odx*odx + ody*ody);
    if (dist <= p.radius) {
      o.hp -= p.damage * (1 - dist / (p.radius * 1.35));
      spawnParticles(g, o.x, o.y, '#f80', 3);
      if (o.hp <= 0) {
        o.alive = false;
        spawnParticles(g, o.x, o.y, '#f44', 6);
      }
    }
  }
}

function update(g) {
  if (g.state !== 'playing') return;
  g.time++;
  if (g.ufoHitFlash > 0) g.ufoHitFlash--;
  if (g.ufo.invulnTimer > 0) g.ufo.invulnTimer--;
  if (g.ufo.cannonCooldown > 0) g.ufo.cannonCooldown--;

  // UFO movement: from the bottom side toward the enemy castle at the top.
  const spd = UFO_SPEED;
  if (keys['KeyW'] || keys['ArrowUp']) g.ufo.y -= spd;
  if (keys['KeyS'] || keys['ArrowDown']) g.ufo.y += spd;
  if (keys['KeyA'] || keys['ArrowLeft']) g.ufo.x -= spd;
  if (keys['KeyD'] || keys['ArrowRight']) g.ufo.x += spd;
  g.ufo.x = clamp(g.ufo.x, FIELD_LEFT + 20, FIELD_RIGHT - 20);
  g.ufo.y = clamp(g.ufo.y, WORLD_TOP + 120, WORLD_BOTTOM - 30);
  g.cameraY += (clamp(g.ufo.y - CAMERA_CENTER_Y, 0, WORLD_BOTTOM - H) - g.cameraY) * 0.12;

  // Beam gauge: recharges when not beaming
  if (!keys['Space'] || g.ufo.beamGauge <= 0) {
    g.ufo.beamGauge = Math.min(g.ufo.maxBeamGauge, g.ufo.beamGauge + 0.36);
  }

  // Beam activation
  g.ufo.beamActive = false;
  if (keys['Space'] && g.ufo.beamGauge > 0 && g.ufo.hp > 0) {
    g.ufo.beamActive = true;
    g.ufo.beamGauge -= 0.34;
    if (g.ufo.beamGauge < 0) g.ufo.beamGauge = 0;

    let closest = null, closestDist = Infinity;
    const zoneTop = g.ufo.y - BEAM_RANGE;
    const zoneBottom = g.ufo.y - 18;
    const zoneLeft = g.ufo.x - BEAM_WIDTH / 2;
    const zoneRight = g.ufo.x + BEAM_WIDTH / 2;
    for (const s of g.soldiers) {
      if (!s.alive || s.team === 'player') continue;
      if (s.x < zoneLeft || s.x > zoneRight || s.y < zoneTop || s.y > zoneBottom) continue;
      const dx = s.x - g.ufo.x;
      const dy = s.y - (g.ufo.y - 42);
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d < closestDist) { closest = s; closestDist = d; }
    }
    if (closest) {
      closest.beingSucked = true;
      closest.x += (g.ufo.x - closest.x) * BEAM_PULL;
      closest.y += (g.ufo.y - 20 - closest.y) * BEAM_PULL;
      closest.hp -= BEAM_DAMAGE;
      g.ufo.beamTarget = closest;
      if (g.time % 3 === 0) spawnParticles(g, closest.x, closest.y, '#0ff', 1);
      if (g.time % 18 === 0) playSfx('beam');
      if (closest.hp <= 0) {
        closest.alive = false;
        closest.beingSucked = false;
        g.ufo.captures += closest.cost;
        g.ufo.beamTarget = null;
        spawnParticles(g, closest.x, closest.y, '#0ff', 8);
        spawnParticles(g, g.ufo.x, g.ufo.y, '#ff0', 4);
        playSfx('capture');
      }
    } else {
      g.ufo.beamTarget = null;
    }
  } else {
    g.ufo.beamTarget = null;
  }
  // Reset sucked flag
  for (const s of g.soldiers) {
    if (s.beingSucked && s !== g.ufo.beamTarget) s.beingSucked = false;
  }

  // Deploy soldiers (costs captures)
  for (let i = 0; i < 4; i++) {
    if (keys['Digit'+(i+1)]) {
      keys['Digit'+(i+1)] = false;
      tryDeploySoldier(g, TYPE_ORDER[i]);
    }
  }

  // Enemy wave
  g.waveTimer++;
  if (g.waveTimer >= g.waveInterval) {
    g.waveTimer = 0;
    g.wave++;
    spawnEnemyWave(g);
  }

  // Update soldiers
  for (const s of g.soldiers) {
    if (!s.alive) continue;
    s.animTimer++;
    if (s.animTimer >= 8) { s.animTimer = 0; s.animFrame = (s.animFrame+1)%4; }
    if (s.atkCooldown > 0) s.atkCooldown--;

    if (s.beingSucked) continue;

    // Find target: nearest enemy soldier in front, or the enemy base.
    let target = null;
    let minDist = Infinity;
    const searchLimit = 150;
    for (const o of g.soldiers) {
      if (!o.alive || o.team === s.team || o.beingSucked) continue;
      const dx = o.x - s.x;
      const dy = o.y - s.y;
      if (s.team === 'player' && dy > 28) continue;
      if (s.team === 'enemy' && dy < -28) continue;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > searchLimit) continue;
      if (dist < minDist) { minDist = dist; target = o; }
    }
    const enemyBase = s.team === 'player' ? g.castle : g.base;
    const baseDx = enemyBase.x - s.x;
    const baseDy = enemyBase.y - s.y;
    const baseDist = Math.sqrt(baseDx*baseDx + baseDy*baseDy);
    if (baseDist < minDist) { minDist = baseDist; target = enemyBase; }

    // Move
    if (target && minDist > s.range) {
      const dx = target.x - s.x;
      const dy = target.y - s.y;
      const d = Math.max(1, Math.sqrt(dx*dx + dy*dy));
      const slow = s.team === 'enemy' ? 0.58 : 0.72;
      s.x += dx / d * s.speed * 0.42 * slow;
      s.y += dy / d * s.speed * slow;
    }

    // Attack
    if (target && minDist <= s.range + 12 && s.atkCooldown <= 0) {
      s.atkCooldown = s.atkSpeed;
      if (s.type === 'archer' && !(target instanceof Base)) {
        fireProjectile(g, s, target);
      } else if (target instanceof Base) {
        const dmg = s.atk * s.castleDmg;
        target.hp -= dmg;
        spawnParticles(g, target.x + (Math.random()-0.5)*20, target.y - target.h/2, '#f44', 3);
      } else {
        target.hp -= s.atk;
        spawnParticles(g, target.x, target.y - 5, '#ff0', 2);
        if (target.hp <= 0) {
          target.alive = false;
          spawnParticles(g, target.x, target.y, target.team === 'player' ? '#4f4' : '#f44', 8);
        }
      }
    }

    // Enemy soldiers attack UFO if nearby
    if (s.team === 'enemy' && s.type !== 'archer') {
      const dx = g.ufo.x - s.x, dy = g.ufo.y - s.y;
      const ud = Math.sqrt(dx*dx+dy*dy);
      if (ud < 45 && g.ufo.invulnTimer <= 0 && g.ufo.hp > 0) {
        g.ufo.hp -= 2;
        g.ufo.invulnTimer = 15;
        g.ufoHitFlash = 8;
        spawnParticles(g, g.ufo.x, g.ufo.y, '#f44', 3);
        playSfx('hit');
      }
    }

    s.x = clamp(s.x, FIELD_LEFT + 12, FIELD_RIGHT - 12);
    s.y = clamp(s.y, WORLD_TOP + 38, WORLD_BOTTOM - 26);
  }

  // Update projectiles
  for (const p of g.projectiles) {
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0) { p.dead = true; continue; }
    // Check hit
    for (const s of g.soldiers) {
      if (!s.alive || s.team === p.team || s.beingSucked) continue;
      if (Math.abs(s.x - p.x) < 10 && Math.abs(s.y - s.h/2 - p.y) < 12) {
        s.hp -= p.damage;
        p.dead = true;
        spawnParticles(g, s.x, s.y, '#ff0', 3);
        if (s.hp <= 0) {
          s.alive = false;
          spawnParticles(g, s.x, s.y, s.team === 'player' ? '#4f4' : '#f44', 6);
        }
        break;
      }
    }
  }

  // Update UFO shells
  for (const p of g.ufoShells) {
    if (p.target && p.target.alive && !p.target.beingSucked) {
      const tx = p.target.x;
      const ty = p.target.y - p.target.h/2;
      const dx = tx - p.x;
      const dy = ty - p.y;
      const d = Math.max(1, Math.sqrt(dx*dx + dy*dy));
      p.vx += (dx / d * CANNON_SPEED - p.vx) * CANNON_TURN;
      p.vy += (dy / d * CANNON_SPEED - p.vy) * CANNON_TURN;
    }
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0 || p.x < FIELD_LEFT || p.x > FIELD_RIGHT || p.y < WORLD_TOP || p.y > WORLD_BOTTOM) {
      p.dead = true;
      continue;
    }
    if (!p.target) {
      const dx = p.targetX - p.x;
      const dy = p.targetY - p.y;
      if (Math.sqrt(dx*dx + dy*dy) < 10) {
        explodeUfoShell(g, p);
        continue;
      }
    }
    for (const s of g.soldiers) {
      if (!s.alive || s.team !== 'enemy' || s.beingSucked) continue;
      const dx = s.x - p.x;
      const dy = (s.y - s.h/2) - p.y;
      if (Math.sqrt(dx*dx + dy*dy) < 14) {
        explodeUfoShell(g, p);
        break;
      }
    }
  }

  g.soldiers = g.soldiers.filter(s => s.alive);
  g.projectiles = g.projectiles.filter(p => !p.dead && p.life > 0);
  g.ufoShells = g.ufoShells.filter(p => !p.dead && p.life > 0);

  // Particles
  for (const p of g.particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life--;
  }
  g.particles = g.particles.filter(p => p.life > 0);

  // Win/lose
  if (g.castle.hp <= 0) { g.castle.hp = 0; g.state = 'win'; playSfx('win'); }
  if (g.base.hp <= 0) { g.base.hp = 0; g.state = 'lose'; playSfx('lose'); }
  if (g.ufo.hp <= 0) { g.ufo.hp = 0; g.state = 'lose'; playSfx('lose'); }
}

// ========== RENDERING ==========

function drawPixelRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
}

function drawBar(x, y, w, h, ratio, bgColor, fgColor) {
  drawPixelRect(x, y, w, h, bgColor);
  drawPixelRect(x, y, Math.max(0, Math.floor(w * Math.max(0, ratio))), h, fgColor);
}

function drawBase(b, label) {
  const bx = b.x - b.w/2, by = b.y - b.h/2;
  if (b.team === 'player') {
    // Green fortress
    drawPixelRect(bx, by, b.w, b.h, '#1a5c2a');
    drawPixelRect(bx+3, by+3, b.w-6, b.h-3, '#28804a');
    // Door
    drawPixelRect(bx+18, by+40, 18, 35, '#0d3318');
    drawPixelRect(bx+20, by+42, 14, 33, '#1a5c2a');
    // Windows
    drawPixelRect(bx+6, by+12, 10, 10, '#adf');
    drawPixelRect(bx+38, by+12, 10, 10, '#adf');
    // Roof
    ctx.fillStyle = '#0d3318';
    ctx.beginPath();
    ctx.moveTo(bx-4, by+2); ctx.lineTo(bx+b.w/2, by-18); ctx.lineTo(bx+b.w+4, by+2);
    ctx.fill();
    // Flag
    drawPixelRect(bx+b.w/2-1, by-34, 2, 18, '#ccc');
    drawPixelRect(bx+b.w/2+1, by-34, 14, 9, '#4f4');
    // HP bar
    drawBar(bx, by-8, b.w, 5, b.hp/b.maxHp, '#333', '#4f4');
  } else {
    // Red castle with battlements
    drawPixelRect(bx, by+10, b.w, b.h-10, '#7a1a1a');
    drawPixelRect(bx+3, by+13, b.w-6, b.h-13, '#a03030');
    // Battlements
    for (let i = 0; i < 5; i++) {
      drawPixelRect(bx + i*11, by, 8, 12, '#c44');
      drawPixelRect(bx + i*11+1, by+1, 6, 10, '#d55');
    }
    // Gate
    drawPixelRect(bx+16, by+38, 22, 37, '#4a0a0a');
    ctx.fillStyle = '#4a0a0a';
    ctx.beginPath();
    ctx.arc(bx+27, by+38, 11, Math.PI, 0);
    ctx.fill();
    // Windows
    drawPixelRect(bx+8, by+18, 8, 8, '#fa0');
    drawPixelRect(bx+38, by+18, 8, 8, '#fa0');
    // Skull emblem
    ctx.fillStyle = '#faa';
    ctx.font = '16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('💀', b.x, by+32);
    // HP bar
    drawBar(bx, by-8, b.w, 5, b.hp/b.maxHp, '#333', '#f44');
  }
  // Label
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(label, b.x, by - 14);
}

function drawSoldier(s, g) {
  const scale = depthScale(s.y);
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.scale(scale, scale);
  ctx.translate(-s.x, -s.y);
  const px = Math.floor(s.x - s.w/2);
  const py = Math.floor(s.y - s.h);
  const bob = Math.sin(s.animFrame * 1.5) * (s.beingSucked ? 3 : 1);
  const isPlayer = s.team === 'player';
  const legOffset = s.beingSucked ? 0 : (s.animFrame % 2 === 0 ? 2 : -2);

  // Shadow
  if (!s.beingSucked) {
    ctx.globalAlpha = 0.2;
    drawPixelRect(px-2, Math.floor(s.y)+1, s.w+4, 3, '#000');
    ctx.globalAlpha = 1;
  }

  if (s.type === 'infantry') {
    // === INFANTRY: Green body, sword ===
    const bodyCol = isPlayer ? '#3a3' : '#a33';
    const skinCol = isPlayer ? '#cfc' : '#fcc';
    // Legs
    drawPixelRect(px+2+legOffset, py+s.h-5+bob, 3, 5, '#553');
    drawPixelRect(px+s.w-5+legOffset, py+s.h-5+bob, 3, 5, '#553');
    // Body
    drawPixelRect(px+1, py+7+bob, s.w-2, s.h-12, bodyCol);
    // Belt
    drawPixelRect(px+1, py+s.h-8+bob, s.w-2, 2, '#cc0');
    // Head
    drawPixelRect(px+3, py+bob, s.w-6, 8, skinCol);
    // Eyes
    drawPixelRect(px+4, py+3+bob, 2, 2, '#000');
    drawPixelRect(px+s.w-6, py+3+bob, 2, 2, '#000');
    // Sword
    drawPixelRect(px+s.w+1, py+8+bob, 2, 12, '#ddd');
    drawPixelRect(px+s.w-1, py+7+bob, 6, 2, '#da3');

  } else if (s.type === 'shield') {
    // === SHIELD: Big blue shield, stocky ===
    const bodyCol = isPlayer ? '#33a' : '#a33';
    const shieldCol = isPlayer ? '#66d' : '#d66';
    // Legs (shorter, thicker)
    drawPixelRect(px+1, py+s.h-4+bob, 4, 4, '#553');
    drawPixelRect(px+s.w-5, py+s.h-4+bob, 4, 4, '#553');
    // Body (wider)
    drawPixelRect(px-1, py+6+bob, s.w+2, s.h-10, bodyCol);
    // Head with helmet
    drawPixelRect(px+2, py-1+bob, s.w-4, 9, shieldCol);
    drawPixelRect(px+3, py+1+bob, s.w-6, 5, '#eee');
    // Eyes slit
    drawPixelRect(px+4, py+2+bob, s.w-8, 2, '#333');
    // Big shield in front
    const sx = isPlayer ? px-5 : px+s.w;
    drawPixelRect(sx, py+5+bob, 8, 14, shieldCol);
    drawPixelRect(sx+1, py+6+bob, 6, 12, '#fff');
    drawPixelRect(sx+2, py+8+bob, 4, 2, shieldCol);
    drawPixelRect(sx+2, py+12+bob, 4, 2, shieldCol);

  } else if (s.type === 'archer') {
    // === ARCHER: Slim, bow, quiver ===
    const bodyCol = isPlayer ? '#aa3' : '#a55';
    const skinCol = isPlayer ? '#cfc' : '#fcc';
    // Legs (thin)
    drawPixelRect(px+3+legOffset, py+s.h-5+bob, 2, 5, '#553');
    drawPixelRect(px+s.w-5+legOffset, py+s.h-5+bob, 2, 5, '#553');
    // Body (thin)
    drawPixelRect(px+3, py+7+bob, s.w-6, s.h-12, bodyCol);
    // Head
    drawPixelRect(px+4, py+bob, s.w-8, 7, skinCol);
    // Eyes
    drawPixelRect(px+5, py+2+bob, 2, 2, '#000');
    drawPixelRect(px+s.w-7, py+2+bob, 2, 2, '#000');
    // Pointy hat
    drawPixelRect(px+5, py-5+bob, 4, 6, bodyCol);
    drawPixelRect(px+6, py-7+bob, 2, 3, bodyCol);
    // Bow
    const bx2 = isPlayer ? px+s.w+2 : px-5;
    ctx.strokeStyle = '#a73';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(bx2, py+12+bob, 8, -0.8, 0.8);
    ctx.stroke();
    ctx.strokeStyle = '#ddd';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(bx2+6, py+6+bob);
    ctx.lineTo(bx2+6, py+18+bob);
    ctx.stroke();
    // Quiver
    const qx = isPlayer ? px-3 : px+s.w;
    drawPixelRect(qx, py+7+bob, 4, 10, '#853');
    drawPixelRect(qx+1, py+6+bob, 1, 3, '#ddd');
    drawPixelRect(qx+2, py+5+bob, 1, 3, '#ddd');

  } else if (s.type === 'bomber') {
    // === BOMBER: Orange, carries TNT barrel ===
    const bodyCol = isPlayer ? '#c63' : '#a33';
    // Legs
    drawPixelRect(px+2+legOffset, py+s.h-5+bob, 3, 5, '#553');
    drawPixelRect(px+s.w-5+legOffset, py+s.h-5+bob, 3, 5, '#553');
    // Body
    drawPixelRect(px+1, py+7+bob, s.w-2, s.h-12, bodyCol);
    // Head with goggles
    drawPixelRect(px+3, py+bob, s.w-6, 7, '#fca');
    drawPixelRect(px+3, py+2+bob, 3, 3, '#444');
    drawPixelRect(px+s.w-6, py+2+bob, 3, 3, '#444');
    // Hard hat
    drawPixelRect(px+2, py-2+bob, s.w-4, 3, '#fa0');
    drawPixelRect(px+1, py+bob, s.w-2, 2, '#fa0');
    // TNT barrel on back
    const tx = isPlayer ? px-6 : px+s.w+1;
    drawPixelRect(tx, py+6+bob, 7, 10, '#c22');
    drawPixelRect(tx+1, py+7+bob, 5, 8, '#e44');
    ctx.fillStyle = '#ff0';
    ctx.font = 'bold 6px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('TNT', tx+3.5, py+13+bob);
    // Fuse spark
    if (g.time % 10 < 5) {
      drawPixelRect(tx+3, py+4+bob, 2, 2, '#ff0');
      drawPixelRect(tx+3, py+3+bob, 1, 1, '#fff');
    }
  }

  // Team marker: small colored dot
  if (!isPlayer) {
    drawPixelRect(px+s.w/2-2, py-4+bob, 4, 3, '#f00');
  }

  // HP bar (only when damaged)
  if (s.hp < s.maxHp) {
    drawBar(px-1, py - 6 + bob, s.w+2, 3, s.hp/s.maxHp, '#333', isPlayer ? '#4f4' : '#f44');
  }

  // Sucked effect: cyan glow
  if (s.beingSucked) {
    ctx.globalAlpha = 0.3 + Math.sin(g.time * 0.3) * 0.15;
    drawPixelRect(px-3, py-3+bob, s.w+6, s.h+6, '#0ff');
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawUFO(g) {
  const u = g.ufo;
  const ux = Math.floor(u.x), uy = Math.floor(u.y);
  const hover = Math.sin(g.time * 0.07) * 3;

  // Hit flash
  if (g.ufoHitFlash > 0 && g.ufoHitFlash % 2 === 0) return;

  // Fixed forward tractor area: in this bottom-to-top view, "front" is above the UFO.
  const zoneTop = uy - BEAM_RANGE;
  const zoneBottom = uy - 18;
  const zoneLeft = ux - BEAM_WIDTH / 2;
  const zoneRight = ux + BEAM_WIDTH / 2;
  ctx.globalAlpha = u.beamActive ? 0.22 : 0.08;
  ctx.fillStyle = '#0ff';
  ctx.beginPath();
  ctx.moveTo(ux - 12, uy - 10 + hover);
  ctx.lineTo(ux + 12, uy - 10 + hover);
  ctx.lineTo(zoneRight, zoneTop);
  ctx.lineTo(zoneLeft, zoneTop);
  ctx.fill();
  ctx.globalAlpha = u.beamActive ? 0.75 : 0.3;
  ctx.strokeStyle = '#0ff';
  ctx.lineWidth = 1;
  ctx.setLineDash([6,4]);
  ctx.strokeRect(zoneLeft, zoneTop, BEAM_WIDTH, zoneBottom - zoneTop);
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;

  if (u.beamActive && u.beamTarget && u.beamTarget.alive) {
    ctx.strokeStyle = '#0ff';
    ctx.lineWidth = 2;
    ctx.setLineDash([3,3]);
    ctx.beginPath();
    ctx.moveTo(ux, uy - 8 + hover);
    ctx.lineTo(u.beamTarget.x, u.beamTarget.y);
    ctx.stroke();
    ctx.setLineDash([]);
    if (g.time % 4 === 0) {
      const t = Math.random();
      spawnParticles(g, ux+(u.beamTarget.x-ux)*t, uy+hover+(u.beamTarget.y-uy)*t, '#0ff', 1);
    }
  }

  // Shadow on ground
  ctx.globalAlpha = 0.12;
  const shadowScale = depthScale(uy);
  drawPixelRect(ux - 18*shadowScale, uy + 18, 36*shadowScale, 4, '#000');
  ctx.globalAlpha = 1;

  ctx.save();
  ctx.translate(ux, uy + hover);
  ctx.scale(depthScale(uy), depthScale(uy));
  ctx.translate(-ux, -uy - hover);

  // UFO body - saucer shape
  drawPixelRect(ux - 20, uy + 2 + hover, 40, 10, '#88b');
  drawPixelRect(ux - 24, uy + 6 + hover, 48, 6, '#99c');
  drawPixelRect(ux - 16, uy - 2 + hover, 32, 6, '#aad');

  // Dome
  ctx.fillStyle = '#ccf';
  ctx.beginPath();
  ctx.ellipse(ux, uy - 2 + hover, 12, 10, 0, Math.PI, 0);
  ctx.fill();
  ctx.fillStyle = '#eef';
  ctx.beginPath();
  ctx.ellipse(ux, uy - 2 + hover, 8, 6, 0, Math.PI, 0);
  ctx.fill();

  // Antenna
  drawPixelRect(ux, uy - 14 + hover, 2, 8, '#aaa');
  if (g.time % 20 < 10) drawPixelRect(ux-1, uy - 16 + hover, 4, 3, '#f44');

  // Lights (rotating)
  const lightColors = ['#f44','#ff0','#4f4','#f4f','#0ff','#fa0'];
  for (let i = 0; i < 6; i++) {
    const angle = (g.time * 0.05 + i * Math.PI/3);
    const lx = ux + Math.cos(angle) * 20;
    const ly = uy + 7 + hover + Math.sin(angle) * 3;
    const on = (Math.floor(g.time / 6 + i) % 3) === 0;
    drawPixelRect(lx-2, ly-1, 4, 3, on ? lightColors[i] : '#444');
  }

  // === UFO HP bar (red) ===
  const hpBarW = 36;
  drawBar(ux - hpBarW/2, uy - 24 + hover, hpBarW, 4, u.hp/u.maxHp, '#411', '#f44');
  ctx.fillStyle = '#fff';
  ctx.font = '7px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('HP', ux, uy - 25 + hover);

  // === Beam gauge bar (cyan) ===
  drawBar(ux - hpBarW/2, uy - 30 + hover, hpBarW, 3, u.beamGauge/u.maxBeamGauge, '#122', '#0ff');
  ctx.restore();

  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = u.beamActive ? '#0ff' : '#fff';
  ctx.lineWidth = 1;
  ctx.setLineDash([4,4]);
  ctx.beginPath();
  ctx.moveTo(ux, uy - 8 + hover);
  ctx.lineTo(ux, zoneTop);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
}

function drawProjectiles(g) {
  for (const p of g.projectiles) {
    ctx.globalAlpha = p.life / 60;
    drawPixelRect(p.x-2, p.y-1, 4, 3, p.color);
    // Trail
    drawPixelRect(p.x - p.vx, p.y - p.vy, 3, 2, p.color);
    ctx.globalAlpha = 1;
  }
  for (const p of g.ufoShells) {
    ctx.globalAlpha = Math.max(0.35, p.life / p.maxLife);
    drawPixelRect(p.x-4, p.y-3, 8, 6, '#ff0');
    drawPixelRect(p.x - p.vx*1.4 - 2, p.y - p.vy*1.4 - 2, 5, 4, '#f80');
    ctx.globalAlpha = 1;
  }
}

function drawGround(g) {
  // Sky
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a0a1e');
  grad.addColorStop(0.5, '#121230');
  grad.addColorStop(1, '#0f2840');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars
  for (let i = 0; i < 60; i++) {
    const sx = (i * 137 + 43) % W;
    const sy = (i * 89 + 17) % (FIELD_TOP - 14);
    const bright = (Math.sin(i * 3.7 + Date.now()*0.0008) + 1) * 0.4;
    ctx.globalAlpha = 0.2 + bright;
    drawPixelRect(sx, sy, 2, 2, '#fff');
  }
  ctx.globalAlpha = 1;

  // Moon
  ctx.fillStyle = '#dde';
  ctx.beginPath();
  ctx.arc(W-80, 50, 20, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#0a0a1e';
  ctx.beginPath();
  ctx.arc(W-72, 46, 18, 0, Math.PI*2);
  ctx.fill();

  // Vertical battlefield floor
  const floorTop = FIELD_TOP;
  const gGrad = ctx.createLinearGradient(0, floorTop, 0, H);
  gGrad.addColorStop(0, '#274f24');
  gGrad.addColorStop(1, '#183c16');
  ctx.fillStyle = gGrad;
  ctx.fillRect(0, floorTop, W, H - floorTop);

  // Flatter road, with only a mild top-down taper so the map feels laid out.
  ctx.globalAlpha = 0.48;
  ctx.fillStyle = '#315e2a';
  ctx.fillRect(FIELD_LEFT + 78, FIELD_TOP, FIELD_RIGHT - FIELD_LEFT - 156, FIELD_BOTTOM - FIELD_TOP);
  ctx.globalAlpha = 0.16;
  ctx.fillStyle = '#9ad97c';
  ctx.beginPath();
  ctx.moveTo(FIELD_LEFT + 95, FIELD_TOP);
  ctx.lineTo(FIELD_LEFT + 122, FIELD_BOTTOM);
  ctx.lineTo(FIELD_RIGHT - 122, FIELD_BOTTOM);
  ctx.lineTo(FIELD_RIGHT - 95, FIELD_TOP);
  ctx.fill();

  // Scrolling map references: cross grid, lane lines, side posts, and distance labels.
  const step = 120;
  const start = Math.floor(g.cameraY / step) * step;
  ctx.globalAlpha = 0.42;
  ctx.strokeStyle = '#b9e6aa';
  ctx.lineWidth = 1;
  ctx.setLineDash([8, 8]);
  for (let wy = start; wy <= g.cameraY + H + step; wy += step) {
    const sy = wy - g.cameraY;
    if (sy < FIELD_TOP || sy > FIELD_BOTTOM) continue;
    ctx.beginPath();
    ctx.moveTo(FIELD_LEFT + 95, sy);
    ctx.lineTo(FIELD_RIGHT - 95, sy);
    ctx.stroke();
    ctx.fillStyle = '#dff4cc';
    ctx.font = '9px monospace';
    ctx.textAlign = 'right';
    ctx.fillText(`${Math.max(0, Math.round((WORLD_BOTTOM - wy) / 10))}m`, FIELD_RIGHT - 8, sy - 4);
    ctx.setLineDash([]);
    drawPixelRect(FIELD_LEFT + 74, sy - 3, 8, 6, '#cfe8bf');
    drawPixelRect(FIELD_RIGHT - 82, sy - 3, 8, 6, '#cfe8bf');
    ctx.setLineDash([8, 8]);
  }
  for (let i = -2; i <= 2; i++) {
    const x = W/2 + i * 92;
    ctx.beginPath();
    ctx.moveTo(x, FIELD_TOP);
    ctx.lineTo(x, FIELD_BOTTOM);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Advance arrow
  ctx.globalAlpha = 0.18;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W/2, FIELD_BOTTOM); ctx.lineTo(W/2, FIELD_TOP); ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawParticles(g) {
  for (const p of g.particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    drawPixelRect(p.x - 1.5, p.y - 1.5, 3, 3, p.color);
  }
  ctx.globalAlpha = 1;
}

function drawAdvanceGuide(g) {
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = '#dff4cc';
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('向上推进', W/2, FIELD_BOTTOM - 22);
  ctx.beginPath();
  ctx.moveTo(W/2, FIELD_BOTTOM - 34);
  ctx.lineTo(W/2 - 8, FIELD_BOTTOM - 20);
  ctx.lineTo(W/2 + 8, FIELD_BOTTOM - 20);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawAimOverlay(g) {
  const worldY = pointer.y + g.cameraY;
  const target = findCannonTarget(g, pointer.x, worldY);
  const aimX = target ? target.x : pointer.x;
  const aimWorldY = target ? target.y - target.h/2 : worldY;
  const aimY = aimWorldY - g.cameraY;
  if (aimY < FIELD_TOP || aimY > FIELD_BOTTOM) return;

  const ready = g.ufo.cannonCooldown <= 0 && g.ufoShells.length < MAX_UFO_SHELLS;
  const color = ready ? (target ? '#ff0' : '#f8c34a') : '#777';
  const ufoScreenY = g.ufo.y - g.cameraY;
  ctx.globalAlpha = ready ? 0.82 : 0.45;
  ctx.strokeStyle = color;
  ctx.lineWidth = target ? 2 : 1;
  ctx.setLineDash(target ? [] : [5,5]);
  ctx.beginPath();
  ctx.moveTo(g.ufo.x, ufoScreenY - 12);
  ctx.lineTo(aimX, aimY);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.beginPath();
  ctx.arc(aimX, aimY, target ? 16 : 11, 0, Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(aimX - 22, aimY);
  ctx.lineTo(aimX - 8, aimY);
  ctx.moveTo(aimX + 8, aimY);
  ctx.lineTo(aimX + 22, aimY);
  ctx.moveTo(aimX, aimY - 22);
  ctx.lineTo(aimX, aimY - 8);
  ctx.moveTo(aimX, aimY + 8);
  ctx.lineTo(aimX, aimY + 22);
  ctx.stroke();

  if (target) {
    ctx.fillStyle = color;
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('LOCK', aimX, aimY - 20);
  }
  ctx.globalAlpha = 1;
}

function drawCapturePool(g) {
  const cx = 12, cy = H - 55;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(cx, cy, 140, 42);
  ctx.strokeStyle = '#555';
  ctx.strokeRect(cx, cy, 140, 42);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`俘虏: ${g.ufo.captures}`, cx+6, cy+14);
  ctx.font = '9px monospace';
  ctx.fillStyle = '#aaa';
  ctx.fillText(`吸引慢速 / 炮弹:${MAX_UFO_SHELLS - g.ufoShells.length}/${MAX_UFO_SHELLS}`, cx+4, cy+27);
  ctx.fillText(`[1]步2 [2]盾3 [3]弓2 [4]爆4 J炮:${Math.ceil(g.ufo.cannonCooldown/60)}s`, cx+4, cy+38);
}

function drawOverlay(g) {
  overlay.style.display = 'flex';
  overlay.innerHTML = '';
  const h1 = document.createElement('h1');
  const p = document.createElement('p');
  const btn = document.createElement('button');
  let reason = '';
  if (g.state === 'win') {
    h1.textContent = '🏆 胜利！';
    h1.style.color = '#4f4';
    reason = `你在第 ${g.wave} 波攻破了敌方城堡！`;
  } else {
    h1.textContent = '💀 失败！';
    h1.style.color = '#f44';
    if (g.ufo.hp <= 0) {
      reason = `你的飞碟在第 ${g.wave} 波被击毁了！`;
    } else {
      reason = `你的基地在第 ${g.wave} 波被攻破了！`;
    }
  }
  p.innerHTML = reason + '<br><br>点击下方按钮重新开始';
  btn.textContent = '重新开始';
  btn.addEventListener('click', () => {
    initAudio();
    startMusic();
    playSfx('start');
    overlay.style.display = 'none';
    game = createGame();
    gameLoop();
  });
  overlay.appendChild(h1);
  overlay.appendChild(p);
  overlay.appendChild(btn);
}

function updateUI(g) {
  const baseRatio = clamp(g.base.hp / g.base.maxHp, 0, 1);
  const ufoRatio = clamp(g.ufo.hp / g.ufo.maxHp, 0, 1);
  const castleRatio = clamp(g.castle.hp / g.castle.maxHp, 0, 1);
  const beamRatio = clamp(g.ufo.beamGauge / g.ufo.maxBeamGauge, 0, 1);
  const cannonRatio = clamp(1 - g.ufo.cannonCooldown / CANNON_COOLDOWN, 0, 1);
  const distanceToCastle = Math.max(0, Math.round((g.ufo.y - g.castle.y) / 10));

  uiBaseHp.textContent = `${Math.ceil(g.base.hp)}`;
  uiUfoHp.textContent = `${Math.ceil(g.ufo.hp)}`;
  uiCastleHp.textContent = `${Math.ceil(g.castle.hp)}`;
  uiBaseBar.style.width = `${baseRatio * 100}%`;
  uiUfoBar.style.width = `${ufoRatio * 100}%`;
  uiCastleBar.style.width = `${castleRatio * 100}%`;

  uiWave.textContent = `第 ${g.wave} 波`;
  uiPosition.textContent = `距敌城 ${distanceToCastle}m`;

  uiCapture.textContent = `${g.ufo.captures}`;
  uiBeam.textContent = `${Math.ceil(g.ufo.beamGauge)}%`;
  uiBeamBar.style.width = `${beamRatio * 100}%`;
  uiCannon.textContent = g.ufo.cannonCooldown <= 0 ? 'READY' : `${Math.ceil(g.ufo.cannonCooldown / 60)}s`;
  uiCannonBar.style.width = `${cannonRatio * 100}%`;
  uiShells.textContent = `${g.ufoShells.length}/${MAX_UFO_SHELLS}`;
}

function render(g) {
  ctx.clearRect(0, 0, W, H);
  drawGround(g);
  drawAdvanceGuide(g);

  ctx.save();
  ctx.translate(0, -g.cameraY);
  drawBase(g.base, '我方基地');
  drawBase(g.castle, '敌方城堡');

  const sorted = [...g.soldiers].filter(s => s.alive).sort((a,b) => a.y - b.y);
  for (const s of sorted) drawSoldier(s, g);

  drawProjectiles(g);
  drawUFO(g);
  drawParticles(g);
  ctx.restore();

  drawAimOverlay(g);
  drawCapturePool(g);
  updateUI(g);
}

function gameLoop() {
  if (!game) return;
  try {
    update(game);
    render(game);
  } catch(e) {
    console.error('Game loop error:', e);
    game.state = 'lose';
    drawOverlay(game);
    return;
  }
  if (game.state !== 'playing') {
    drawOverlay(game);
    return;
  }
  requestAnimationFrame(gameLoop);
}

startBtn.addEventListener('click', () => {
  initAudio();
  startMusic();
  playSfx('start');
  overlay.style.display = 'none';
  game = createGame();
  gameLoop();
});

soundBtn.addEventListener('click', () => {
  audioState.enabled = !audioState.enabled;
  initAudio();
  startMusic();
  updateSoundButton();
  if (audioState.enabled) playSfx('start');
});
updateSoundButton();
</script>
</body>
</html>
