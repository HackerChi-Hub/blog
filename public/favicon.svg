<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .ht{fill:#3db8a0}
      .dot{fill:#f5a623}
    </style>
  </defs>
  <!-- H left vertical (slanted) -->
  <polygon class="ht" points="8,95 22,95 38,5 24,5"/>
  <!-- H crossbar + T top (slanted) -->
  <polygon class="ht" points="18,55 80,55 83,42 21,42"/>
  <!-- H right vertical / T stem (slanted) -->
  <polygon class="ht" points="42,95 56,95 72,5 58,5"/>
  <!-- T right vertical (slanted) -->
  <polygon class="ht" points="68,95 82,95 92,5 78,5"/>
  <!-- Orange dot (door handle) -->
  <circle class="dot" cx="72" cy="62" r="6"/>
</svg>
