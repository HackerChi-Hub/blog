"\n## 使用说明\n- 在本项目的“代码展示栏”里，提示词会完整展示；其中 `【...】` 表示可替换关键词（例如 `【TOPIC】`）。\n- 使用步骤：先替换 `【TOPIC】`/`【PAGES】`/`【SLIDES】`/`【STYLE】` 等变量，再整段复制到对应工具。\n- `【证据等级】`、`【来源占位】` 是要求 AI 在输出里保留的标签，别删；不确定就标 `【无法验证】`。\n- 定位声明：示例教学，只演示方法；不做事实/法律裁决。被提及不代表有罪；以司法结论为准。\n\n## Level 1: Felo 指令\n\n```text\n【TOPIC】= 爱波斯坦/Epstein（可替换）\n【PAGES】= 12~18（可替换）\n【LANG】= 中文\n\n请基于公开资料（新闻、公开司法文件解读、已公开报道），生成一份“【TOPIC】信息验证简报”PPT：\n\n1）案件关键时间线（按年份）\n2）公开材料类型清单：法院文件/判决信息/证词/媒体调查/无法验证传言\n3）高频争议点：每条标注【证据等级】= 已判决事实 / 法院文件 / 证词 / 媒体报道 / 无法验证\n4）每页页脚保留【来源占位】：待补（媒体/文件名/日期/关键词）\n\n输出：【PAGES】页，【LANG】\n```\n\n## Level 2: ChatGPT 指令（PPTX 骨架）\n\n```text\n【TOPIC】= 爱波斯坦案件相关公开材料整理（可替换）\n【SLIDES】= 24（可替换）\n【LANG】= 中文\n\n我要一份“公开档案信息验证简报”（【SLIDES】页），主题：【TOPIC】。\n\n硬性要求：\n- 每页：标题 + 3~5条要点\n- 每条要点末尾加【证据等级标签】：已判决事实 / 法院文件 / 证词 / 媒体报道 / 无法验证\n- 每页备注：30~60秒【LANG】口播稿\n- 每页页脚：保留【来源占位】，不要编造链接，只写“待补：媒体/文件名/日期/关键词”\n- 结尾页：免责声明（公开材料整理，不构成法律结论；被提及不代表有罪；以司法结论为准）\n- 风格要求：整体采用纪录片风格，界面设计需美观大方且简洁。标题字体建议粗体或等线体，配色以深蓝灰/类新闻黑白灰为主，注重信息权威感和可信度。可适当添加资料来源水印、卷宗编号、档案馆印章等细节，版式风格借鉴调查纪录片或法庭记录模板，突出证据链和权威标签元素。页面布局应清晰，重点信息突出，整体视觉保持专业，避免花哨或过多装饰。\n\n素材输入方式二选一：\nA）你开启联网搜索，自己汇总后生成\nB）我粘贴我手头的摘要/要点/资料目录（优先）\n\n输出：\n1）先给完整页大纲（含备注）\n2）再生成可下载 PPTX\n```\n\n## Level 3: Gamma 提示词（纪录片风）\n\n```text\n【TOPIC】= Epstein case public-record verification briefing（可替换）\n【SLIDES】= 12-16（可替换）\n【LANG】= Chinese\n【STYLE】= Investigative journalism (dark navy / typewriter / redacted / CONFIDENTIAL)\n\nInvestigative journalism style.\nDark navy background, typewriter-like headings, redacted blocks, “CONFIDENTIAL” stamps,\nevidence-board string lines, minimalist icons, high contrast.\n\nGenerate a 【SLIDES】 slide briefing in 【LANG】 about:\n“【TOPIC】”\nEach slide must include evidence-level tags: 已判决事实/法院文件/证词/媒体报道/无法验证\nAdd a footer placeholder: 【来源：待补 媒体/文件名/日期/关键词】\n```\n\n## Level 4: NotebookLM 指令（证据表）\n\n```text\n【TOPIC】= 爱波斯坦/Epstein 公开档案信息验证简报（可替换）\n【LANG】= 中文\n\n请基于我上传的 sources 输出一个“【TOPIC】”（【LANG】）：\n\nA. 一页结论（中性措辞，只写“可确认/待确认/无法确认”）\nB. 说法-证据表（必须含5列）\n   1）说法/事件点（中性）\n   2）证据等级：已判决事实/法院文件/证词/媒体报道/无法验证\n   3）对应来源（精确到source名称，并摘出关键句要点）\n   4）不确定性/反方观点（缺口是什么）\n   5）建议对外口径（如何避免过度解读）\nC. 最容易误读的5个点 + 纠偏话术\nD. 免责声明（公开材料整理，不构成法律结论；被提及不代表有罪；以司法结论为准）\nE.风格要求：整体采用纪录片风格，界面设计需美观大方且简洁。标题字体建议粗体或等线体，配色以深蓝灰/类新闻黑白灰为主，注重信息权威感和可信度。可适当添加资料来源水印、卷宗编号、档案馆印章等细节，版式风格借鉴调查纪录片或法庭记录模板，突出证据链和权威标签元素。页面布局应清晰，重点信息突出，整体视觉保持专业，避免花哨或过多装饰\\\n```\n\n## Level 5: Gemini Canvas 指令（导出 Slides）\n\n```text\n【TOPIC】= 爱波斯坦案件相关公开材料的信息验证简报（可替换）\n【SLIDES】= 16（可替换）\n【LANG】= 中文\n【STYLE】= 深色调查纪录片风（深蓝底+打字机标题+红色涂黑遮盖块+机密章）\n\n在 Gemini Canvas 里帮我生成一份 Google Slides 演示（【SLIDES】页，【LANG】）：\n主题：【TOPIC】\n\n规则：\n- 每页3~5条要点，必须有【证据等级】标签（已判决事实/法院文件/证词/媒体报道/无法验证）\n- 每页页脚留【来源占位】：待补（媒体/文件名/日期/关键词）\n- 风格：【STYLE】\n\n输出：\n直接生成演示并导出到 Google Slides\n```\n\n## Level 6: ChatGPT Canvas HTML 指令（信息验证终端）\n\n```text\n【TOPIC】= 爱波斯坦/Epstein 信息验证终端（可替换）\n【POINTS】= 12~16（可替换）\n【STYLE】= CRT/HUD + 扫描线 + 打字机\n【KEYS】= Space / ←→ / Esc\n\n生成一个单文件 HTML（无需后端），主题“信息验证终端”：\n\n视觉：\n- 深色CRT/HUD风格，轻微扫描线与打字机动画\n- 模块化卡片：时间线 / 证据等级说明 / 说法-证据表 / 引用占位\n\n交互：\n- 空格：下一条证据\n- ← →：切章节\n- Esc：显示目录\n- 支持一键复制“本页要点”到剪贴板\n\n内容要求：\n- 你先基于公开材料做一个“简报内容”（【POINTS】个要点），每条必须带证据等级标签\n- 每条都必须带【来源占位】：待补（媒体/文件名/日期/关键词）\n- 不得把传言写成事实；不确定就标【无法验证】\n- 页脚固定免责声明：公开材料整理，不构成法律结论；被提及不代表有罪；以司法结论为准\n\n最后输出完整 HTML 代码（可直接保存为 case_terminal.html）。\n```\n"]],"language":[["PowerShell"]]},"created_time":1770561617781,"last_edited_time":1770601013963,"parent_id":"30199968-1bdb-801d-972d-d6e28845b5df","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"2jDlNTAtK3SYGj3RtUM2qw,\"start\",\"end\"","n":{"2jDlNTAtK3SYGj3RtUM2qw,\"start\",\"end\"":{"s":{"x":"2jDlNTAtK3SYGj3RtUM2qw","i":[{"t":"s"},{"t":"t","i":["jKRuZHxUXgsS",2795],"o":"start","l":29,"c":"2026 AI 简报进化论（爱波斯坦公开档案·信息验证版）","b":[{"t":"a","x":"2jDlNTAtK3SYGj3RtUM2qw","l":"","i":["jKRuZHxUXgsS",2824],"s":{"i":["jKRuZHxUXgsS",2795],"a":"b"},"e":{"i":["jKRuZHxUXgsS",2794],"a":"b"},"a":["b"]}]},{"t":"t","i":["jKRuZHxUXgsS",2838],"o":["jKRuZHxUXgsS",282
