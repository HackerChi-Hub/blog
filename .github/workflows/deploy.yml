name: Deploy Next.js Blog to GitHub Pages
run-name: ${{ inputs.product_update_id && format('软件信息刷新 · {0}', inputs.product_update_id) || format('博客部署 · {0}', github.event_name) }}

on:
  push:
    branches:
      - main
  schedule:
    # 每小时核对公开 Release；仅发行内容变化时才构建和发布。
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      product_update_id:
        description: 软件信息刷新请求标识（脚本自动生成，普通手动部署可留空）
        required: false
        type: string

# 定时刷新、手动刷新和文章部署串行，避免旧任务覆盖新部署。
concurrency:
  group: blog-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  check-product-updates:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decision.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check public releases against the live site
        id: decision
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/check-live-product-updates.js
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    needs: check-product-updates
    if: needs.check-product-updates.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify product update scripts
        run: npm run test:products

      - name: Verify layout performance
        run: npm run test:performance

      - name: Verify cache invalidation safety
        run: npm run test:cache

      - name: Require cache purge credentials
        env:
          CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
        run: |
          if [ -z "$CACHE_PURGE_TOKEN" ]; then
            echo "缺少缓存刷新专用令牌，停止部署，避免官网缓存与新版不同步。"
            exit 1
          fi

      - name: Build (static export)
        env:
          BLOG_CONTENT_DIR: ./content-export
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 留言区开关。.env.local 不入库，所以线上构建只能从仓库 Variables 取。
          # 两个都是公开值（Site Key 本就要发给浏览器），用 vars 而不是 secrets。
          # 在 Settings → Secrets and variables → Actions → Variables 里设置：
          #   COMMENTS_ENABLED=true
          #   TURNSTILE_SITE_KEY=<Turnstile 的 Site Key>
          # 没设时留言区整段不渲染，等 Worker 部署好再打开。
          NEXT_PUBLIC_COMMENTS_ENABLED: ${{ vars.COMMENTS_ENABLED }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          npm run build
          touch out/.nojekyll
          # 写入 CNAME，确保每次部署后 gh-pages 根目录都有该文件
          echo "hyphentech.top" > out/CNAME

      - name: Force unique build
        run: echo "${{ github.run_id }}-$(date +%s)" > out/.build-id

      - name: Prepare selective cache invalidation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/cloudflare-cache.js prepare

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages

      - name: Wait for new site and refresh Cloudflare cache
        timeout-minutes: 8
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
        run: node scripts/cloudflare-cache.js purge

      - name: Verify live pages and assets
        # 定时软件更新也必须回读官网，不能只把构建成功当成已更新。
        timeout-minutes: 10
        run: |
          node scripts/verify-live.js "${{ github.run_id }}"
          node scripts/verify-product-versions.js --base https://hyphentech.top
          node scripts/audit-rendered-links.js --base https://hyphentech.top

      - name: Verify edge cache and live endpoint isolation
        run: node scripts/cloudflare-cache.js verify
