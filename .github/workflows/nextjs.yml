name: Deploy Next.js Notion Blog to Pages

on:
  # 定时任务：每 30 分钟自动同步一次（可调整为 "0 * * * *" 等）
  schedule:
    - cron: "*/30 * * * *"
  # 允许在 Actions 页手动点「Run workflow」
  workflow_dispatch:
  # 也支持在 main 分支 push 时触发（可选）
  push:
    branches: ["main"]

# 部署 Pages 需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      # 这里是关键：在构建时，把 Notion 的环境变量注入进去
      - name: Build with Notion env
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          npm run build
          npm run export

      # 上传 out 目录，供后面的 deploy 任务使用
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
