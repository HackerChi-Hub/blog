<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞碟指挥官 - UFO Commander</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: monospace; overflow-x: hidden; overflow-y: auto; padding: 10px; }
#gameWrapper { position: relative; max-width: 100%; }
canvas { display: block; border: 2px solid #333; image-rendering: pixelated; max-width: 100%; height: auto; }
#debugPanel {
  position: relative; width: 100%; max-width: 800px; margin-top: 10px;
  background: rgba(0,0,0,0.92); border: 1px solid #444; padding: 12px;
  color: #0f0; font-size: 12px; line-height: 2; border-radius: 4px;
}
#debugPanel h3 { color: #ff0; margin-bottom: 8px; border-bottom: 1px solid #555; padding-bottom: 4px; font-size: 13px; }
#debugPanel .row { display: flex; justify-content: space-between; }
#debugPanel .label { color: #999; }
#debugPanel .val { font-weight: bold; }
#debugPanel .v-green { color: #0f0; }
#debugPanel .v-red { color: #f44; }
#debugPanel .v-blue { color: #4af; }
#debugPanel .v-yellow { color: #ff0; }
#controls {
  width: 100%; max-width: 800px; margin-top: 8px;
  color: #666; font-size: 11px; text-align: center;
}
#inventory {
  position: absolute; top: 32px; left: 50%; transform: translateX(-50%);
  color: #aaa; font-size: 10px; text-align: center; pointer-events: none;
  background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 3px;
}
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="gameCanvas"></canvas>
  <div id="debugPanel">
    <h3>[ DEBUG PANEL ]</h3>
    <div class="row"><span class="label">游戏状态:</span><span class="val v-yellow" id="dbgState">--</span></div>
    <div class="row"><span class="label">我方基地HP:</span><span class="val v-blue" id="dbgPlayerHP">--</span></div>
    <div class="row"><span class="label">敌方城堡HP:</span><span class="val v-red" id="dbgEnemyHP">--</span></div>
    <div class="row"><span class="label">飞碟能量:</span><span class="val v-yellow" id="dbgEnergy">--</span></div>
    <div class="row"><span class="label">我方单位数:</span><span class="val v-blue" id="dbgPlayerUnits">--</span></div>
    <div class="row"><span class="label">敌方单位数:</span><span class="val v-red" id="dbgEnemyUnits">--</span></div>
    <div class="row"><span class="label">已吸单位数:</span><span class="val v-yellow" id="dbgCaptured">--</span></div>
    <div class="row"><span class="label">飞碟位置:</span><span class="val v-green" id="dbgUFOPos">--</span></div>
    <div class="row"><span class="label">游戏时间:</span><span class="val v-green" id="dbgTime">--</span></div>
  </div>
  <div id="controls">WASD/方向键:移动 | 空格:吸取 | 1:战士 2:弓箭手 3:法师 4:坦克</div>
</div>
<script>
const W = 800, H = 500;
const PLAYER_BASE_X = 70, ENEMY_BASE_X = 730;
const BASE_Y = 250, BASE_W = 48, BASE_H = 56;
const BASE_MAX_HP = 600;
const UFO_SPEED = 3.2;
const BEAM_RANGE = 90;
const BEAM_HALF_W = 35;
const ENERGY_MAX = 100;
const ENERGY_REGEN = 0.2;
const BEAM_COST = 0.5;
const CAPTURE_NEED = 50;

const TYPES = {
  1: { name:'战士',  color:'#4af', hp:50,  atk:10, spd:1.4, rng:22,  sz:6,  atkSpd:25 },
  2: { name:'弓箭手',color:'#0c0', hp:30,  atk:6,  spd:1.0, rng:130, sz:5,  atkSpd:35 },
  3: { name:'法师',  color:'#c4f', hp:25,  atk:14, spd:0.8, rng:90,  sz:5,  atkSpd:45, splash:35 },
  4: { name:'坦克',  color:'#ec0', hp:100, atk:8,  spd:0.5, rng:24,  sz:9,  atkSpd:35 },
};

let canvas, ctx, keys = {}, gameState = 'menu', frame = 0;
let ufo, pBase, eBase, pUnits, eUnits, particles, texts, projectiles;
let beamOn, spawnTimer, difficulty;

function makeUnit(x, y, type, team) {
  let t = TYPES[type];
  return {
    x, y, type, team, hp: t.hp, maxHp: t.hp, atk: t.atk, spd: t.spd,
    rng: t.rng, sz: t.sz, atkSpd: t.atkSpd, splash: t.splash || 0,
    atkTimer: 0, attacking: false, capProg: 0, beingPulled: false
  };
}

function reset() {
  gameState = 'playing'; frame = 0;
  ufo = { x: 200, y: 200, energy: ENERGY_MAX, captured: [] };
  pBase = { x: PLAYER_BASE_X, y: BASE_Y, hp: BASE_MAX_HP };
  eBase = { x: ENEMY_BASE_X, y: BASE_Y, hp: BASE_MAX_HP };
  pUnits = []; eUnits = []; particles = []; texts = []; projectiles = [];
  beamOn = false; spawnTimer = 0; difficulty = 1;
}

function init() {
  canvas = document.getElementById('gameCanvas');
  canvas.width = W; canvas.height = H;
  ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  window.addEventListener('keydown', e => {
    let k = e.key.toLowerCase();
    keys[k] = true; keys[e.code] = true;
    if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
    if (gameState === 'menu' && e.code === 'Space') reset();
    if ((gameState === 'win' || gameState === 'lose') && (e.code === 'KeyR' || e.code === 'Space')) reset();
    if (gameState === 'playing' && '1234'.includes(e.key)) releaseUnit(+e.key);
  });
  window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false; keys[e.code] = false;
  });
  requestAnimationFrame(loop);
}

function loop() {
  if (gameState === 'playing') update();
  render();
  requestAnimationFrame(loop);
}

// ==================== UPDATE ====================
function update() {
  frame++;
  difficulty = 1 + frame / 3600; // ramps up over time

  // --- UFO movement ---
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup'])    dy = -1;
  if (keys['s'] || keys['arrowdown'])  dy = 1;
  if (keys['a'] || keys['arrowleft'])  dx = -1;
  if (keys['d'] || keys['arrowright']) dx = 1;
  if (dx || dy) { let l = Math.hypot(dx,dy); ufo.x += dx/l*UFO_SPEED; ufo.y += dy/l*UFO_SPEED; }
  ufo.x = clamp(ufo.x, 25, W-25);
  ufo.y = clamp(ufo.y, 25, H-50);

  // --- Energy ---
  ufo.energy = Math.min(ENERGY_MAX, ufo.energy + ENERGY_REGEN);
  beamOn = !!keys['Space'] && ufo.energy > 3;
  if (beamOn) { ufo.energy -= BEAM_COST; if (ufo.energy <= 0) { ufo.energy = 0; beamOn = false; } }

  // --- Beam capture ---
  for (let e of eUnits) { e.beingPulled = false; if (!beamOn) e.capProg = 0; }
  if (beamOn) {
    for (let e of eUnits) {
      let ex = e.x - ufo.x, ey = e.y - ufo.y;
      let d = Math.hypot(ex, ey);
      // beam cone: below UFO, within range, within width
      if (ey > -10 && d < BEAM_RANGE && Math.abs(ex) < BEAM_HALF_W * (d / BEAM_RANGE + 0.3)) {
        e.beingPulled = true;
        let pull = 3.0;
        e.x += (-ex/d) * pull;
        e.y += (-ey/d) * pull;
        e.capProg++;
        if (d < 18 || e.capProg >= CAPTURE_NEED) {
          ufo.captured.push(e.type);
          addText(ufo.x, ufo.y - 24, '+1 ' + TYPES[e.type].name, '#ff0');
          burst(e.x, e.y, TYPES[e.type].color, 6);
          e.hp = 0;
        }
      }
    }
  }

  // --- Enemy spawn ---
  let interval = Math.max(60, 200 - frame / 30);
  spawnTimer++;
  if (spawnTimer >= interval) {
    spawnTimer = 0;
    let pool = [1,1,2,1,3,2,4];
    if (frame > 1800) pool.push(4,3);
    if (frame > 3600) pool.push(3,4,4);
    let t = pool[Math.floor(Math.random()*pool.length)];
    let eu = makeUnit(ENEMY_BASE_X - 25, BASE_Y + (Math.random()-0.5)*120, t, 'enemy');
    eu.hp = Math.floor(eu.hp * difficulty);
    eu.maxHp = eu.hp;
    eu.atk = Math.floor(eu.atk * difficulty);
    eUnits.push(eu);
  }

  // --- Update units ---
  for (let u of pUnits) unitAI(u, eUnits, eBase);
  for (let u of eUnits) {
    if (u.beingPulled) continue; // pulled units don't act
    unitAI(u, pUnits, pBase);
  }

  // --- Projectiles ---
  for (let p of projectiles) {
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0) { p.dead = true; continue; }
    // hit check
    let targets = p.team === 'player' ? eUnits : pUnits;
    for (let t of targets) {
      if (t.hp <= 0) continue;
      if (Math.abs(p.x - t.x) < t.sz + 2 && Math.abs(p.y - t.y) < t.sz + 2) {
        dealDamage(t, p.dmg, p.team);
        // splash
        if (p.splash) {
          for (let t2 of targets) {
            if (t2 !== t && t2.hp > 0 && Math.hypot(t2.x-t.x, t2.y-t.y) < p.splash)
              dealDamage(t2, Math.floor(p.dmg*0.5), p.team);
          }
        }
        p.dead = true; break;
      }
    }
  }
  projectiles = projectiles.filter(p => !p.dead);

  // --- Cleanup ---
  pUnits = pUnits.filter(u => u.hp > 0);
  eUnits = eUnits.filter(u => u.hp > 0);
  particles = particles.filter(p => { p.life--; p.x += p.vx; p.y += p.vy; p.vy += 0.04; return p.life > 0; });
  texts = texts.filter(t => { t.life--; t.y -= 0.6; return t.life > 0; });

  // --- Win/Lose ---
  if (eBase.hp <= 0) { eBase.hp = 0; gameState = 'win'; }
  if (pBase.hp <= 0) { pBase.hp = 0; gameState = 'lose'; }
}

function unitAI(u, enemies, targetBase) {
  u.atkTimer = Math.max(0, u.atkTimer - 1);

  let closest = null, closestD = Infinity;
  for (let e of enemies) {
    if (e.hp <= 0) continue;
    let d = Math.hypot(e.x - u.x, e.y - u.y);
    if (d < closestD) { closestD = d; closest = e; }
  }
  let bd = Math.hypot(targetBase.x - u.x, targetBase.y - u.y);
  if (bd < closestD) { closestD = bd; closest = targetBase; }

  if (closest && closestD <= u.rng + (closest.sz || BASE_W/2)) {
    if (u.atkTimer <= 0) {
      u.atkTimer = u.atkSpd;
      if (u.rng > 30) {
        // ranged: spawn projectile
        let angle = Math.atan2(closest.y - u.y, closest.x - u.x);
        let spd = 4;
        projectiles.push({
          x: u.x, y: u.y, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd,
          team: u.team, dmg: u.atk, life: 40, splash: u.splash, color: TYPES[u.type].color
        });
      } else {
        dealDamage(closest, u.atk, u.team);
        burst(closest.x, closest.y, '#f88', 3);
      }
    }
    u.attacking = true;
  } else {
    // move
    if (closest) {
      let dir = u.team === 'player' ? 1 : -1;
      if (closest === targetBase) {
        u.x += dir * u.spd;
      } else {
        let d = Math.max(1, closestD);
        u.x += (closest.x - u.x) / d * u.spd;
        u.y += (closest.y - u.y) / d * u.spd;
      }
    }
    u.attacking = false;
  }
  u.y = clamp(u.y, 40, H - 55);
  u.x = clamp(u.x, 15, W - 15);
}

function dealDamage(target, dmg, attackerTeam) {
  target.hp -= dmg;
  addText(target.x, target.y - 12, '-' + dmg, attackerTeam === 'player' ? '#4f4' : '#f44');
}

function releaseUnit(type) {
  if (ufo.captured.length === 0) {
    addText(ufo.x, ufo.y - 30, '库存为空!', '#f88');
    return;
  }
  let idx = ufo.captured.indexOf(type);
  if (idx !== -1) {
    ufo.captured.splice(idx, 1);
  } else {
    type = ufo.captured.shift();
  }
  let u = makeUnit(ufo.x, ufo.y + 10, type, 'player');
  pUnits.push(u);
  burst(ufo.x, ufo.y, TYPES[type].color, 8);
  addText(ufo.x, ufo.y - 30, '部署: ' + TYPES[type].name, TYPES[type].color);
}

// ==================== HELPERS ====================
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++)
    particles.push({ x, y, vx:(Math.random()-0.5)*3, vy:(Math.random()-0.5)*3, color, life: 18+Math.random()*15 });
}

function addText(x, y, text, color) {
  texts.push({ x, y, text, color, life: 45 });
}

// ==================== RENDER ====================
function render() {
  ctx.fillStyle = '#111128';
  ctx.fillRect(0, 0, W, H);

  if (gameState === 'menu') { renderMenu(); return; }

  drawBG();
  drawBases();
  drawProjectiles();
  drawUnits();
  drawBeam();
  drawUFO();
  drawParticles();
  drawTexts();
  drawHUD();

  if (gameState === 'win')  drawOverlay('胜 利 !', '#0f0');
  if (gameState === 'lose') drawOverlay('失 败 !', '#f00');

  updateDebug();
}

function renderMenu() {
  ctx.fillStyle = '#111128';
  ctx.fillRect(0, 0, W, H);

  drawStarsBG();

  ctx.fillStyle = '#4af';
  ctx.font = 'bold 32px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('飞碟指挥官', W/2, 100);

  ctx.font = '14px monospace';
  let lines = [
    'WASD / 方向键  —  移动飞碟',
    '空格键(按住)   —  牵引光束吸取敌方小兵',
    '按 1/2/3/4    —  释放已吸取的小兵为我作战',
    '',
    '兵种: 1=战士 2=弓箭手 3=法师 4=坦克',
    '',
    '目标: 摧毁敌方城堡!',
    '注意: 保护我方基地!',
    '',
    '[ 按空格键开始 ]'
  ];
  ctx.fillStyle = '#aaa';
  let y = 160;
  for (let l of lines) { ctx.fillText(l, W/2, y); y += 22; }

  let t = Date.now()/1000;
  drawPixelUFO(W/2, 400 + Math.sin(t*2)*12, t, false);
}

function drawBG() {
  drawStarsBG();
  ctx.fillStyle = '#1e1e3a';
  ctx.fillRect(0, H-35, W, 35);
  for (let x = 0; x < W; x += 20) { ctx.fillStyle = '#282848'; ctx.fillRect(x, H-35, 2, 1); }
}

let stars = null;
function drawStarsBG() {
  if (!stars) {
    stars = [];
    for (let i = 0; i < 60; i++) stars.push({ x: Math.random()*W, y: Math.random()*(H-50), s: Math.random()*2+1, b: Math.random() });
  }
  for (let s of stars) {
    let a = 0.2 + 0.3 * Math.sin(frame * 0.02 + s.b * 10);
    ctx.fillStyle = `rgba(200,200,255,${a})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
}

function drawBases() {
  drawOneBase(pBase, '#4af', 'player');
  drawOneBase(eBase, '#f44', 'enemy');
}

function drawOneBase(base, color, team) {
  let bx = base.x - BASE_W/2, by = base.y - BASE_H/2;

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(bx+3, by+3, BASE_W, BASE_H);

  // body
  ctx.fillStyle = team === 'player' ? '#2a4a6a' : '#6a2a2a';
  ctx.fillRect(bx, by, BASE_W, BASE_H);

  // battlements
  ctx.fillStyle = team === 'player' ? '#3a6a9a' : '#9a3a3a';
  for (let i = 0; i < 3; i++) ctx.fillRect(bx + i*17, by-9, 11, 11);

  // door
  ctx.fillStyle = team === 'player' ? '#1a3050' : '#501a1a';
  ctx.fillRect(bx+16, by+30, 16, 26);

  // windows
  ctx.fillStyle = team === 'player' ? '#6af' : '#fa6';
  ctx.fillRect(bx+8, by+10, 8, 8);
  ctx.fillRect(bx+32, by+10, 8, 8);

  // flag
  ctx.fillStyle = color;
  ctx.fillRect(bx+21, by-22, 2, 16);
  let flagWave = Math.sin(frame * 0.05) * 2;
  ctx.fillRect(bx+23, by-22+flagWave, 10, 6);

  // HP bar above castle
  let hpPct = Math.max(0, base.hp / BASE_MAX_HP);
  let barW = BASE_W + 16;
  let barX = base.x - barW/2, barY = by - 30;
  ctx.fillStyle = '#222';
  ctx.fillRect(barX, barY, barW, 10);
  ctx.fillStyle = hpPct > 0.5 ? '#0c0' : hpPct > 0.25 ? '#cc0' : '#c00';
  ctx.fillRect(barX+1, barY+1, (barW-2)*hpPct, 8);
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  ctx.strokeRect(barX, barY, barW, 10);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 9px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(Math.ceil(base.hp)+'/'+BASE_MAX_HP, base.x, barY - 3);

  // label
  ctx.fillStyle = color;
  ctx.font = '10px monospace';
  ctx.fillText(team === 'player' ? '我方基地' : '敌方城堡', base.x, by + BASE_H + 15);
}

function drawUFO() {
  drawPixelUFO(ufo.x, ufo.y, frame/15, beamOn);

  // energy bar
  let bw = 28;
  ctx.fillStyle = '#222';
  ctx.fillRect(ufo.x-bw/2, ufo.y+16, bw, 4);
  ctx.fillStyle = ufo.energy > 20 ? '#fc0' : '#f44';
  ctx.fillRect(ufo.x-bw/2, ufo.y+16, bw*(ufo.energy/ENERGY_MAX), 4);
}

function drawPixelUFO(x, y, t, showBeam) {
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(x-10, y+4, 20, 4);

  // body
  ctx.fillStyle = '#8cf';
  ctx.fillRect(x-12, y-3, 24, 7);
  ctx.fillRect(x-8, y-5, 16, 2);
  ctx.fillRect(x-5, y-7, 10, 2);

  // dome
  ctx.fillStyle = '#aff';
  ctx.fillRect(x-3, y-11, 6, 5);
  ctx.fillRect(x-2, y-13, 4, 2);

  // lights animation
  let phase = Math.floor(t) % 3;
  let cols = ['#f44','#fc0','#0c0'];
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i === phase ? cols[i] : '#333';
    ctx.fillRect(x-9+i*7, y+2, 3, 2);
  }

  // bottom glow when beam active
  if (showBeam) {
    ctx.fillStyle = 'rgba(255,255,100,0.08)';
    ctx.fillRect(x-15, y+6, 30, 4);
  }
}

function drawBeam() {
  if (!beamOn) return;

  let flicker = Math.sin(frame*0.4)*3;
  let hw = BEAM_HALF_W + flicker;

  // main beam cone
  let grad = ctx.createLinearGradient(ufo.x, ufo.y+8, ufo.x, ufo.y+BEAM_RANGE);
  grad.addColorStop(0, 'rgba(255,255,120,0.25)');
  grad.addColorStop(1, 'rgba(255,255,120,0.03)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(ufo.x-10, ufo.y+6);
  ctx.lineTo(ufo.x+10, ufo.y+6);
  ctx.lineTo(ufo.x+hw, ufo.y+BEAM_RANGE);
  ctx.lineTo(ufo.x-hw, ufo.y+BEAM_RANGE);
  ctx.fill();

  // particles inside beam
  for (let i = 0; i < 4; i++) {
    let py = ufo.y + 12 + Math.random()*(BEAM_RANGE-15);
    let spread = (py - ufo.y)/BEAM_RANGE * hw;
    let px = ufo.x + (Math.random()-0.5)*spread*2;
    ctx.fillStyle = `rgba(255,255,${80+Math.random()*175},${0.2+Math.random()*0.3})`;
    ctx.fillRect(px, py, 2, 2);
  }

  // edge lines
  ctx.strokeStyle = 'rgba(255,255,100,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(ufo.x-8, ufo.y+6); ctx.lineTo(ufo.x-hw, ufo.y+BEAM_RANGE);
  ctx.moveTo(ufo.x+8, ufo.y+6); ctx.lineTo(ufo.x+hw, ufo.y+BEAM_RANGE);
  ctx.stroke();
}

function drawUnits() {
  for (let u of pUnits) drawOneUnit(u);
  for (let u of eUnits) drawOneUnit(u);
}

function drawOneUnit(u) {
  let info = TYPES[u.type];
  let color = u.team === 'player' ? info.color : '#f66';
  let s = u.sz;

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(u.x-s/2+1, u.y+s/2, s, 2);

  // body
  ctx.fillStyle = color;
  ctx.fillRect(u.x-s/2, u.y-s/2, s, s);

  // head
  let hs = Math.max(2, s-2);
  ctx.fillStyle = u.team === 'player' ? '#eee' : '#fcc';
  ctx.fillRect(u.x-hs/2, u.y-s/2-hs, hs, hs);

  // eyes
  ctx.fillStyle = '#111';
  ctx.fillRect(u.x-1, u.y-s/2-hs+1, 1, 1);
  ctx.fillRect(u.x+1, u.y-s/2-hs+1, 1, 1);

  // weapon visual
  if (u.type === 2) { ctx.fillStyle = '#8c8'; ctx.fillRect(u.x+s/2, u.y-1, 5, 1); }
  else if (u.type === 3) { ctx.fillStyle = '#c8c'; ctx.fillRect(u.x+s/2, u.y-1, 6, 1); }
  else if (u.type === 4) { ctx.fillStyle = '#cc8'; ctx.fillRect(u.x-1, u.y+s/2, 2, 4); }

  // attack flash
  if (u.attacking && u.atkTimer > u.atkSpd - 4) {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillRect(u.x-s/2-1, u.y-s/2-1, s+2, s+2);
  }

  // HP bar (only if damaged)
  if (u.hp < u.maxHp) {
    let bw = s + 4;
    ctx.fillStyle = '#300';
    ctx.fillRect(u.x-bw/2, u.y-s/2-hs-5, bw, 3);
    ctx.fillStyle = u.hp/u.maxHp > 0.5 ? '#0c0' : '#c00';
    ctx.fillRect(u.x-bw/2, u.y-s/2-hs-5, bw*(u.hp/u.maxHp), 3);
  }

  // capture ring
  if (u.capProg > 0 && !u.beingPulled) u.capProg = Math.max(0, u.capProg - 2);
  if (u.capProg > 0) {
    let pct = u.capProg / CAPTURE_NEED;
    ctx.strokeStyle = `rgba(255,255,0,${0.3+pct*0.7})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(u.x, u.y, s + 4, -Math.PI/2, -Math.PI/2 + Math.PI*2*pct);
    ctx.stroke();
    ctx.lineWidth = 1;
  }

  // team indicator dot
  ctx.fillStyle = u.team === 'player' ? '#4af' : '#f44';
  ctx.fillRect(u.x-1, u.y + s/2 + 2, 2, 2);
}

function drawProjectiles() {
  for (let p of projectiles) {
    ctx.fillStyle = p.color || '#ff0';
    ctx.fillRect(p.x-2, p.y-1, 4, 2);
    // trail
    ctx.fillStyle = 'rgba(255,255,100,0.2)';
    ctx.fillRect(p.x-p.vx*2, p.y-p.vy*2, 3, 2);
  }
}

function drawParticles() {
  for (let p of particles) {
    ctx.globalAlpha = Math.min(1, p.life / 12);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-1, p.y-1, 3, 3);
  }
  ctx.globalAlpha = 1;
}

function drawTexts() {
  ctx.textAlign = 'center';
  ctx.font = 'bold 11px monospace';
  for (let t of texts) {
    ctx.globalAlpha = Math.min(1, t.life / 20);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  // top bar
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, 30);
  ctx.font = '12px monospace';

  ctx.textAlign = 'left';
  ctx.fillStyle = '#4af';
  ctx.fillText('BASE: ' + Math.ceil(pBase.hp) + '/' + BASE_MAX_HP, 10, 20);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#f44';
  ctx.fillText(Math.ceil(eBase.hp) + '/' + BASE_MAX_HP + ' :ENEMY', W-10, 20);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#fc0';
  let capStr = '';
  if (ufo.captured.length > 0) {
    let counts = {};
    for (let c of ufo.captured) counts[c] = (counts[c]||0)+1;
    capStr = ' [';
    for (let k in counts) capStr += TYPES[k].name + 'x' + counts[k] + ' ';
    capStr = capStr.trim() + ']';
  }
  ctx.fillText('EN:' + Math.floor(ufo.energy) + ' | CAP:' + ufo.captured.length + capStr, W/2, 20);

  // unit count bottom
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, H-30, W, 30);
  ctx.font = '10px monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#4af';
  ctx.fillText('P units: ' + pUnits.length, 10, H-14);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#f44';
  ctx.fillText('E units: ' + eUnits.length, W-10, H-14);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#888';
  ctx.fillText('TIME: ' + Math.floor(frame/60) + 's | DIFF: x' + difficulty.toFixed(1), W/2, H-14);
}

function drawOverlay(text, color) {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = color;
  ctx.font = 'bold 52px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(text, W/2, H/2 - 30);

  ctx.fillStyle = '#ccc';
  ctx.font = '16px monospace';
  ctx.fillText('按 R 或 空格 重新开始', W/2, H/2 + 20);

  ctx.fillStyle = '#888';
  ctx.font = '12px monospace';
  ctx.fillText('用时: ' + Math.floor(frame/60) + '秒', W/2, H/2 + 50);
}

function updateDebug() {
  document.getElementById('dbgState').textContent = gameState;
  document.getElementById('dbgPlayerHP').textContent = Math.ceil(pBase.hp) + ' / ' + BASE_MAX_HP;
  document.getElementById('dbgEnemyHP').textContent = Math.ceil(eBase.hp) + ' / ' + BASE_MAX_HP;
  document.getElementById('dbgEnergy').textContent = Math.floor(ufo.energy) + ' / ' + ENERGY_MAX;
  document.getElementById('dbgPlayerUnits').textContent = pUnits.length;
  document.getElementById('dbgEnemyUnits').textContent = eUnits.length;
  document.getElementById('dbgCaptured').textContent = ufo.captured.length;
  document.getElementById('dbgUFOPos').textContent = Math.floor(ufo.x) + ', ' + Math.floor(ufo.y);
  document.getElementById('dbgTime').textContent = Math.floor(frame/60) + 's (x' + difficulty.toFixed(1) + ')';
}

init();
</script>
</body>
</html>
