title":[["1894年3月28号下午两点，上海美租界的日本商行东和洋行二楼，突然传出来几声枪响。租界的巡捕在听到枪声之后，迅速赶了过来。巡捕们在房间里面发现了一具日本人的尸体，随后他们根据线索，在吴淞口抓获了凶手。租界把凶手移交给上海县，上海县对凶手进行了审讯，审讯的结果令人大吃一惊。"]]},"created_time":1763631871318,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"HRlOUs9nQN9h2w452lG2wA,\"start\",\"end\"","n":{"HRlOUs9nQN9h2w452lG2wA,\"start\",\"end\"":{"s":{"x":"HRlOUs9nQN9h2w452lG2wA","i":[{"t":"s"},{"t":"t","i":["dJ0R2D3kGWMw",1],"o":"start","l":137,"c":"1894年3月28号下午两点，上海美租界的日本商行东和洋行二楼，突然传出来几声枪响。租界的巡捕在听到枪声之后，迅速赶了过来。巡捕们在房间里面发现了一具日本人的尸体，随后他们根据线索，在吴淞口抓获了凶手。租界把凶手移交给上海县，上海县对凶手进行了审讯，审讯的结果令人大吃一惊。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8042-8aed-fdf4091ad138":{"value":{"id":"2b199968-1bdb-8042-8aed-fdf4091ad138","version":3,"type":"text","properties":{"title":[["那个被枪杀的日本人，名字叫做岩田三和。岩田三和是他的化名，他的真实姓名是金玉均。金玉均是朝鲜人，他是朝鲜亲日派的领袖。1884年朝鲜发生的甲申政变，就是金玉均和他的开化党成员策划的。在甲申政变发动之中，他们引入日本军队，在日本人的支持下挟持了高宗和闵妃，想要篡夺政权。甲申政变失败之后，金玉均潜逃到日本，化名为岩田三和，接受日本人的庇护。"]]},"created_time":1763631871319,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"PYBVKDgSgXwoRwznzrLoWg,\"start\",\"end\"","n":{"PYBVKDgSgXwoRwznzrLoWg,\"start\",\"end\"":{"s":{"x":"PYBVKDgSgXwoRwznzrLoWg","i":[{"t":"s"},{"t":"t","i":["U_sHL6fcIjVF",1],"o":"start","l":169,"c":"那个被枪杀的日本人，名字叫做岩田三和。岩田三和是他的化名，他的真实姓名是金玉均。金玉均是朝鲜人，他是朝鲜亲日派的领袖。1884年朝鲜发生的甲申政变，就是金玉均和他的开化党成员策划的。在甲申政变发动之中，他们引入日本军队，在日本人的支持下挟持了高宗和闵妃，想要篡夺政权。甲申政变失败之后，金玉均潜逃到日本，化名为岩田三和，接受日本人的庇护。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8064-ae03-f441d24a7d85":{"value":{"id":"2b199968-1bdb-8064-ae03-f441d24a7d85","version":3,"type":"text","properties":{"title":[["但是在1884年到1893年这十年里面，日本和朝鲜的关系发生了很多变化。日本需要和朝鲜政府打交道，日本对金玉均的庇护就成了负面因素。金玉均他也发现了日本政府的变化，他认为自己不能只依赖日本了，他需要谋求多条出路。他开始既跟清朝联络，又跟俄国联络。到1894年，金玉均他在日本跟清廷的驻日公使建立了很好的关系，他提出来要到上海去走一走，清朝的外交官也接受了他的请求。金玉均就坐船从日本来到了上海，结果到了上海之后就被刺杀了。刺杀他的凶手是朝鲜政府从朝鲜派出来的刺客。"]]},"created_time":1763631871320,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"kB2jc2TUZklK0v8AgZL2mw,\"start\",\"end\"","n":{"kB2jc2TUZklK0v8AgZL2mw,\"start\",\"end\"":{"s":{"x":"kB2jc2TUZklK0v8AgZL2mw","i":[{"t":"s"},{"t":"t","i":["H1nMXLhBzzIY",1],"o":"start","l":232,"c":"但是在1884年到1893年这十年里面，日本和朝鲜的关系发生了很多变化。日本需要和朝鲜政府打交道，日本对金玉均的庇护就成了负面因素。金玉均他也发现了日本政府的变化，他认为自己不能只依赖日本了，他需要谋求多条出路。他开始既跟清朝联络，又跟俄国联络。到1894年，金玉均他在日本跟清廷的驻日公使建立了很好的关系，他提出来要到上海去走一走，清朝的外交官也接受了他的请求。金玉均就坐船从日本来到了上海，结果到了上海之后就被刺杀了。刺杀他的凶手是朝鲜政府从朝鲜派出来的刺客。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-801d-915d-e33c4d77d37b":{"value":{"id":"2b199968-1bdb-801d-915d-e33c4d77d37b","version":3,"type":"text","properties":{"title":[["金玉均死了之后，朝鲜政府就跟清廷交涉，说要把他的遗体运回到朝鲜国内，清廷也就答应了。清廷把金玉均的遗体还有刺客都移交给了朝鲜。但是金玉均的遗体在运回到朝鲜之后，朝鲜政府以他犯了叛逆罪为名，对他的尸体进行了凌迟鞭尸。朝鲜政府这么做了之后，日本不干了。日本人看到亲日派的领袖落得这样的下场，日本国内出现了很大不满的情绪，日本的舆论都认为，清朝和朝鲜的举动是对日本的极大侮辱。金玉均事件，是甲午战争的一个导火索。这个事件经过舆论的发酵，日本举国一致，对朝鲜、对清朝都有了很高的不满的情绪，日本政府得到了他们想要的效果。"]]},"created_time":1763631871320,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"yUkzBW3nFhmIR2CrYRPhog,\"start\",\"end\"","n":{"yUkzBW3nFhmIR2CrYRPhog,\"start\",\"end\"":{"s":{"x":"yUkzBW3nFhmIR2CrYRPhog","i":[{"t":"s"},{"t":"t","i":["KlK7UpnCvpqb",1],"o":"start","l":256,"c":"金玉均死了之后，朝鲜政府就跟清廷交涉，说要把他的遗体运回到朝鲜国内，清廷也就答应了。清廷把金玉均的遗体还有刺客都移交给了朝鲜。但是金玉均的遗体在运回到朝鲜之后，朝鲜政府以他犯了叛逆罪为名，对他的尸体进行了凌迟鞭尸。朝鲜政府这么做了之后，日本不干了。日本人看到亲日派的领袖落得这样的下场，日本国内出现了很大不满的情绪，日本的舆论都认为，清朝和朝鲜的举动是对日本的极大侮辱。金玉均事件，是甲午战争的一个导火索。这个事件经过舆论的发酵，日本举国一致，对朝鲜、对清朝都有了很高的不满的情绪，日本政府得到了他们想要的效果。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8092-a577-e68471dd3486":{"value":{"id":"2b199968-1bdb-8092-a577-e68471dd3486","version":3,"type":"text","properties":{"title":[["甲午战争的另外一个导火索，就是东学党起义了。"]]},"created_time":1763631871321,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"yQhg9775QyfU99GSpmoYQg,\"start\",\"end\"","n":{"yQhg9775QyfU99GSpmoYQg,\"start\",\"end\"":{"s":{"x":"yQhg9775QyfU99GSpmoYQg","i":[{"t":"s"},{"t":"t","i":["FUxhF9wzboOs",1],"o":"start","l":22,"c":"甲午战争的另外一个导火索，就是东学党起义了。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-80e8-871b-d9fc2d2572d3":{"value":{"id":"2b199968-1bdb-80e8-871b-d9fc2d2572d3","version":3,"type":"text","properties":{"title":[["自从西方文化进入到朝鲜之后，朝鲜国内就出现了一个信仰「东学」的组织。这个组织认为，朝鲜社会的民不聊生，都是因为受到了西方国家的入侵。他们认为，以天主教为代表的西方文化是邪恶的根源。为了能够让朝鲜回归到以往富足的生活，他们要抵制西学，他们开创了一个和西学相抗衡的学问，叫「东学」。这个「东学」，是以传统的儒释道思想为根基的。信仰「东学」的人就被称作是「东学党」。所以「东学党」从一开始他就是一个反对洋教、反对西方侵略的一个组织。这个组织从1860年代开始传播，一直到1894年，经过30年的传播，信徒越来越多。"]]},"created_time":1763631871321,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"MDmTDCBZ0C1T_99M7HmhPw,\"start\",\"end\"","n":{"MDmTDCBZ0C1T_99M7HmhPw,\"start\",\"end\"":{"s":{"x":"MDmTDCBZ0C1T_99M7HmhPw","i":[{"t":"s"},{"t":"t","i":["ToElmXdbhSox",1],"o":"start","l":254,"c":"自从西方文化进入到朝鲜之后，朝鲜国内就出现了一个信仰「东学」的组织。这个组织认为，朝鲜社会的民不聊生，都是因为受到了西方国家的入侵。他们认为，以天主教为代表的西方文化是邪恶的根源。为了能够让朝鲜回归到以往富足的生活，他们要抵制西学，他们开创了一个和西学相抗衡的学问，叫「东学」。这个「东学」，是以传统的儒释道思想为根基的。信仰「东学」的人就被称作是「东学党」。所以「东学党」从一开始他就是一个反对洋教、反对西方侵略的一个组织。这个组织从1860年代开始传播，一直到1894年，经过30年的传播，信徒越来越多。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-80cc-8a33-f90aee543cfc":{"value":{"id":"2b199968-1bdb-80cc-8a33-f90aee543cfc","version":3,"type":"text","properties":{"title":[["在1894年，朝鲜已经连续两年大旱，整个国家民不聊生，饿殍遍野。朝鲜政府的横征暴敛却丝毫没有减少，政府的这些行为引起了民变。在东学党的领导下，朝鲜发生了大规模的农民起义。这场农民起义迅速蔓延到了朝鲜全国，前往镇压的朝鲜官军被打的一败涂地。到5月份，起义军已经占领了朝鲜的重镇全州，局势越来越不可控了。朝鲜政府开始变得非常慌张。"]]},"created_time":1763631871322,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"Hk8v-3mHKCiwEhA0-2F-sQ,\"start\",\"end\"","n":{"Hk8v-3mHKCiwEhA0-2F-sQ,\"start\",\"end\"":{"s":{"x":"Hk8v-3mHKCiwEhA0-2F-sQ","i":[{"t":"s"},{"t":"t","i":["qUg6Zv1mCNsC",1],"o":"start","l":163,"c":"在1894年，朝鲜已经连续两年大旱，整个国家民不聊生，饿殍遍野。朝鲜政府的横征暴敛却丝毫没有减少，政府的这些行为引起了民变。在东学党的领导下，朝鲜发生了大规模的农民起义。这场农民起义迅速蔓延到了朝鲜全国，前往镇压的朝鲜官军被打的一败涂地。到5月份，起义军已经占领了朝鲜的重镇全州，局势越来越不可控了。朝鲜政府开始变得非常慌张。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8044-9be8-ec2e2f09858d":{"value":{"id":"2b199968-1bdb-8044-9be8-ec2e2f09858d","version":3,"type":"text","properties":{"title":[["这时候朝鲜政府里面就有人提出来，说要向清朝借兵平叛。朝鲜是清朝的藩属国，以寻求天朝保护他们的名义，请求清朝出兵，也是比较合理的请求。袁世凯，当时是清朝派到朝鲜的最高代表，对于向清朝借兵，袁世凯是非常赞成的。首先呢让朝鲜快速的恢复稳定，本来就是袁世凯的职责。在他看来，现在仅凭朝鲜自己的官军，很难快速的把叛军镇压下去。如果清朝出兵，很快就可以解决问题。而且袁世凯他有过经验，十年前朝鲜出现政变的时候，就是清朝出兵，三天就解决了叛乱。还有就是清朝出兵对袁世凯有好处，袁世凯可以展示一下天朝上国的威力。要是清朝出兵平定了叛乱，袁世凯他作为清廷的代表，在朝鲜的地位就更高了。所以袁世凯积极的推动朝鲜借兵。"]]},"created_time":1763631871322,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"VfZ5uePS3T0BIf9y9Adz_Q,\"start\",\"end\"","n":{"VfZ5uePS3T0BIf9y9Adz_Q,\"start\",\"end\"":{"s":{"x":"VfZ5uePS3T0BIf9y9Adz_Q","i":[{"t":"s"},{"t":"t","i":["M-JzMVxtVT0d",1],"o":"start","l":298,"c":"这时候朝鲜政府里面就有人提出来，说要向清朝借兵平叛。朝鲜是清朝的藩属国，以寻求天朝保护他们的名义，请求清朝出兵，也是比较合理的请求。袁世凯，当时是清朝派到朝鲜的最高代表，对于向清朝借兵，袁世凯是非常赞成的。首先呢让朝鲜快速的恢复稳定，本来就是袁世凯的职责。在他看来，现在仅凭朝鲜自己的官军，很难快速的把叛军镇压下去。如果清朝出兵，很快就可以解决问题。而且袁世凯他有过经验，十年前朝鲜出现政变的时候，就是清朝出兵，三天就解决了叛乱。还有就是清朝出兵对袁世凯有好处，袁世凯可以展示一下天朝上国的威力。要是清朝出兵平定了叛乱，袁世凯他作为清廷的代表，在朝鲜的地位就更高了。所以袁世凯积极的推动朝鲜借兵。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8087-9235-ffe0b0e53fa6":{"value":{"id":"2b199968-1bdb-8087-9235-ffe0b0e53fa6","version":3,"type":"text","properties":{"title":[["对于朝鲜叛乱的动态呢，李鸿章也是时刻都在关心。袁世凯把朝鲜的情况，随时都通过电报给李鸿章进行汇报。对于朝鲜要请清朝出兵的事情啊，袁世凯也第一时间给李鸿章进行了汇报。李鸿章在接到电报之后，对于清朝是否应该出兵，他考虑的远比袁世凯要多。首先他要考虑在国际上的影响。朝鲜现在是开放通商的状态，英国、法国、美国等国家都有利益在朝鲜，清朝要是出兵，那得先考虑这些国际列强的看法。不过这个时候呢，西方国家的态度，是希望清朝去管一管朝鲜的。因为朝鲜社会要是一直都这么动荡，他们的利益都受到了损失。西方国家现在虽然不认可清朝和朝鲜的宗藩关系，但是他们也认可清朝和朝鲜有一种特殊的关系。他们都希望清朝可以出手，赶紧把这个叛乱给解决掉了。"]]},"created_time":1763631871323,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"-0Kd-WV0pPduXYH8_8Xx6w,\"start\",\"end\"","n":{"-0Kd-WV0pPduXYH8_8Xx6w,\"start\",\"end\"":{"s":{"x":"-0Kd-WV0pPduXYH8_8Xx6w","i":[{"t":"s"},{"t":"t","i":["dlIoPQ8io668",1],"o":"start","l":309,"c":"对于朝鲜叛乱的动态呢，李鸿章也是时刻都在关心。袁世凯把朝鲜的情况，随时都通过电报给李鸿章进行汇报。对于朝鲜要请清朝出兵的事情啊，袁世凯也第一时间给李鸿章进行了汇报。李鸿章在接到电报之后，对于清朝是否应该出兵，他考虑的远比袁世凯要多。首先他要考虑在国际上的影响。朝鲜现在是开放通商的状态，英国、法国、美国等国家都有利益在朝鲜，清朝要是出兵，那得先考虑这些国际列强的看法。不过这个时候呢，西方国家的态度，是希望清朝去管一管朝鲜的。因为朝鲜社会要是一直都这么动荡，他们的利益都受到了损失。西方国家现在虽然不认可清朝和朝鲜的宗藩关系，但是他们也认可清朝和朝鲜有一种特殊的关系。他们都希望清朝可以出手，赶紧把这个叛乱给解决掉了。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-807e-aa0d-d99cdc11b4c9":{"value":{"id":"2b199968-1bdb-807e-aa0d-d99cdc11b4c9","version":3,"type":"text","properties":{"title":[["在了解到西方国家的态度之后，李鸿章的考虑就是日本了。如果清朝出兵，日本会不会也出兵呢？日本和清朝目前的状况是比较紧张的，这点李鸿章是特别警惕的。李鸿章给袁世凯发电报，让袁世凯去了解一下日本的态度。"]]},"created_time":1763631871323,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"BxeFqhrp6iUcyPZHvof7AQ,\"start\",\"end\"","n":{"BxeFqhrp6iUcyPZHvof7AQ,\"start\",\"end\"":{"s":{"x":"BxeFqhrp6iUcyPZHvof7AQ","i":[{"t":"s"},{"t":"t","i":["BRqe9ePEuE5i",1],"o":"start","l":98,"c":"在了解到西方国家的态度之后，李鸿章的考虑就是日本了。如果清朝出兵，日本会不会也出兵呢？日本和清朝目前的状况是比较紧张的，这点李鸿章是特别警惕的。李鸿章给袁世凯发电报，让袁世凯去了解一下日本的态度。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8072-83fb-db5feaec050c":{"value":{"id":"2b199968-1bdb-8072-83fb-db5feaec050c","version":3,"type":"text","properties":{"title":[["日本的态度是什么呢？日本是想在这个乱局里面，找到可以入侵朝鲜的机会的。因为自从清朝派袁世凯干涉朝鲜内政之后，日本在朝鲜的利益就一直没法扩大。日本要是想再进一步的在朝鲜攫取利益，就只能找机会，通过发起战争的方式来扩大。这次朝鲜的动乱，正是日本等待已久的时机。日本是希望清朝出兵的，因为清朝一出兵，日本就可以有了出兵的理由。"]]},"created_time":1763631871323,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"W209U7m4PfiJQZDCWB5YPg,\"start\",\"end\"","n":{"W209U7m4PfiJQZDCWB5YPg,\"start\",\"end\"":{"s":{"x":"W209U7m4PfiJQZDCWB5YPg","i":[{"t":"s"},{"t":"t","i":["S-F59r3BMdss",1],"o":"start","l":160,"c":"日本的态度是什么呢？日本是想在这个乱局里面，找到可以入侵朝鲜的机会的。因为自从清朝派袁世凯干涉朝鲜内政之后，日本在朝鲜的利益就一直没法扩大。日本要是想再进一步的在朝鲜攫取利益，就只能找机会，通过发起战争的方式来扩大。这次朝鲜的动乱，正是日本等待已久的时机。日本是希望清朝出兵的，因为清朝一出兵，日本就可以有了出兵的理由。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-804e-8d06-f3ab1a5204b1":{"value":{"id":"2b199968-1bdb-804e-8d06-f3ab1a5204b1","version":3,"type":"text","properties":{"title":[["当时日本驻朝公使是大鸟圭介。大鸟圭介是个狠角色，他参与过日本国内的戊辰战争，参与过明治维新，他还去过欧美考察政治。他在日本以擅长谋略、遇事镇定而闻名。1894年的时候，大鸟圭介已经60多岁了，他有丰富的政治经验和外交经验。跟大鸟圭介相比呢，袁世凯他在外交上还是新手。大鸟圭介给袁世凯设了很多圈套，让袁世凯产生了很多误判。"]]},"created_time":1763631871324,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"DJb8VytGXMaAB56k_qxWVw,\"start\",\"end\"","n":{"DJb8VytGXMaAB56k_qxWVw,\"start\",\"end\"":{"s":{"x":"DJb8VytGXMaAB56k_qxWVw","i":[{"t":"s"},{"t":"t","i":["5cmljswqGI09",1],"o":"start","l":160,"c":"当时日本驻朝公使是大鸟圭介。大鸟圭介是个狠角色，他参与过日本国内的戊辰战争，参与过明治维新，他还去过欧美考察政治。他在日本以擅长谋略、遇事镇定而闻名。1894年的时候，大鸟圭介已经60多岁了，他有丰富的政治经验和外交经验。跟大鸟圭介相比呢，袁世凯他在外交上还是新手。大鸟圭介给袁世凯设了很多圈套，让袁世凯产生了很多误判。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8046-89ae-f23a15011783":{"value":{"id":"2b199968-1bdb-8046-89ae-f23a15011783","version":3,"type":"text","properties":{"title":[["在李鸿章和袁世凯考虑清朝是否应该出兵的时候，6月2号，日本驻朝公使派出了一个叫郑永邦的书记员去拜访袁世凯。郑永邦来见袁世凯，他是以询问东学党叛乱进展的名义来的。在谈话里面呀，郑永邦就诱导袁世凯，他说朝鲜这次叛乱时间太久了，我们日本的商业利益受到了很多损失，我看朝鲜政府自己是很难平定了，清政府为什么不能帮助朝鲜戡乱呢？袁世凯没反应过来啊，对方是在试探。他说我已经跟朝鲜政府商量好了，朝鲜会发出正式公文，向大清朝廷请求出兵。郑永邦在得到消息之后，日本国内立刻开始做了军事部署。日本的部署情况呢，我们后面会说。"]]},"created_time":1763631871324,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"4E-w4WPv_p47frUgNjslHg,\"start\",\"end\"","n":{"4E-w4WPv_p47frUgNjslHg,\"start\",\"end\"":{"s":{"x":"4E-w4WPv_p47frUgNjslHg","i":[{"t":"s"},{"t":"t","i":["-gULFqoH-Ig9",1],"o":"start","l":253,"c":"在李鸿章和袁世凯考虑清朝是否应该出兵的时候，6月2号，日本驻朝公使派出了一个叫郑永邦的书记员去拜访袁世凯。郑永邦来见袁世凯，他是以询问东学党叛乱进展的名义来的。在谈话里面呀，郑永邦就诱导袁世凯，他说朝鲜这次叛乱时间太久了，我们日本的商业利益受到了很多损失，我看朝鲜政府自己是很难平定了，清政府为什么不能帮助朝鲜戡乱呢？袁世凯没反应过来啊，对方是在试探。他说我已经跟朝鲜政府商量好了，朝鲜会发出正式公文，向大清朝廷请求出兵。郑永邦在得到消息之后，日本国内立刻开始做了军事部署。日本的部署情况呢，我们后面会说。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-80d4-a3be-f81fa7ff9d11":{"value":{"id":"2b199968-1bdb-80d4-a3be-f81fa7ff9d11","version":3,"type":"text","properties":{"title":[["在会面之后，袁世凯也给李鸿章发了电报，他汇报了他跟日本使节见面的事情。他说日本因为利益受到损失，希望清朝可以出兵平叛，日本没有表现出其他的意思。第二天，日本又派了一个人出来跟袁世凯谈话，这次来的是杉村濬。这时候大鸟圭介已经回日本述职了，杉村濬是日本在朝鲜的最高官员，是日本驻朝代办公使。杉村濬来找袁世凯呢，也是跟袁世凯聊让清朝出兵的事。他重点说的是希望清朝可以快点出兵，清朝出兵之后，可以快点平叛，快点让朝鲜恢复商业。但是呢在他的谈话过程中，他半开玩笑的说了一句话，他说：“贵国要是出兵的话，迫于形势，我国也不得不出兵了，实在是为难啊。”"]]},"created_time":1763631871324,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"qBGdMMDagUug8w9IXLUlCA,\"start\",\"end\"","n":{"qBGdMMDagUug8w9IXLUlCA,\"start\",\"end\"":{"s":{"x":"qBGdMMDagUug8w9IXLUlCA","i":[{"t":"s"},{"t":"t","i":["4YNnszXlJqGR",1],"o":"start","l":269,"c":"在会面之后，袁世凯也给李鸿章发了电报，他汇报了他跟日本使节见面的事情。他说日本因为利益受到损失，希望清朝可以出兵平叛，日本没有表现出其他的意思。第二天，日本又派了一个人出来跟袁世凯谈话，这次来的是杉村濬。这时候大鸟圭介已经回日本述职了，杉村濬是日本在朝鲜的最高官员，是日本驻朝代办公使。杉村濬来找袁世凯呢，也是跟袁世凯聊让清朝出兵的事。他重点说的是希望清朝可以快点出兵，清朝出兵之后，可以快点平叛，快点让朝鲜恢复商业。但是呢在他的谈话过程中，他半开玩笑的说了一句话，他说：“贵国要是出兵的话，迫于形势，我国也不得不出兵了，实在是为难啊。”"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-801f-a605-c19b3c274880":{"value":{"id":"2b199968-1bdb-801f-a605-c19b3c274880","version":3,"type":"text","properties":{"title":[["袁世凯立刻紧张起来了，他正色的问：“你们为什么要出兵呢？”杉村濬说：“我们出兵，是为了保护日本公使馆和日本侨民啊。”袁世凯说：“我清国出兵是应朝鲜政府的请求，是来平定乱民的，不会危及到贵国侨民的安全。”杉村濬为了消除袁世凯的警觉，他就说：“我说的是玩笑话，当不得真，阁下不必多虑。但是贵国如果出兵，请阁下务必转告我国。”"]]},"created_time":1763631871324,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"b0rt9ptb0JdmQb7H42SBQQ,\"start\",\"end\"","n":{"b0rt9ptb0JdmQb7H42SBQQ,\"start\",\"end\"":{"s":{"x":"b0rt9ptb0JdmQb7H42SBQQ","i":[{"t":"s"},{"t":"t","i":["h0M9ehxXpu1h",1],"o":"start","l":160,"c":"袁世凯立刻紧张起来了，他正色的问：“你们为什么要出兵呢？”杉村濬说：“我们出兵，是为了保护日本公使馆和日本侨民啊。”袁世凯说：“我清国出兵是应朝鲜政府的请求，是来平定乱民的，不会危及到贵国侨民的安全。”杉村濬为了消除袁世凯的警觉，他就说：“我说的是玩笑话，当不得真，阁下不必多虑。但是贵国如果出兵，请阁下务必转告我国。”"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-809d-81ec-c036da7eaf04":{"value":{"id":"2b199968-1bdb-809d-81ec-c036da7eaf04","version":3,"type":"text","properties":{"title":[["当天晚上，袁世凯给李鸿章发去电报，汇报了他跟杉村濬的会谈情况。他说杉村濬的谈话重点放在恢复通商，根据袁世凯他自己的判断，日本应该不会出兵，即使出兵，也只是派少量兵来保护日本使馆，对我们的出兵应该不会有影响。就在同一天，朝鲜政府向袁世凯正式递交了正式的请求支援的文件，袁世凯把这个文件用电报也发送给了李鸿章。在得到袁世凯的外交情况之后，李鸿章对日本出兵的防范就降低一些了。"]]},"created_time":1763631871325,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"ZFUhVGjGvBmINYCgUVgkkw,\"start\",\"end\"","n":{"ZFUhVGjGvBmINYCgUVgkkw,\"start\",\"end\"":{"s":{"x":"ZFUhVGjGvBmINYCgUVgkkw","i":[{"t":"s"},{"t":"t","i":["kPRYSgs7l6yG",1],"o":"start","l":185,"c":"当天晚上，袁世凯给李鸿章发去电报，汇报了他跟杉村濬的会谈情况。他说杉村濬的谈话重点放在恢复通商，根据袁世凯他自己的判断，日本应该不会出兵，即使出兵，也只是派少量兵来保护日本使馆，对我们的出兵应该不会有影响。就在同一天，朝鲜政府向袁世凯正式递交了正式的请求支援的文件，袁世凯把这个文件用电报也发送给了李鸿章。在得到袁世凯的外交情况之后，李鸿章对日本出兵的防范就降低一些了。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-80f9-9129-d862e8de57c3":{"value":{"id":"2b199968-1bdb-80f9-9129-d862e8de57c3","version":3,"type":"text","properties":{"title":[["不过呢，他还需要进一步的去验证日本的情况。关于李鸿章跟日本人的沟通啊，李鸿章除了袁世凯这条线之外，他还有一条通道，就是清朝驻日公使汪凤藻。这时候，清朝和日本已经互派使节有十多年了。1894年，清朝的驻日公使是汪凤藻。汪凤藻这个人，也是甲午战争里面的一个重要人物。汪凤藻从日本的角度出发，给李鸿章做了分析。他说日本在1889年公布了新的宪法，宪法公布之后，日本就进入到了宪政状态。进入到宪政状态就有了议会。日本自从有了议会，这四年以来，议会整天都在打架，日本政府根本就没有力量。所以如果清朝出兵朝鲜，日本即便是不情愿，他也没有力量出兵。这是汪凤藻的分析，他的这个分析对李鸿章的影响很大。"]]},"created_time":1763631871325,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"TVUls4xTpYfFnvNqHa_Rnw,\"start\",\"end\"","n":{"TVUls4xTpYfFnvNqHa_Rnw,\"start\",\"end\"":{"s":{"x":"TVUls4xTpYfFnvNqHa_Rnw","i":[{"t":"s"},{"t":"t","i":["SKtOvRPATMuZ",1],"o":"start","l":292,"c":"不过呢，他还需要进一步的去验证日本的情况。关于李鸿章跟日本人的沟通啊，李鸿章除了袁世凯这条线之外，他还有一条通道，就是清朝驻日公使汪凤藻。这时候，清朝和日本已经互派使节有十多年了。1894年，清朝的驻日公使是汪凤藻。汪凤藻这个人，也是甲午战争里面的一个重要人物。汪凤藻从日本的角度出发，给李鸿章做了分析。他说日本在1889年公布了新的宪法，宪法公布之后，日本就进入到了宪政状态。进入到宪政状态就有了议会。日本自从有了议会，这四年以来，议会整天都在打架，日本政府根本就没有力量。所以如果清朝出兵朝鲜，日本即便是不情愿，他也没有力量出兵。这是汪凤藻的分析，他的这个分析对李鸿章的影响很大。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-80af-b071-c30622c2751f":{"value":{"id":"2b199968-1bdb-80af-b071-c30622c2751f","version":3,"type":"text","properties":{"title":[["有了袁世凯的判断，有了汪凤藻的分析，李鸿章就做了决定，上奏朝廷出兵朝鲜。这里我们说啊，汪凤藻的这个分析，从事后来看是非常严重的误判。当时日本得知清朝出兵的消息之后，立刻成立了「战时大本营」。日本的「战时大本营」就是把立法部门、行政部门、军事部门都集中到一起，这样可以对战事进行最有效的调度。汪凤藻他看到日本议会上的冲突，其实大部分都是表面现象。日本此刻的政府，他们不会因为内耗而牵扯到对外的战事。反而呢，当时清朝的党争，会牵扯到很多对外的战事。清朝的清流党对李鸿章的争斗，也可以说帝党和后党的争斗，对前线的战局影响非常大。这个后续我们会说到。"]]},"created_time":1763631871325,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"4m3pra7ELYguYx13o3VG1A,\"start\",\"end\"","n":{"4m3pra7ELYguYx13o3VG1A,\"start\",\"end\"":{"s":{"x":"4m3pra7ELYguYx13o3VG1A","i":[{"t":"s"},{"t":"t","i":["xYEO7EJ97U80",1],"o":"start","l":271,"c":"有了袁世凯的判断，有了汪凤藻的分析，李鸿章就做了决定，上奏朝廷出兵朝鲜。这里我们说啊，汪凤藻的这个分析，从事后来看是非常严重的误判。当时日本得知清朝出兵的消息之后，立刻成立了「战时大本营」。日本的「战时大本营」就是把立法部门、行政部门、军事部门都集中到一起，这样可以对战事进行最有效的调度。汪凤藻他看到日本议会上的冲突，其实大部分都是表面现象。日本此刻的政府，他们不会因为内耗而牵扯到对外的战事。反而呢，当时清朝的党争，会牵扯到很多对外的战事。清朝的清流党对李鸿章的争斗，也可以说帝党和后党的争斗，对前线的战局影响非常大。这个后续我们会说到。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8036-9d25-e5aaddcddbb6":{"value":{"id":"2b199968-1bdb-8036-9d25-e5aaddcddbb6","version":3,"type":"text","properties":{"title":[["不管怎么样，有了袁世凯和汪凤藻两条线的两个方面的分析之后，李鸿章决定出兵。李鸿章派出的是叶志超和聂士成的部队。叶志超是直隶提督，聂士成是太原镇总兵，他们两支部队都是属于淮军体系，一共有2,465人。这两支部队是李鸿章派出的先头部队，然后李鸿章在国内继续的集结部队，后续的部队打算陆续派出。"]]},"created_time":1763631871325,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"4-92-FGG694WpgN3q2NqAQ,\"start\",\"end\"","n":{"4-92-FGG694WpgN3q2NqAQ,\"start\",\"end\"":{"s":{"x":"4-92-FGG694WpgN3q2NqAQ","i":[{"t":"s"},{"t":"t","i":["uYRsW2rFuymW",1],"o":"start","l":144,"c":"不管怎么样，有了袁世凯和汪凤藻两条线的两个方面的分析之后，李鸿章决定出兵。李鸿章派出的是叶志超和聂士成的部队。叶志超是直隶提督，聂士成是太原镇总兵，他们两支部队都是属于淮军体系，一共有2,465人。这两支部队是李鸿章派出的先头部队，然后李鸿章在国内继续的集结部队，后续的部队打算陆续派出。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-80f1-bc54-e466abef595c":{"value":{"id":"2b199968-1bdb-80f1-bc54-e466abef595c","version":3,"type":"text","properties":{"title":[["6月6号，叶志超和聂士成率军出发，他们走的是海路，准备在朝鲜牙山湾登陆。清军出发的当天，李鸿章就让汪凤藻向日本政府通报，告诉日本政府清朝已经派兵了。李鸿章这是在尽1885年他和日本签的《天津条约》里面的义务。日本在收到李鸿章的通报之后，其实啊日本已经在之前的一天，也就是6月5号就成立战时大本营了。6号李鸿章递交照会的时候，驻扎在广岛的日军混成旅就已经在集结之中了。事实上在好几天之前，当郑永邦从袁世凯口里面得到了清朝有意向派兵之后，日本政府就已经开始做军事准备了。日本成立战时大本营，就已经是下了大决心要发起一场战争。"]]},"created_time":1763631871326,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"cESB3m0ZR0suX232E_mcEg,\"start\",\"end\"","n":{"cESB3m0ZR0suX232E_mcEg,\"start\",\"end\"":{"s":{"x":"cESB3m0ZR0suX232E_mcEg","i":[{"t":"s"},{"t":"t","i":["89bhMPcligAR",1],"o":"start","l":260,"c":"6月6号，叶志超和聂士成率军出发，他们走的是海路，准备在朝鲜牙山湾登陆。清军出发的当天，李鸿章就让汪凤藻向日本政府通报，告诉日本政府清朝已经派兵了。李鸿章这是在尽1885年他和日本签的《天津条约》里面的义务。日本在收到李鸿章的通报之后，其实啊日本已经在之前的一天，也就是6月5号就成立战时大本营了。6号李鸿章递交照会的时候，驻扎在广岛的日军混成旅就已经在集结之中了。事实上在好几天之前，当郑永邦从袁世凯口里面得到了清朝有意向派兵之后，日本政府就已经开始做军事准备了。日本成立战时大本营，就已经是下了大决心要发起一场战争。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8066-8554-e6e2364e97d5":{"value":{"id":"2b199968-1bdb-8066-8554-e6e2364e97d5","version":3,"type":"text","properties":{"title":[["6月7号，也就是汪凤藻通知日本人的第二天，日本的驻清朝公使给总理衙门递交照会，照会的内容是日本也将派兵进入朝鲜。日本派兵的理由，并不是根据《天津条约》的约定，因为《天津条约》只是约定了双方出兵的时候需要互相告知对方。日本说他自己出兵的理由是，根据1885年日本和朝鲜签订的《济物浦条约》，日本有权派出军队去保护本国的商业利益和国民安全。"]]},"created_time":1763631871326,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"y83mFO4UTcSZUWx9geP5Gg,\"start\",\"end\"","n":{"y83mFO4UTcSZUWx9geP5Gg,\"start\",\"end\"":{"s":{"x":"y83mFO4UTcSZUWx9geP5Gg","i":[{"t":"s"},{"t":"t","i":["Gmfp32JKrpJM",1],"o":"start","l":168,"c":"6月7号，也就是汪凤藻通知日本人的第二天，日本的驻清朝公使给总理衙门递交照会，照会的内容是日本也将派兵进入朝鲜。日本派兵的理由，并不是根据《天津条约》的约定，因为《天津条约》只是约定了双方出兵的时候需要互相告知对方。日本说他自己出兵的理由是，根据1885年日本和朝鲜签订的《济物浦条约》，日本有权派出军队去保护本国的商业利益和国民安全。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8047-a0dd-d8f83767a5e4":{"value":{"id":"2b199968-1bdb-8047-a0dd-d8f83767a5e4","version":3,"type":"text","properties":{"title":[["关于清朝和日本的出兵，我们说一下啊，双方现在是各有各的道理，谁都不承认对方的。清朝出兵法理依据是天朝保护属邦，是朝鲜政府发出的正式公文邀请清朝出兵，这看起来是非常合理的一个情况。但是日本并不承认，日本不承认清朝和朝鲜的宗藩关系，日本认为朝鲜属于独立的国家。反而日本的出兵，他们认为是根据他们和朝鲜签的《济物浦条约》，《济物浦条约》是符合国际法的。所以呢清朝和日本在法理性上各有各的说法。"]]},"created_time":1763631871326,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"_Beg55kL83MOBqZoib4l6Q,\"start\",\"end\"","n":{"_Beg55kL83MOBqZoib4l6Q,\"start\",\"end\"":{"s":{"x":"_Beg55kL83MOBqZoib4l6Q","i":[{"t":"s"},{"t":"t","i":["iHZZVgaeJtFP",1],"o":"start","l":193,"c":"关于清朝和日本的出兵，我们说一下啊，双方现在是各有各的道理，谁都不承认对方的。清朝出兵法理依据是天朝保护属邦，是朝鲜政府发出的正式公文邀请清朝出兵，这看起来是非常合理的一个情况。但是日本并不承认，日本不承认清朝和朝鲜的宗藩关系，日本认为朝鲜属于独立的国家。反而日本的出兵，他们认为是根据他们和朝鲜签的《济物浦条约》，《济物浦条约》是符合国际法的。所以呢清朝和日本在法理性上各有各的说法。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8083-a8b0-e145ddc59d12":{"value":{"id":"2b199968-1bdb-8083-a8b0-e145ddc59d12","version":3,"type":"text","properties":{"title":[["李鸿章在得到消息之后，心中感到不妙。他立刻给袁世凯发电报，让袁世凯去查探日本出兵的目的。第二天，李鸿章得到了袁世凯的回复。袁世凯说日本驻朝公使给他送来了一封信件，信件的内容写的是，日本派兵到朝鲜的目的呢，是保护使馆，并无他意。李鸿章在收到袁世凯的电报之后，稍微安心了一些。其实事后证明啊，日本使馆给袁世凯的这封信，也是为了诱导袁世凯和李鸿章，让他们放松警惕。"]]},"created_time":1763631871326,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"lcKZ2iIJF_IrYMHOTH4eNw,\"start\",\"end\"","n":{"lcKZ2iIJF_IrYMHOTH4eNw,\"start\",\"end\"":{"s":{"x":"lcKZ2iIJF_IrYMHOTH4eNw","i":[{"t":"s"},{"t":"t","i":["Tsv6a_cXOtKY",1],"o":"start","l":179,"c":"李鸿章在得到消息之后，心中感到不妙。他立刻给袁世凯发电报，让袁世凯去查探日本出兵的目的。第二天，李鸿章得到了袁世凯的回复。袁世凯说日本驻朝公使给他送来了一封信件，信件的内容写的是，日本派兵到朝鲜的目的呢，是保护使馆，并无他意。李鸿章在收到袁世凯的电报之后，稍微安心了一些。其实事后证明啊，日本使馆给袁世凯的这封信，也是为了诱导袁世凯和李鸿章，让他们放松警惕。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-801d-814e-c2ccf6579c95":{"value":{"id":"2b199968-1bdb-801d-814e-c2ccf6579c95","version":3,"type":"text","properties":{"title":[["听说清朝和日本都出兵了，朝鲜政府开始害怕了。朝鲜政府派人跟东学党的起义军谈判，政府军和起义军都认为，如果再打下去，引来外国势力的介入，那就不好收场了。双方谈判之后，达成了和解条件。6月10号，朝鲜政府和东学党签署了《全州合约》，这场起义就算是和平结束了。"]]},"created_time":1763631871327,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"KVb8eSU6nHudALnZ7_6N7g,\"start\",\"end\"","n":{"KVb8eSU6nHudALnZ7_6N7g,\"start\",\"end\"":{"s":{"x":"KVb8eSU6nHudALnZ7_6N7g","i":[{"t":"s"},{"t":"t","i":["0i2m-iU6paz9",1],"o":"start","l":127,"c":"听说清朝和日本都出兵了，朝鲜政府开始害怕了。朝鲜政府派人跟东学党的起义军谈判，政府军和起义军都认为，如果再打下去，引来外国势力的介入，那就不好收场了。双方谈判之后，达成了和解条件。6月10号，朝鲜政府和东学党签署了《全州合约》，这场起义就算是和平结束了。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8063-8a4d-d8992ae1f62a":{"value":{"id":"2b199968-1bdb-8063-8a4d-d8992ae1f62a","version":3,"type":"text","properties":{"title":[["但是这时候，清军和日军都已经到了朝鲜了。就在朝鲜政府和东学党签合约的前一天，6月9号，清军的部队在朝鲜牙山登陆，日军的部队在朝鲜仁川登陆。清军和日军同一天在朝鲜登陆了。清军是叶志超和聂士成率领的部队，有2,465人。日军是驻朝公使大鸟圭介率领的武装警察和海军水兵队，有488人。清军在登陆之后，驻扎在牙山按兵不动。日军在登陆之后的第二天，他们不顾朝鲜政府的反对，直接进入到了朝鲜的首都汉城。"]]},"created_time":1763631871327,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"GtQGpOBIeX0HWQV_-TT-Lw,\"start\",\"end\"","n":{"GtQGpOBIeX0HWQV_-TT-Lw,\"start\",\"end\"":{"s":{"x":"GtQGpOBIeX0HWQV_-TT-Lw","i":[{"t":"s"},{"t":"t","i":["2T8Q8OHncQrO",1],"o":"start","l":195,"c":"但是这时候，清军和日军都已经到了朝鲜了。就在朝鲜政府和东学党签合约的前一天，6月9号，清军的部队在朝鲜牙山登陆，日军的部队在朝鲜仁川登陆。清军和日军同一天在朝鲜登陆了。清军是叶志超和聂士成率领的部队，有2,465人。日军是驻朝公使大鸟圭介率领的武装警察和海军水兵队，有488人。清军在登陆之后，驻扎在牙山按兵不动。日军在登陆之后的第二天，他们不顾朝鲜政府的反对，直接进入到了朝鲜的首都汉城。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-80fa-9a7f-ff7c02d7f47a":{"value":{"id":"2b199968-1bdb-80fa-9a7f-ff7c02d7f47a","version":3,"type":"text","properties":{"title":[["朝鲜政府在跟起义军谈成协定之后，立刻就跟袁世凯说，说叛乱已经消除了，清军是不是就别来了？袁世凯说先头部队已经到了，没办法了，后面的增援部队我去协调，就先不派了。朝鲜政府也跟日本公使说，说叛乱已经消除了，你们的军队能不能不要来了？日本公使说，我们是根据协约来的，不可能直接就退回去。这时候朝鲜政府的局面就变得很尴尬，局势也很紧张，日军和清军都来了，请神容易送神难，谁也不肯先撤。"]]},"created_time":1763631871327,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"C3JWKqBASgSGPlEYmRRfFg,\"start\",\"end\"","n":{"C3JWKqBASgSGPlEYmRRfFg,\"start\",\"end\"":{"s":{"x":"C3JWKqBASgSGPlEYmRRfFg","i":[{"t":"s"},{"t":"t","i":["ggHE7CX8ejI-",1],"o":"start","l":188,"c":"朝鲜政府在跟起义军谈成协定之后，立刻就跟袁世凯说，说叛乱已经消除了，清军是不是就别来了？袁世凯说先头部队已经到了，没办法了，后面的增援部队我去协调，就先不派了。朝鲜政府也跟日本公使说，说叛乱已经消除了，你们的军队能不能不要来了？日本公使说，我们是根据协约来的，不可能直接就退回去。这时候朝鲜政府的局面就变得很尴尬，局势也很紧张，日军和清军都来了，请神容易送神难，谁也不肯先撤。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8010-bff5-f4bce8e4d9a8":{"value":{"id":"2b199968-1bdb-8010-bff5-f4bce8e4d9a8","version":3,"type":"text","properties":{"title":[["朝鲜还是先做袁世凯的工作。袁世凯汇报给李鸿章，李鸿章说清朝可以撤军，但是条件是需要日本同时撤军。李鸿章把这个意思传达给了日本政府。日本内阁就开会讨论，讨论共同撤军的议题。他们讨论的过程是主战派占了上风。主战派的理由主要有两个："]]},"created_time":1763631871327,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"HxyvcJkT8v1qM-VTo-_cag,\"start\",\"end\"","n":{"HxyvcJkT8v1qM-VTo-_cag,\"start\",\"end\"":{"s":{"x":"HxyvcJkT8v1qM-VTo-_cag","i":[{"t":"s"},{"t":"t","i":["A_QfyNG0IDTC",1],"o":"start","l":113,"c":"朝鲜还是先做袁世凯的工作。袁世凯汇报给李鸿章，李鸿章说清朝可以撤军，但是条件是需要日本同时撤军。李鸿章把这个意思传达给了日本政府。日本内阁就开会讨论，讨论共同撤军的议题。他们讨论的过程是主战派占了上风。主战派的理由主要有两个："},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8069-929b-c4fd49699453":{"value":{"id":"2b199968-1bdb-8069-929b-c4fd49699453","version":3,"type":"text","properties":{"title":[["第一个是跟日本的体制有关。日本政府这时候已经成立了战时大本营，已经把军队给派出去了，他们就说一定要拿到利益，否则没法回来。因为日本这时候已经成立国会了，他们要对国会有交代，国会是要对日本的国民负责。当时日本国民的情绪都倾向于开战。因为在这之前的10年，日本政府一直都在舆论上带节奏，说清朝抢走了他们在朝鲜的利益，日本国民就很恼火，日本国民一直都把清朝作为假想敌。这次朝鲜的亲日派金玉均被刺杀事件，又在日本的舆论里面点了一把火，所以日本国内的战争情绪就蔓延开了。在这种情况之下，日本要是撤军，政府没法跟国会交代。这是主战牌的第一个理由。"]]},"created_time":1763631871328,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"-ctXwb1u9XxLR0WQXFXOCw,\"start\",\"end\"","n":{"-ctXwb1u9XxLR0WQXFXOCw,\"start\",\"end\"":{"s":{"x":"-ctXwb1u9XxLR0WQXFXOCw","i":[{"t":"s"},{"t":"t","i":["5ZwqQeL3X6Qi",1],"o":"start","l":267,"c":"第一个是跟日本的体制有关。日本政府这时候已经成立了战时大本营，已经把军队给派出去了，他们就说一定要拿到利益，否则没法回来。因为日本这时候已经成立国会了，他们要对国会有交代，国会是要对日本的国民负责。当时日本国民的情绪都倾向于开战。因为在这之前的10年，日本政府一直都在舆论上带节奏，说清朝抢走了他们在朝鲜的利益，日本国民就很恼火，日本国民一直都把清朝作为假想敌。这次朝鲜的亲日派金玉均被刺杀事件，又在日本的舆论里面点了一把火，所以日本国内的战争情绪就蔓延开了。在这种情况之下，日本要是撤军，政府没法跟国会交代。这是主战牌的第一个理由。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8057-acda-ee9a0fbeff3b":{"value":{"id":"2b199968-1bdb-8057-acda-ee9a0fbeff3b","version":3,"type":"text","properties":{"title":[["第二个理由呢，是日本一直都处心积虑的想要扩大在朝鲜的利益。但是自从清朝派袁世凯到朝鲜之后，朝鲜的内政就被袁世凯牢牢的把控著，日本没法获得更多的利益。他们认为日本必须抓住这次机会，改变朝鲜的政局。伊藤博文提出来一个策略，他提的策略是，日本和清朝一起对朝鲜的内政进行改革。他这个提议呢，如果清朝同意，日本就能参与到朝鲜内政的改革过程，日本想扩大利益的想法也能得到满足。如果清朝不同意——其实伊藤博文说了，他认为清朝不同意的可能性是更大的——如果清朝不同意，日本就坚持日本自己也必须要给朝鲜内政进行改革。要是因为这个分歧导致日本和朝鲜发生战争，日本在国际上也有了合理的理由。这样日本就可以减少各个列强对日本的谴责。因为日本这时候啊，他也得考虑西方列强的态度，他还不能贸然的宣战，西方列强毕竟都有商业利益在朝鲜，日本得考虑国际上的舆论。日本找一个理由帮助朝鲜改革内政，他明面上说的是，如果朝鲜的内政不改革，以后肯定还会发生类似东学党这样的叛乱，所以日本提出的改革内政的做法，他认为是合理的。但是清朝不同意，那就是清朝的问题了，如果因此开战，日本也有说辞。所以伊藤博文用这样的方式来规避国际的谴责。"]]},"created_time":1763631871328,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"dAfrKblV20Q8KHFi9bzUrQ,\"start\",\"end\"","n":{"dAfrKblV20Q8KHFi9bzUrQ,\"start\",\"end\"":{"s":{"x":"dAfrKblV20Q8KHFi9bzUrQ","i":[{"t":"s"},{"t":"t","i":["qL56gVELY31e",1],"o":"start","l":494,"c":"第二个理由呢，是日本一直都处心积虑的想要扩大在朝鲜的利益。但是自从清朝派袁世凯到朝鲜之后，朝鲜的内政就被袁世凯牢牢的把控著，日本没法获得更多的利益。他们认为日本必须抓住这次机会，改变朝鲜的政局。伊藤博文提出来一个策略，他提的策略是，日本和清朝一起对朝鲜的内政进行改革。他这个提议呢，如果清朝同意，日本就能参与到朝鲜内政的改革过程，日本想扩大利益的想法也能得到满足。如果清朝不同意——其实伊藤博文说了，他认为清朝不同意的可能性是更大的——如果清朝不同意，日本就坚持日本自己也必须要给朝鲜内政进行改革。要是因为这个分歧导致日本和朝鲜发生战争，日本在国际上也有了合理的理由。这样日本就可以减少各个列强对日本的谴责。因为日本这时候啊，他也得考虑西方列强的态度，他还不能贸然的宣战，西方列强毕竟都有商业利益在朝鲜，日本得考虑国际上的舆论。日本找一个理由帮助朝鲜改革内政，他明面上说的是，如果朝鲜的内政不改革，以后肯定还会发生类似东学党这样的叛乱，所以日本提出的改革内政的做法，他认为是合理的。但是清朝不同意，那就是清朝的问题了，如果因此开战，日本也有说辞。所以伊藤博文用这样的方式来规避国际的谴责。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8058-ba27-d17e0e0bf114":{"value":{"id":"2b199968-1bdb-8058-ba27-d17e0e0bf114","version":3,"type":"text","properties":{"title":[["日本内阁讨论的结果，最重要的结论就是提出了这个方案：日本和清朝一起改革朝鲜内政。关于撤军的问题呢，日本内阁也进行了讨论，他们的结论是不仅不能撤军，还要继续加派军队进入朝鲜。"]]},"created_time":1763631871328,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"Vn45v2kuyClKj9Zmbvo7IQ,\"start\",\"end\"","n":{"Vn45v2kuyClKj9Zmbvo7IQ,\"start\",\"end\"":{"s":{"x":"Vn45v2kuyClKj9Zmbvo7IQ","i":[{"t":"s"},{"t":"t","i":["ozfGEo_31Uir",1],"o":"start","l":86,"c":"日本内阁讨论的结果，最重要的结论就是提出了这个方案：日本和清朝一起改革朝鲜内政。关于撤军的问题呢，日本内阁也进行了讨论，他们的结论是不仅不能撤军，还要继续加派军队进入朝鲜。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8005-97c4-cffc544a5530":{"value":{"id":"2b199968-1bdb-8005-97c4-cffc544a5530","version":3,"type":"text","properties":{"title":[["日本为什么会做出这样的决策呢？我们看一本回忆录，这本回忆录叫《蹇蹇录》。通过这本回忆录，对我们理解日本在甲午战争里面做的各种决策，有很大的参考价值。《蹇蹇录》的作者是陆奥宗光，陆奥宗光当时是日本外务省大臣，他在整个甲午战争里面是日本的一个重要决策人，他参与了甲午战争从决策到开战，到最后签订《马关条约》的全过程。他是在甲午战争结束之后写的这本《蹇蹇录》。《蹇蹇录》这个名字，它取的是中国古代经典里面的一个词语「蹇蹇匪躬」，意思是指大臣劳心劳力，全心全意的侍奉君主。所以呢他写这本《蹇蹇录》的用意，是在向明治天皇说明他自己的功绩。他写了整场战争是如何开战的，是如何获胜的，如何和谈的，但是最后却受到了三国干涉还辽的经过。"]]},"created_time":1763631871328,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"gBCzsKrbOyKkeajyYo0RsA,\"start\",\"end\"","n":{"gBCzsKrbOyKkeajyYo0RsA,\"start\",\"end\"":{"s":{"x":"gBCzsKrbOyKkeajyYo0RsA","i":[{"t":"s"},{"t":"t","i":["u9TJeOab_kR9",1],"o":"start","l":309,"c":"日本为什么会做出这样的决策呢？我们看一本回忆录，这本回忆录叫《蹇蹇录》。通过这本回忆录，对我们理解日本在甲午战争里面做的各种决策，有很大的参考价值。《蹇蹇录》的作者是陆奥宗光，陆奥宗光当时是日本外务省大臣，他在整个甲午战争里面是日本的一个重要决策人，他参与了甲午战争从决策到开战，到最后签订《马关条约》的全过程。他是在甲午战争结束之后写的这本《蹇蹇录》。《蹇蹇录》这个名字，它取的是中国古代经典里面的一个词语「蹇蹇匪躬」，意思是指大臣劳心劳力，全心全意的侍奉君主。所以呢他写这本《蹇蹇录》的用意，是在向明治天皇说明他自己的功绩。他写了整场战争是如何开战的，是如何获胜的，如何和谈的，但是最后却受到了三国干涉还辽的经过。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8018-a656-fb6301593d38":{"value":{"id":"2b199968-1bdb-8018-a656-fb6301593d38","version":3,"type":"text","properties":{"title":[["关于日本为什么还要继续往朝鲜增兵，陆奥宗光在《蹇蹇录》里面这么说的。他说：“我国政府在外交方面居于被动者地位，而在军事方面则要时刻掌握先机。”我们看他说的这两句话，他先说的是，我国在外交方面处于被动地位。这句话指的是朝鲜发生动乱，需要求援的时候，肯定是先向清朝求援，不可能向日本求援。清朝是可以先出兵的，日本不能第一时间出兵，日本只能等待清朝出兵之后，对方根据《天津条约》的约定会通知日本，日本才能出兵。所以他认为，日本在外交上是处于被动地位的。但是呢他说在军事方面，日本要时刻掌握先机。说的就是日本的军队一定要先准备好，随时准备出发，而且日本派到朝鲜的军队一定要比清军多。"]]},"created_time":1763631871329,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"1IxApeqoTco0HYK9idl6Og,\"start\",\"end\"","n":{"1IxApeqoTco0HYK9idl6Og,\"start\",\"end\"":{"s":{"x":"1IxApeqoTco0HYK9idl6Og","i":[{"t":"s"},{"t":"t","i":["_8yzA0HcUnox",1],"o":"start","l":287,"c":"关于日本为什么还要继续往朝鲜增兵，陆奥宗光在《蹇蹇录》里面这么说的。他说：“我国政府在外交方面居于被动者地位，而在军事方面则要时刻掌握先机。”我们看他说的这两句话，他先说的是，我国在外交方面处于被动地位。这句话指的是朝鲜发生动乱，需要求援的时候，肯定是先向清朝求援，不可能向日本求援。清朝是可以先出兵的，日本不能第一时间出兵，日本只能等待清朝出兵之后，对方根据《天津条约》的约定会通知日本，日本才能出兵。所以他认为，日本在外交上是处于被动地位的。但是呢他说在军事方面，日本要时刻掌握先机。说的就是日本的军队一定要先准备好，随时准备出发，而且日本派到朝鲜的军队一定要比清军多。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-803e-b0de-d7a010d4e536":{"value":{"id":"2b199968-1bdb-803e-b0de-d7a010d4e536","version":3,"type":"text","properties":{"title":[["这点很重要，为什么说这点很重要呢？因为在十年之前，朝鲜发生甲申政变的时候，日军已经占领了朝鲜皇宫了，占有了有利的地势，但是被袁世凯只用一天的时间就给攻下来了。日本对此记忆犹新，所以这次日本派出的军队，一定要保证在兵力上远远高于清军。所以，日本就决定要继续往朝鲜加派军队。但是目前在朝鲜，清军的兵力是大于日本的，清军已经到了2,000多人，而日本才有400多人。日本害怕清军突然出手，快速的控制局面，重现十年以前袁世凯快速攻入王宫的那个局面。"]]},"created_time":1763631871329,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"pDd_N8gNkuzHNLFHrL79tA,\"start\",\"end\"","n":{"pDd_N8gNkuzHNLFHrL79tA,\"start\",\"end\"":{"s":{"x":"pDd_N8gNkuzHNLFHrL79tA","i":[{"t":"s"},{"t":"t","i":["lNt1t22-7-tE",1],"o":"start","l":220,"c":"这点很重要，为什么说这点很重要呢？因为在十年之前，朝鲜发生甲申政变的时候，日军已经占领了朝鲜皇宫了，占有了有利的地势，但是被袁世凯只用一天的时间就给攻下来了。日本对此记忆犹新，所以这次日本派出的军队，一定要保证在兵力上远远高于清军。所以，日本就决定要继续往朝鲜加派军队。但是目前在朝鲜，清军的兵力是大于日本的，清军已经到了2,000多人，而日本才有400多人。日本害怕清军突然出手，快速的控制局面，重现十年以前袁世凯快速攻入王宫的那个局面。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-80a7-80cc-fb3d1a3dd243":{"value":{"id":"2b199968-1bdb-80a7-80cc-fb3d1a3dd243","version":3,"type":"text","properties":{"title":[["所以，大鸟圭介用了个计策来稳住袁世凯。6月13号，大鸟圭介去找袁世凯会谈。在这次会谈过程中，袁世凯还是采取了李鸿章的观点，说要两个国家协商，共同退兵。所以袁世凯说，清朝和日本要保持和睦呀，只有我们两个国家和睦，亚洲才能保证安全。我们这边的意思是双方共同撤军，不要惹起事端来。大鸟圭介说：“甚是甚是，我们日本是看朝鲜乱党闹得太严重，才派兵过来的。你看我都60多岁的人了，当然不愿意再生事端了。我已经给日本国内发电报了，让他们阻止后续发兵。我听说你们还要再加派2,000士兵来汉城？”袁世凯说：“你要是能果然阻止后续的来兵，我也可以往回发电报，让国内不再派兵。”大鸟圭介说：“当然可以，你阻止你们加派兵力，我阻止我们加派兵力，然后咱们再继续商定后续事宜。”"]]},"created_time":1763631871329,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"Yt3hnAkM9NLr6CsG1JOkwg,\"start\",\"end\"","n":{"Yt3hnAkM9NLr6CsG1JOkwg,\"start\",\"end\"":{"s":{"x":"Yt3hnAkM9NLr6CsG1JOkwg","i":[{"t":"s"},{"t":"t","i":["0QkGqOqGchiw",1],"o":"start","l":326,"c":"所以，大鸟圭介用了个计策来稳住袁世凯。6月13号，大鸟圭介去找袁世凯会谈。在这次会谈过程中，袁世凯还是采取了李鸿章的观点，说要两个国家协商，共同退兵。所以袁世凯说，清朝和日本要保持和睦呀，只有我们两个国家和睦，亚洲才能保证安全。我们这边的意思是双方共同撤军，不要惹起事端来。大鸟圭介说：“甚是甚是，我们日本是看朝鲜乱党闹得太严重，才派兵过来的。你看我都60多岁的人了，当然不愿意再生事端了。我已经给日本国内发电报了，让他们阻止后续发兵。我听说你们还要再加派2,000士兵来汉城？”袁世凯说：“你要是能果然阻止后续的来兵，我也可以往回发电报，让国内不再派兵。”大鸟圭介说：“当然可以，你阻止你们加派兵力，我阻止我们加派兵力，然后咱们再继续商定后续事宜。”"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-800f-9a3f-fb4e3be1459e":{"value":{"id":"2b199968-1bdb-800f-9a3f-fb4e3be1459e","version":3,"type":"text","properties":{"title":[["会谈之后，袁世凯非常高兴，他把这个当成一个外交胜利。他立刻给李鸿章发电报，汇报了情况。李鸿章收到袁世凯的消息之后，对他的处理也很满意。李鸿章立刻终止了向朝鲜派兵的计划，同时他也给叶志超和聂士成下发命令，让他们立刻停止所有的军事行动。"]]},"created_time":1763631871329,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"UorBBwGVO4hYeYAnrhZhUA,\"start\",\"end\"","n":{"UorBBwGVO4hYeYAnrhZhUA,\"start\",\"end\"":{"s":{"x":"UorBBwGVO4hYeYAnrhZhUA","i":[{"t":"s"},{"t":"t","i":["HSpc10AX6YTa",1],"o":"start","l":116,"c":"会谈之后，袁世凯非常高兴，他把这个当成一个外交胜利。他立刻给李鸿章发电报，汇报了情况。李鸿章收到袁世凯的消息之后，对他的处理也很满意。李鸿章立刻终止了向朝鲜派兵的计划，同时他也给叶志超和聂士成下发命令，让他们立刻停止所有的军事行动。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8005-9cab-ddecdc64820d":{"value":{"id":"2b199968-1bdb-8005-9cab-ddecdc64820d","version":3,"type":"text","properties":{"title":[["第二天6月14号，李鸿章又收到袁世凯发来的好消息。袁世凯说，他已经和大鸟圭介商议妥当了，只要咱们撤兵，他们日本也同时撤兵。李鸿章听到这个消息，他一方面是开心的，不过呢他也有些警惕了。李鸿章在外交上阅历丰富，他比袁世凯要敏感多了。他感觉这事情太顺利了，日本在什么都没得到的情况下就轻易撤兵，这有点太容易了。他给袁世凯回电报，让他要警惕，必须拿到和大鸟圭介约定的信函或者约定的文件。李鸿章同时也让汪凤藻在日本国内打听相应的情报。"]]},"created_time":1763631871330,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"uOu-F1j2iQqr8WM4Afyvng,\"start\",\"end\"","n":{"uOu-F1j2iQqr8WM4Afyvng,\"start\",\"end\"":{"s":{"x":"uOu-F1j2iQqr8WM4Afyvng","i":[{"t":"s"},{"t":"t","i":["BJdIridklCj6",1],"o":"start","l":212,"c":"第二天6月14号，李鸿章又收到袁世凯发来的好消息。袁世凯说，他已经和大鸟圭介商议妥当了，只要咱们撤兵，他们日本也同时撤兵。李鸿章听到这个消息，他一方面是开心的，不过呢他也有些警惕了。李鸿章在外交上阅历丰富，他比袁世凯要敏感多了。他感觉这事情太顺利了，日本在什么都没得到的情况下就轻易撤兵，这有点太容易了。他给袁世凯回电报，让他要警惕，必须拿到和大鸟圭介约定的信函或者约定的文件。李鸿章同时也让汪凤藻在日本国内打听相应的情报。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-80b0-b9cb-d859feab0e7a":{"value":{"id":"2b199968-1bdb-80b0-b9cb-d859feab0e7a","version":3,"type":"text","properties":{"title":[["6月15号，汪凤藻给李鸿章回电报。汪凤藻说他去日本外务省打听，外务省并没有接到大鸟圭介说的要撤兵的报告。6月16号，汪凤藻又报告了一个不好的消息，他说他得到了一个新的消息，日本已经往朝鲜增兵了，要派5,000人。汪凤藻得到的这个消息是真实的啊，就在6月16号当天，日本军队大岛义昌率领一个混成旅2,673人，已经成功登陆仁川了。6月17号，日本混成旅的另外一部也登陆釜山了。到此为止，朝鲜的汉城、仁川、釜山这三个重要城市都被日军占领了。清军和日军在朝鲜的兵力出现了严重的倾斜，日本的军队达到了将近8,000人，而清军只有2,000人。"]]},"created_time":1763631871330,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"WcgNi0-X6fyDOCztqNpYCg,\"start\",\"end\"","n":{"WcgNi0-X6fyDOCztqNpYCg,\"start\",\"end\"":{"s":{"x":"WcgNi0-X6fyDOCztqNpYCg","i":[{"t":"s"},{"t":"t","i":["0lRqPhdHoz7M",1],"o":"start","l":267,"c":"6月15号，汪凤藻给李鸿章回电报。汪凤藻说他去日本外务省打听，外务省并没有接到大鸟圭介说的要撤兵的报告。6月16号，汪凤藻又报告了一个不好的消息，他说他得到了一个新的消息，日本已经往朝鲜增兵了，要派5,000人。汪凤藻得到的这个消息是真实的啊，就在6月16号当天，日本军队大岛义昌率领一个混成旅2,673人，已经成功登陆仁川了。6月17号，日本混成旅的另外一部也登陆釜山了。到此为止，朝鲜的汉城、仁川、釜山这三个重要城市都被日军占领了。清军和日军在朝鲜的兵力出现了严重的倾斜，日本的军队达到了将近8,000人，而清军只有2,000人。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-809d-b6ae-d0748a6e48ad":{"value":{"id":"2b199968-1bdb-809d-b6ae-d0748a6e48ad","version":3,"type":"text","properties":{"title":[["就在6月17号当天，日本政府正式给清朝发出照会，要求共同改革朝鲜内政。我们说在日本增兵的这段期间，清朝无论是在策略上、在军事上，还是在外交上，都是完全处于下风。日本是步步为营。在策略上，他们提出了两国共同改造朝鲜内政的主张，要是清朝不同意，进而发生战争，那么在国际上，日本也有了正当的理由。在外交上大鸟圭介把袁世凯骗得团团转，他让袁世凯放松警惕。在军事上，日本军队增兵的脚步一点都没停滞，对清军的人数达到了绝对的优势。"]]},"created_time":1763631871330,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"LF0kjr-cnlj-sVRc1d_VFQ,\"start\",\"end\"","n":{"LF0kjr-cnlj-sVRc1d_VFQ,\"start\",\"end\"":{"s":{"x":"LF0kjr-cnlj-sVRc1d_VFQ","i":[{"t":"s"},{"t":"t","i":["HyxrD7stcsLI",1],"o":"start","l":209,"c":"就在6月17号当天，日本政府正式给清朝发出照会，要求共同改革朝鲜内政。我们说在日本增兵的这段期间，清朝无论是在策略上、在军事上，还是在外交上，都是完全处于下风。日本是步步为营。在策略上，他们提出了两国共同改造朝鲜内政的主张，要是清朝不同意，进而发生战争，那么在国际上，日本也有了正当的理由。在外交上大鸟圭介把袁世凯骗得团团转，他让袁世凯放松警惕。在军事上，日本军队增兵的脚步一点都没停滞，对清军的人数达到了绝对的优势。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8078-bcdc-efb9551a3808":{"value":{"id":"2b199968-1bdb-8078-bcdc-efb9551a3808","version":3,"type":"text","properties":{"title":[["对于日本提出来的要和清朝两国共同改造朝鲜内政的提案，清朝当然不会答应。在清朝看来，朝鲜是清朝的藩属国，要是同意日本也来一起改造，那不成了朝鲜也是日本的藩属国了吗？这是清朝绝对不能接受的。清朝拒绝了日本的提案。对于清朝会拒绝，日本是早有准备。6月22号，日本外相陆奥宗光通知汪凤藻，说清朝不同意一起改造，日本也要单独实施对朝鲜内政的改造。在完成对朝鲜的改造之前，日本坚决不会退兵。"]]},"created_time":1763631871330,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"dQnLfCArTiqE9pDAmbNPnQ,\"start\",\"end\"","n":{"dQnLfCArTiqE9pDAmbNPnQ,\"start\",\"end\"":{"s":{"x":"dQnLfCArTiqE9pDAmbNPnQ","i":[{"t":"s"},{"t":"t","i":["dhoLwGaWsPnP",1],"o":"start","l":189,"c":"对于日本提出来的要和清朝两国共同改造朝鲜内政的提案，清朝当然不会答应。在清朝看来，朝鲜是清朝的藩属国，要是同意日本也来一起改造，那不成了朝鲜也是日本的藩属国了吗？这是清朝绝对不能接受的。清朝拒绝了日本的提案。对于清朝会拒绝，日本是早有准备。6月22号，日本外相陆奥宗光通知汪凤藻，说清朝不同意一起改造，日本也要单独实施对朝鲜内政的改造。在完成对朝鲜的改造之前，日本坚决不会退兵。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-80bf-8d87-c0ca7aafd136":{"value":{"id":"2b199968-1bdb-80bf-8d87-c0ca7aafd136","version":3,"type":"text","properties":{"title":[["从这一刻起，日本、清朝、朝鲜三方的气氛非常紧张，战争一触即发。7月3号，日本单方面向朝鲜政府提交了要求改革内政的纲领。日本要求朝鲜政府必须全盘接受日本的改革计划，并且不允许清朝干涉朝鲜内政改革。到这个时候，清朝和日本的关系已经严重恶化了啊，恶化到什么程度了呢？7月中旬，日本宣布对清朝断交，双方互派的公使全部都撤旗走人。清朝驻日本的公使撤回来了，日本驻清朝的公使也撤回去了。连在朝鲜的袁世凯都撤回国了。袁世凯说我也得回去，日本军队现在已经控制了汉城，我要是不回去，被日本人抓了，这是大清国的尊严受到侮辱的问题，所以袁世凯也回国了。从这之后啊，清朝和日本的外交完全中断，双方没有任何可以对话的渠道了。"]]},"created_time":1763631871331,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"_qT5_aJYV6PwjxUWEjlKfA,\"start\",\"end\"","n":{"_qT5_aJYV6PwjxUWEjlKfA,\"start\",\"end\"":{"s":{"x":"_qT5_aJYV6PwjxUWEjlKfA","i":[{"t":"s"},{"t":"t","i":["rth_cFZHo8a0",1],"o":"start","l":299,"c":"从这一刻起，日本、清朝、朝鲜三方的气氛非常紧张，战争一触即发。7月3号，日本单方面向朝鲜政府提交了要求改革内政的纲领。日本要求朝鲜政府必须全盘接受日本的改革计划，并且不允许清朝干涉朝鲜内政改革。到这个时候，清朝和日本的关系已经严重恶化了啊，恶化到什么程度了呢？7月中旬，日本宣布对清朝断交，双方互派的公使全部都撤旗走人。清朝驻日本的公使撤回来了，日本驻清朝的公使也撤回去了。连在朝鲜的袁世凯都撤回国了。袁世凯说我也得回去，日本军队现在已经控制了汉城，我要是不回去，被日本人抓了，这是大清国的尊严受到侮辱的问题，所以袁世凯也回国了。从这之后啊，清朝和日本的外交完全中断，双方没有任何可以对话的渠道了。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8097-ad6a-c8b8589e7246":{"value":{"id":"2b199968-1bdb-8097-ad6a-c8b8589e7246","version":3,"type":"text","properties":{"title":[["7月20号，日本向朝鲜发出最后通牒，要求朝鲜在7月22号之前和清朝断交，并且要求朝鲜政府下令驱逐清朝的军队。朝鲜政府没有妥协，并没有答应日本的要求。7月22号，最后通牒时间到了之后，7月23号的凌晨，日军攻入了朝鲜王宫。日军俘虏了朝鲜国王高宗和闵妃，然后他们扶植起了以大院君为首的日本的傀儡政权。傀儡政权以高宗的名义发布了一个文告，文告宣布的是，授权日本军队帮助朝鲜驱逐清朝军队。"]]},"created_time":1763631871331,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"DUCkCEoVsBaZ9KjWlt0uPQ,\"start\",\"end\"","n":{"DUCkCEoVsBaZ9KjWlt0uPQ,\"start\",\"end\"":{"s":{"x":"DUCkCEoVsBaZ9KjWlt0uPQ","i":[{"t":"s"},{"t":"t","i":["YAOyJV3GWtqN",1],"o":"start","l":190,"c":"7月20号，日本向朝鲜发出最后通牒，要求朝鲜在7月22号之前和清朝断交，并且要求朝鲜政府下令驱逐清朝的军队。朝鲜政府没有妥协，并没有答应日本的要求。7月22号，最后通牒时间到了之后，7月23号的凌晨，日军攻入了朝鲜王宫。日军俘虏了朝鲜国王高宗和闵妃，然后他们扶植起了以大院君为首的日本的傀儡政权。傀儡政权以高宗的名义发布了一个文告，文告宣布的是，授权日本军队帮助朝鲜驱逐清朝军队。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-80c7-b26f-d761201d833a":{"value":{"id":"2b199968-1bdb-80c7-b26f-d761201d833a","version":3,"type":"text","properties":{"title":[["对于傀儡政权的文告，清朝当然是不认的。但是呢对于朝鲜的老百姓来说，他们是分不清傀儡政权的，既然是国王宣布的，那当然就是合法的。这样一来，清军在朝鲜的合法性反而受到了质疑。接下来，日本以朝鲜傀儡政权发布的文告作为合法依据，在海上偷袭了清朝的运兵船，挑起了丰岛海战。在陆地上，偷袭了驻扎在成欢、牙山的叶志超、聂士成的部队。日本不宣而战，挑起了甲午战争。"]]},"created_time":1763631871331,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"B1tnrYynZndyj_wg6mkFIg,\"start\",\"end\"","n":{"B1tnrYynZndyj_wg6mkFIg,\"start\",\"end\"":{"s":{"x":"B1tnrYynZndyj_wg6mkFIg","i":[{"t":"s"},{"t":"t","i":["LXe_QwuqDDCf",1],"o":"start","l":174,"c":"对于傀儡政权的文告，清朝当然是不认的。但是呢对于朝鲜的老百姓来说，他们是分不清傀儡政权的，既然是国王宣布的，那当然就是合法的。这样一来，清军在朝鲜的合法性反而受到了质疑。接下来，日本以朝鲜傀儡政权发布的文告作为合法依据，在海上偷袭了清朝的运兵船，挑起了丰岛海战。在陆地上，偷袭了驻扎在成欢、牙山的叶志超、聂士成的部队。日本不宣而战，挑起了甲午战争。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8089-aec2-dc75a85333f2":{"value":{"id":"2b199968-1bdb-8089-aec2-dc75a85333f2","version":3,"type":"text","properties":{"title":[["好了今天的内容就讲到这里了，关于战场上的演进，我们下期继续聊，我们下期见。"]]},"created_time":1763631871331,"last_edited_time":1763631871352,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"WJE4d2_KFbBnWns90Z1qBA,\"start\",\"end\"","n":{"WJE4d2_KFbBnWns90Z1qBA,\"start\",\"end\"":{"s":{"x":"WJE4d2_KFbBnWns90Z1qBA","i":[{"t":"s"},{"t":"t","i":["qUiJNWjFAws_",1],"o":"start","l":37,"c":"好了今天的内容就讲到这里了，关于战场上的演进，我们下期继续聊，我们下期见。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"2b199968-1bdb-8154-ae75-e5668aa9c3a8":{"value":{"id":"2b199968-1bdb-8154-ae75-e5668aa9c3a8","version":1,"type":"text","format":{"copied_from_pointer":{"id":"2ae99968-1bdb-81ea-a163-fce644813b50","table":"block","spaceId":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"}},"created_time":1763631717954,"last_edited_time":1763631717954,"parent_id":"2b199968-1bdb-80c3-9b4b-e911bbc4c2cd","parent_table":"block","alive":true,"copied_from":"2ae99968-1bdb-81
