<text x="95" y="535" font-size="25" font-weight="700">网络工作台的完整流程，另做真实界面验收</text>
<text x="95" y="585" font-size="25">创建授权 → 绑定连接 → 人工确认 → 受限执行 → 读原始证据 → 核验并导出</text>
<text x="95" y="635" font-size="21" fill="#475569">本轮使用已运行的2B模型做18次兼容API台架尝试；没有把台架算成原生安全功能通过。</text>
<text x="65" y="765" font-size="21" fill="#475569">各结论只对应本轮模型、量化、任务与环境；不能外推成所有小模型的准确率或通用安全认证。</text>
