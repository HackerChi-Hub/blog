<text x="65" y="125" font-size="36" font-weight="700">聊天能回复，还要继续验三件事</text>
<text x="65" y="170" font-size="22" fill="#475569">机制示意，非软件截图；每一步都以实际回执为准。</text>
<g fill="#fff" stroke="#cbd5e1" stroke-width="2"><rect x="65" y="220" width="400" height="210" rx="18"/><rect x="550" y="220" width="400" height="210" rx="18"/><rect x="1035" y="220" width="400" height="210" rx="18"/></g>
<g font-size="25" font-weight="700"><text x="95" y="270">1 · 模型会不会调用</text><text x="580" y="270">2 · 执行环境是否就绪</text><text x="1065" y="270">3 · 证据是否支持结论</text></g>
<g font-size="21"><text x="95" y="315">真正读文件、核查、提交</text><text x="95" y="350">不能拿“它说查了”代替</text><text x="95" y="395" fill="#991b1b">本轮2B：自主闭环 0/9</text><text x="580" y="315">目标授权 / 受限连接 / Docker</text><text x="580" y="350">本机缺环境就停在这里</text><text x="580" y="395" fill="#991b1b">本轮Windows：未跑网络扫描</text><text x="1065" y="315">原文、去重读取、复核与导出</text><text x="1065" y="350">保留误报、失败和未知</text><text x="1065" y="395" fill="#92400e">参数化SQL：3/3被误报</text></g>
