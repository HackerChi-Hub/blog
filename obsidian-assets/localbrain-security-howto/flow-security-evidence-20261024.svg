<title id="title">本地安全测试：模型、权限和执行环境分别验收</title><desc id="desc">机制示意图，不是软件截图。聊天可用后还需验真实工具调用，隔离网络执行还依赖Docker就绪。当前Windows测试仅覆盖兼容接口台架。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#64748b"/></marker></defs>
