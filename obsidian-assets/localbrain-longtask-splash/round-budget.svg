<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520">
<rect width="1600" height="520" fill="#F6F3EC"/>
<text x="90" y="74" font-size="33" fill="#141820" font-family="Songti SC, STSong, serif">同一个模型、同一道题，只把单轮时长从 180 秒改成 600 秒</text>
<text x="90" y="116" font-size="20" fill="#6B6357" font-family="Songti SC, STSong, serif">耗时 710 秒 → 783 秒（多 73 秒）；结果从「草稿·自检未通过」变成「已交付·自检全过」</text>
<text x="90" y="202" font-size="21" fill="#141820" font-family="Songti SC, STSong, serif">轮数</text>
<rect x="330" y="180" width="760" height="26" rx="4" fill="#B9AF9C"/>
<text x="1102" y="200" font-size="19" fill="#141820" font-family="Songti SC, STSong, serif">11 轮</text>
<text x="240" y="200" font-size="16" fill="#6B6357" text-anchor="end" font-family="Songti SC, STSong, serif">180 秒</text>
<rect x="330" y="214" width="415" height="26" rx="4" fill="#C77A0A"/>
<text x="757" y="234" font-size="19" fill="#141820" font-family="Songti SC, STSong, serif">6 轮</text>
<text x="240" y="234" font-size="16" fill="#6B6357" text-anchor="end" font-family="Songti SC, STSong, serif">600 秒</text>
<text x="90" y="302" font-size="21" fill="#141820" font-family="Songti SC, STSong, serif">整轮空转</text>
<rect x="330" y="280" width="760" height="26" rx="4" fill="#B9AF9C"/>
<text x="1102" y="300" font-size="19" fill="#141820" font-family="Songti SC, STSong, serif">5 次</text>
<text x="240" y="300" font-size="16" fill="#6B6357" text-anchor="end" font-family="Songti SC, STSong, serif">180 秒</text>
<rect x="330" y="314" width="152" height="26" rx="4" fill="#C77A0A"/>
<text x="494" y="334" font-size="19" fill="#141820" font-family="Songti SC, STSong, serif">1 次</text>
<text x="240" y="334" font-size="16" fill="#6B6357" text-anchor="end" font-family="Songti SC, STSong, serif">600 秒</text>
<text x="90" y="402" font-size="21" fill="#141820" font-family="Songti SC, STSong, serif">交互检查未过</text>
<rect x="330" y="380" width="760" height="26" rx="4" fill="#B9AF9C"/>
<text x="1102" y="400" font-size="19" fill="#141820" font-family="Songti SC, STSong, serif">4 项</text>
<text x="240" y="400" font-size="16" fill="#6B6357" text-anchor="end" font-family="Songti SC, STSong, serif">180 秒</text>
<rect x="330" y="414" width="6" height="26" rx="4" fill="#C77A0A"/>
<text x="348" y="434" font-size="19" fill="#141820" font-family="Songti SC, STSong, serif">0 项</text>
<text x="240" y="434" font-size="16" fill="#6B6357" text-anchor="end" font-family="Songti SC, STSong, serif">600 秒</text>
<text x="90" y="494" font-size="20" fill="#B3261E" font-family="Songti SC, STSong, serif">限住产出的不是墙钟，是单轮时长换算出的输出额度：600 秒让第一轮拿到约 25,000 词元，一口气写完整个文件</text>
</svg>