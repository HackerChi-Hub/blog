<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720">
<rect width="1600" height="720" fill="#F6F3EC"/>
<text x="80" y="72" font-size="33" fill="#141820" font-family="Songti SC, STSong, serif">本地部署的五层约束（M5 Pro / 64 GB 实测）</text>
<text x="80" y="112" font-size="19" fill="#6B6357" font-family="Songti SC, STSong, serif">红色两层是本机真正的瓶颈；上下文窗口 256K 只用到 16%，从来不是</text>
<rect x="80" y="160" width="1440" height="92" rx="10" fill="#FFFFFF" stroke="#141820" stroke-width="1.5"/>
<rect x="80" y="160" width="7" height="92" rx="3" fill="#141820"/>
<text x="108" y="196" font-size="24" fill="#141820" font-family="Songti SC, STSong, serif">① 内存</text>
<text x="108" y="228" font-size="19" fill="#141820" font-family="Songti SC, STSong, serif">64 GB − 权重 33.3 − 系统 6 − 应用 3 = 余量 21.7 GB，一半给 KV</text>
<text x="1500" y="196" font-size="18" fill="#6B6357" text-anchor="end" font-family="Songti SC, STSong, serif">决定窗口上限</text>
<rect x="80" y="270" width="1440" height="92" rx="10" fill="#FFFFFF" stroke="#B3261E" stroke-width="2.5"/>
<rect x="80" y="270" width="7" height="92" rx="3" fill="#B3261E"/>
<text x="108" y="306" font-size="24" fill="#B3261E" font-family="Songti SC, STSong, serif">② 速度</text>
<text x="108" y="338" font-size="19" fill="#141820" font-family="Songti SC, STSong, serif">解码 58 词元/秒 · 预填 413 词元/秒 —— 一轮 95–100% 时间在生成</text>
<text x="1500" y="306" font-size="18" fill="#6B6357" text-anchor="end" font-family="Songti SC, STSong, serif">决定一件事要多久</text>
<text x="1500" y="338" font-size="17" fill="#B3261E" text-anchor="end" font-family="Songti SC, STSong, serif">← 真正卡住的地方</text>
<rect x="80" y="380" width="1440" height="92" rx="10" fill="#FFFFFF" stroke="#C77A0A" stroke-width="1.5"/>
<rect x="80" y="380" width="7" height="92" rx="3" fill="#C77A0A"/>
<text x="108" y="416" font-size="24" fill="#C77A0A" font-family="Songti SC, STSong, serif">③ 额度</text>
<text x="108" y="448" font-size="19" fill="#141820" font-family="Songti SC, STSong, serif">min(窗口余量, 速率 × 单轮时长)；超过 567 秒后被输出硬顶 32,768 截住</text>
<text x="1500" y="416" font-size="18" fill="#6B6357" text-anchor="end" font-family="Songti SC, STSong, serif">决定一轮能写多少</text>
<rect x="80" y="490" width="1440" height="92" rx="10" fill="#FFFFFF" stroke="#7A3E9D" stroke-width="2.5"/>
<rect x="80" y="490" width="7" height="92" rx="3" fill="#7A3E9D"/>
<text x="108" y="526" font-size="24" fill="#7A3E9D" font-family="Songti SC, STSong, serif">④ 参数</text>
<text x="108" y="558" font-size="19" fill="#141820" font-family="Songti SC, STSong, serif">按「选中的模型」规划，不是按「在跑的模型」；每次启动重刷</text>
<text x="1500" y="526" font-size="18" fill="#6B6357" text-anchor="end" font-family="Songti SC, STSong, serif">错配则前面全白算</text>
<text x="1500" y="558" font-size="17" fill="#B3261E" text-anchor="end" font-family="Songti SC, STSong, serif">← 真正卡住的地方</text>
<rect x="80" y="600" width="1440" height="92" rx="10" fill="#FFFFFF" stroke="#1B6B3A" stroke-width="1.5"/>
<rect x="80" y="600" width="7" height="92" rx="3" fill="#1B6B3A"/>
<text x="108" y="636" font-size="24" fill="#1B6B3A" font-family="Songti SC, STSong, serif">⑤ 机制</text>
<text x="108" y="668" font-size="19" fill="#141820" font-family="Songti SC, STSong, serif">思考熔断 + 强制动手：不让额度浪费在原地打转</text>
<text x="1500" y="636" font-size="18" fill="#6B6357" text-anchor="end" font-family="Songti SC, STSong, serif">接住后果，不产生约束</text>
<text x="80" y="736" font-size="20" fill="#141820" font-family="Songti SC, STSong, serif">只能记一条：先确认界面里选中的模型，就是你实际在跑的那个——这条错了，后面每一项调整都会被下次启动抹掉。</text>
</svg>