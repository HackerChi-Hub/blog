sion","bot_id":"482aa66e-4aea-4811-9fbb-750cd1c10e34","parent_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","parent_table":"space"}],"created_time":1681696934562,"last_edited_time":1770559512073,"parent_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","parent_table":"space","alive":true,"copied_from":"4011bf1d-c54d-4144-b1c7-1ff18582202c","file_ids":["b505b67d-c5e4-470e-b705-ca7389ce28bf","bae6f9eb-cce0-4993-9432-16fd4391f064","02252be8-95a0-49a9-92d2-91858163ac65","5179a193-7501-4d3e-b447-9820a4a8c324","513ac5c5-e73c-44a3-92d4-bbb58bd0f4d7","80bfedeb-2da2-4099-87b9-9350bdc547f3"],"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"s6niaXnHZWPOEDH4b5mmcA,\"start\",\"end\"","n":{"s6niaXnHZWPOEDH4b5mmcA,\"start\",\"end\"":{"s":{"x":"s6niaXnHZWPOEDH4b5mmcA","i":[{"t":"s"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"baf4dcfd-d97f-4c70-b559-7ac7d00e432b":{"value":{"id":"baf4dcfd-d97f-4c70-b559-7ac7d00e432b","version":23,"type":"image","properties":{"source":[["https://images.unsplash.com/photo-1596980239737-ebbaf85d97eb?ixlib=rb-4.0.3\u0026q=85\u0026fm=jpg\u0026crop=entropy\u0026cs=srgb"]]},"format":{"display_source":"https://images.unsplash.com/photo-1596980239737-ebbaf85d97eb?ixlib=rb-4.0.3\u0026q=85\u0026fm=jpg\u0026crop=entropy\u0026cs=srgb","copied_from_pointer":{"id":"fb218a57-ba85-46a5-9802-8c0a705b539a","table":"block","spaceId":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"}},"created_time":1703138457086,"last_edited_time":1703139053006,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"copied_from":"fb218a57-ba85-46a5-9802-8c0a705b539a","space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"b3c5db8c-d5cc-4edf-a599-2a9489047567":{"value":{"id":"b3c5db8c-d5cc-4edf-a599-2a9489047567","version":204,"type":"quote","properties":{"title":[["网络爬虫（又称为网页蜘蛛，网络机器人，在FOAF社区中间，更经常的称为网页追逐者），是一种按照一定的规则，自动地抓取万维网信息的程序或者脚本。从功能上来讲，爬虫一般分为数据采集，处理，储存三个部分。传统爬虫从一个或若干初始网页的URL开始，获得初始网页上的URL，在抓取网页的过程中，不断从当前页面上抽取新的URL放入队列,直到满足系统的一定停止条件。聚焦爬虫的工作流程较为复杂，需要根据一定的网页分析算法过滤与主题无关的链接，保留有用的链接并将其放入等待抓取的URL队列。然后，它将根据一定的搜索策略从队列中选择下一步要抓取的网页URL，并重复上述过程，直到达到系统的某一条件时停止。另外，所有被爬虫抓取的网页将会被系统存贮，进行一定的分析、过滤，并建立索引，以便之后的查询和检索；对于聚焦爬虫来说，这一过程所得到的分析结果还可能对以后的抓取过程给出反馈和指导。本文介绍Python网络爬虫编程的方方面面。"]]},"format":{"copied_from_pointer":{"id":"e2523a42-ecc4-4a35-b7aa-aebac6316013","table":"block","spaceId":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"}},"created_time":1703138457086,"last_edited_time":1703139151090,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"copied_from":"e2523a42-ecc4-4a35-b7aa-aebac6316013","space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"f7587085-926e-4062-b08b-7ba0e80124e0":{"value":{"id":"f7587085-926e-4062-b08b-7ba0e80124e0","version":1,"type":"divider","format":{"copied_from_pointer":{"id":"95dab8dc-53d7-4b8e-ae79-2c5d48fa213e","table":"block","spaceId":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"}},"created_time":1703138457084,"last_edited_time":1703138457084,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"copied_from":"95dab8dc-53d7-4b8e-ae79-2c5d48fa213e","space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"8787dafa-7ab5-45d9-afa4-547a370de01f":{"value":{"id":"8787dafa-7ab5-45d9-afa4-547a370de01f","version":2,"type":"sub_header","properties":{"title":[["网络数据采集概述"]]},"created_time":1703138662473,"last_edited_time":1703138662499,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"8240f3b1-3e68-4a1a-a9c1-8af7108131d4":{"value":{"id":"8240f3b1-3e68-4a1a-a9c1-8af7108131d4","version":2,"type":"text","properties":{"title":[["爬虫（crawler）也经常被称为网络蜘蛛（spider），是按照一定的规则自动浏览网站并获取所需信息的机器人程序（自动化脚本代码），被广泛的应用于互联网搜索引擎和数据采集。使用过互联网和浏览器的人都知道，网页中除了供用户阅读的文字信息之外，还包含一些超链接，网络爬虫正是通过网页中的超链接信息，不断获得网络上其它页面的地址，然后持续的进行数据采集。正因如此，网络数据采集的过程就像一个爬虫或者蜘蛛在网络上漫游，所以才被形象的称为爬虫或者网络蜘蛛。"]]},"created_time":1703138662473,"last_edited_time":1703138662499,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"c9418a66-73ab-445c-abfa-0133da0ff727":{"value":{"id":"c9418a66-73ab-445c-abfa-0133da0ff727","version":2,"type":"sub_sub_header","properties":{"title":[["爬虫的应用领域"]]},"created_time":1703138662473,"last_edited_time":1703138662499,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"69c4c00a-eae0-4d73-b88f-e60c63f75534":{"value":{"id":"69c4c00a-eae0-4d73-b88f-e60c63f75534","version":2,"type":"text","properties":{"title":[["在理想的状态下，所有 ICP（Internet Content Provider）都应该为自己的网站提供 API 接口来共享它们允许其他程序获取的数据，在这种情况下就根本不需要爬虫程序。国内比较有名的电商平台（如淘宝、京东等）、社交平台（如微博、微信等）等都提供了自己的 API 接口，但是这类 API 接口通常会对可以抓取的数据以及抓取数据的频率进行限制。对于大多数的公司而言，及时的获取行业数据和竞对数据是企业生存的重要环节之一，然而对大部分企业来说，数据都是其与生俱来的短板。在这种情况下，合理的利用爬虫来获取数据并从中提取出有商业价值的信息对这些企业来说就显得至关重要的。"]]},"created_time":1703138662473,"last_edited_time":1703138662499,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"2e7fb915-578a-4c8e-8e43-d8e7ac6cf471":{"value":{"id":"2e7fb915-578a-4c8e-8e43-d8e7ac6cf471","version":2,"type":"text","properties":{"title":[["爬虫的应用领域其实非常广泛，下面我们列举了其中的一部分，有兴趣的读者可以自行探索相关内容。"]]},"created_time":1703138662473,"last_edited_time":1703138662499,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"04a9a047-f7b6-4a17-a975-c3d9c0173b00":{"value":{"id":"04a9a047-f7b6-4a17-a975-c3d9c0173b00","version":2,"type":"numbered_list","properties":{"title":[["搜索引擎"]]},"created_time":1703138662474,"last_edited_time":1703138662499,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"cb01f333-31e9-4d3a-b150-070e5e453150":{"value":{"id":"cb01f333-31e9-4d3a-b150-070e5e453150","version":2,"type":"numbered_list","properties":{"title":[["新闻聚合"]]},"created_time":1703138662474,"last_edited_time":1703138662499,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"19b3510a-4257-46a6-946d-9f59eb7df12b":{"value":{"id":"19b3510a-4257-46a6-946d-9f59eb7df12b","version":2,"type":"numbered_list","properties":{"title":[["社交应用"]]},"created_time":1703138662474,"last_edited_time":1703138662499,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"395cb94e-825d-4699-8b82-0378cec15656":{"value":{"id":"395cb94e-825d-4699-8b82-0378cec15656","version":2,"type":"numbered_list","properties":{"title":[["舆情监控"]]},"created_time":1703138662474,"last_edited_time":1703138662499,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"95e84aef-d82d-40a4-9de7-a6f42e30d289":{"value":{"id":"95e84aef-d82d-40a4-9de7-a6f42e30d289","version":2,"type":"numbered_list","properties":{"title":[["行业数据"]]},"created_time":1703138662474,"last_edited_time":1703138662499,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"8a7ec7f1-69c9-46f7-b9fd-d3d628738f3c":{"value":{"id":"8a7ec7f1-69c9-46f7-b9fd-d3d628738f3c","version":2,"type":"sub_sub_header","properties":{"title":[["爬虫合法性探讨"]]},"created_time":1703138662474,"last_edited_time":1703138662499,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"687c0cf1-307b-4732-82cb-1b67fd40c94d":{"value":{"id":"687c0cf1-307b-4732-82cb-1b67fd40c94d","version":2,"type":"text","properties":{"title":[["经常听人说起“爬虫写得好，牢饭吃到饱”，那么编程爬虫程序是否违法呢？关于这个问题，我们可以从以下几个角度进行解读。"]]},"created_time":1703138662474,"last_edited_time":1703138662499,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"035fbd8a-2f75-4765-9d2f-90cdec5329d7":{"value":{"id":"035fbd8a-2f75-4765-9d2f-90cdec5329d7","version":2,"type":"numbered_list","properties":{"title":[["网络爬虫这个领域目前还属于拓荒阶段，虽然互联网世界已经通过自己的游戏规则建立起了一定的道德规范，即 Robots 协议（全称是“网络爬虫排除标准”），但法律部分还在建立和完善中，也就是说，现在这个领域暂时还是灰色地带。"]]},"created_time":1703138662474,"last_edited_time":1703138662499,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"d6ac7d19-6151-4c09-a409-27fb97338faf":{"value":{"id":"d6ac7d19-6151-4c09-a409-27fb97338faf","version":2,"type":"numbered_list","properties":{"title":[["“法不禁止即为许可”，如果爬虫就像浏览器一样获取的是前端显示的数据（网页上的公开信息）而不是网站后台的私密敏感信息，就不太担心法律法规的约束，因为目前大数据产业链的发展速度远远超过了法律的完善程度。"]]},"created_time":1703138662474,"last_edited_time":1703138662499,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"50bc0f74-2801-46d7-b883-1490b95ccce5":{"value":{"id":"50bc0f74-2801-46d7-b883-1490b95ccce5","version":2,"type":"numbered_list","properties":{"title":[["在爬取网站的时候，需要限制自己的爬虫遵守 Robots 协议，同时控制网络爬虫程序的抓取数据的速度；在使用数据的时候，必须要尊重网站的知识产权（从Web 2.0时代开始，虽然Web上的数据很多都是由用户提供的，但是网站平台是投入了运营成本的，当用户在注册和发布内容时，平台通常就已经获得了对数据的所有权、使用权和分发权）。如果违反了这些规定，在打官司的时候败诉几率相当高。"]]},"created_time":1703138662474,"last_edited_time":1703138662499,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"64828af1-0ee5-48bd-bf67-21d040729c02":{"value":{"id":"64828af1-0ee5-48bd-bf67-21d040729c02","version":2,"type":"numbered_list","properties":{"t 34-bfb4-7c2af0e36853","version":2,"type":"sub_sub_header","properties":{"title":[["requests库"]]},"created_time":1703138712367,"last_edited_time":1703138712378,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"ab62c3b2-ac8d-42fd-9e68-3ae1f05d5d36":{"value":{"id":"ab62c3b2-ac8d-42fd-9e68-3ae1f05d5d36","version":6,"type":"text","properties":{"title":[["要使用 Python 获取网络数据，我们推荐大家使用名为"],["requests",[["c"]]],[" 的三方库，这个库我们在之前的课程中其实已经使用过了。按照官方网站的解释，"],["requests",[["c"]]],["是基于 Python 标准库进行了封装，简化了通过 HTTP 或 HTTPS 访问网络资源的操作。上课我们提到过，HTTP 是一个请求响应式的协议，当我们在浏览器中输入正确的 "],["URL",[["a","https://developer.mozilla.org/zh-CN/docs/Learn/Common_questions/What_is_a_URL"]]],["（通常也称为网址）并按下 Enter 键时，我们就向网络上的 "],["Web 服务器",[["a","https://developer.mozilla.org/zh-CN/docs/Learn/Common_questions/What_is_a_web_server"]]],["发送了一个 HTTP 请求，服务器在收到请求后会给我们一个 HTTP 响应。在 Chrome 浏览器中的菜单中打开“开发者工具”切换到“Network”选项卡就能够查看 HTTP 请求和响应到底是什么样子的."]]},"created_time":1703138712367,"last_edited_time":1703140132560,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"d7c6685c-7005-4ff0-b98a-e45e0d404182":{"value":{"id":"d7c6685c-7005-4ff0-b98a-e45e0d404182","version":2,"type":"text","properties":{"title":[["通过"],["requests",[["c"]]],["库，我们可以让 Python 程序向浏览器一样向 Web 服务器发起请求，并接收服务器返回的响应，从响应中我们就可以提取出想要的数据。浏览器呈现给我们的网页是用 "],["HTML",[["a","https://developer.mozilla.org/zh-CN/docs/Web/HTML"]]],[" 编写的，浏览器相当于是 HTML 的解释器环境，我们看到的网页中的内容都包含在 HTML 的标签中。在获取到 HTML 代码后，就可以从标签的属性或标签体中提取内容。下面例子演示了如何获取网页 HTML 代码，我们通过"],["requests",[["c"]]],["库的"],["get",[["c"]]],["函数，获取了搜狐首页的代码。"]]},"created_time":1703138712367,"last_edited_time":1703138712378,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"a0781240-8804-4e28-ade0-f0d13d9acda5":{"value":{"id":"a0781240-8804-4e28-ade0-f0d13d9acda5","version":6,"type":"code","properties":{"title":[["import requests\n\nresp = requests.get('\u003chttps://www.sohu.com/\u003e')\nif resp.status_code == 200:\n    print(resp.text)"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138712368,"last_edited_time":1703139216926,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"7a7c01ab-1c52-48f5-8ac7-0029accbdf75":{"value":{"id":"7a7c01ab-1c52-48f5-8ac7-0029accbdf75","version":2,"type":"quote","properties":{"title":[["说明：上面代码中的变量resp是一个Response对象（requests库封装的类型），通过该对象的status_code属性可以获取响应状态码，而该对象的text属性可以帮我们获取到页面的 HTML 代码。"]]},"created_time":1703138712368,"last_edited_time":1703138712378,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"21672b75-9feb-44ff-a908-54a3c6698b71":{"value":{"id":"21672b75-9feb-44ff-a908-54a3c6698b71","version":2,"type":"text","properties":{"title":[["由于"],["Response",[["c"]]],["对象的"],["text",[["c"]]],["是一个字符串，所以我们可以利用之前讲过的正则表达式的知识，从页面的 HTML 代码中提取新闻的标题和链接，代码如下所示。"]]},"created_time":1703138712368,"last_edited_time":1703138712378,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"35022709-ec50-4a08-ae04-ee90276f42d5":{"value":{"id":"35022709-ec50-4a08-ae04-ee90276f42d5","version":8,"type":"code","properties":{"title":[["import re\nimport requests\n\npattern = re.compile(r'\u003ca.*?href=\"(.*?)\".*?title=\"(.*?)\".*?\u003e')\nresp = requests.get('\u003chttps://www.sohu.com/\u003e')\nif resp.status_code == 200:\n    all_matches = pattern.findall(resp.text)\n    for href, title in all_matches:\n        print(href)\n        print(title)"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138712368,"last_edited_time":1703139219870,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"7795d4ac-f502-404b-8bbf-50678b205bba":{"value":{"id":"7795d4ac-f502-404b-8bbf-50678b205bba","version":2,"type":"text","properties":{"title":[["除了文本内容，我们也可以使用"],["requests",[["c"]]],["库通过 URL 获取二进制资源。下面的例子演示了如何获取百度 Logo 并保存到名为"],["baidu.png",[["c"]]],["的本地文件中。可以在百度的首页上右键点击百度Logo，并通过“复制图片地址”菜单项获取图片的 URL。"]]},"created_time":1703138712368,"last_edited_time":1703138712378,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"204525a7-95e1-48e2-b23d-a26a8653d495":{"value":{"id":"204525a7-95e1-48e2-b23d-a26a8653d495","version":4,"type":"code","properties":{"title":[["import requests\n\nresp = requests.get('\u003chttps://www.baidu.com/img/PCtm_d9c8750bed0b3c7d089fa7d55720d6cf.png\u003e')\nwith open('baidu.png', 'wb') as file:\n    file.write(resp.content)\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138712368,"last_edited_time":1703139223865,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"c997087f-40be-42c0-b7be-05df759c7e1e":{"value":{"id":"c997087f-40be-42c0-b7be-05df759c7e1e","version":2,"type":"quote","properties":{"title":[["说明：Response对象的content属性可以获得服务器响应的二进制数据。"]]},"created_time":1703138712368,"last_edited_time":1703138712378,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"df30a879-596e-4e5b-afa9-2564740af61f":{"value":{"id":"df30a879-596e-4e5b-afa9-2564740af61f","version":2,"type":"text","properties":{"title":[["requests",[["c"]]],["库非常好用而且功能上也比较强大和完整，具体的内容我们在使用的过程中为大家一点点剖析。想解锁关于"],["requests",[["c"]]],["库更多的知识，可以阅读它的"],["官方文档",[["a","https://docs.python-requests.org/zh_CN/latest/"]]],["。"]]},"created_time":1703138712368,"last_edited_time":1703138712378,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"7a7e46ad-7229-4a4d-a477-482c9c44c7d7":{"value":{"id":"7a7e46ad-7229-4a4d-a477-482c9c44c7d7","version":2,"type":"sub_sub_header","properties":{"title":[["编写爬虫代码"]]},"created_time":1703138712368,"last_edited_time":1703138712378,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"e9bc6302-f4f8-4483-a28c-9b588392be31":{"value":{"id":"e9bc6302-f4f8-4483-a28c-9b588392be31","version":2,"type":"text","properties":{"title":[["接下来，我们以“豆瓣电影”为例，为大家讲解如何编写爬虫代码。按照上面提供的方法，我们先使用"],["requests",[["c"]]],["获取到网页的HTML代码，然后将整个代码看成一个长字符串，这样我们就可以使用正则表达式的捕获组从字符串提取我们需要的内容。下面的代码演示了如何从"],["豆瓣电影",[["a","https://movie.douban.com/"]]],["获取排前250名的电影的名称。"],["豆瓣电影Top250",[["a","https://movie.douban.com/top250"]]],["的页面结构和对应代码如下图所示，可以看出，每页共展示了25部电影，如果要获取到 Top250 数据，我们共需要访问10个页面，对应的地址是"],["https://movie.douban.com/top250?start=xxx",[["a","https://movie.douban.com/top250?start=xxx"]]],["，这里的"],["xxx",[["c"]]],["如果为"],["0",[["c"]]],["就是第一页，如果"],["xxx",[["c"]]],["的值是"],["100",[["c"]]],["，那么我们可以访问到第五页。为了代码简单易读，我们只获取电影的标题和评分。"]]},"created_time":1703138712368,"last_edited_time":1703138712378,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"b90ef40f-ee9e-4979-ba81-aa88cb6ab6db":{"value":{"id":"b90ef40f-ee9e-4979-ba81-aa88cb6ab6db","version":12,"type":"image","properties":{"size":[["723.4KB"]],"title":[["douban-xpath.png"]],"source":[["https://prod-files-secure.s3.us-west-2.amazonaws.com/dcfc0b10-f3f6-4bfe-a7f8-895b46badeca/a92071f6-eeb3-43cc-b3f6-aa243ee12b33/douban-xpath.png"]]},"format":{"block_width":1580,"display_source":"https://prod-files-secure.s3.us-west-2.amazonaws.com/dcfc0b10-f3f6-4bfe-a7f8-895b46badeca/a92071f6-eeb3-43cc-b3f6-aa243ee12b33/douban-xpath.png","block_full_width":false,"block_page_width":true,"block_aspect_ratio":0.7658227848101266,"block_preserve_scale":true},"created_time":1703139947265,"last_edited_time":1703139951504,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"file_ids":["a92071f6-eeb3-43cc-b3f6-aa243ee12b33"],"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"c12780bf-51e1-4ebf-a108-14a72b2022ba":{"value":{"id":"c12780bf-51e1-4ebf-a108-14a72b2022ba","version":4,"type":"code","properties":{"title":[["import random\nimport re\nimport time\n\nimport requests\n\nfor page in range(1, 11):\n    resp = requests.get(\n        url=f'\u003chttps://movie.douban.com/top250?start=\u003e{(page - 1) * 25}',\n        # 如果不设置HTTP请求头中的User-Agent，豆瓣会检测出不是浏览器而阻止我们的请求。\n        # 通过get函数的headers参数设置User-Agent的值，具体的值可以在浏览器的开发者工具查看到。\n        # 用爬虫访问大部分网站时，将爬虫伪装成来自浏览器的请求都是非常重要的一步。\n        headers={'User-Agent': 'Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_6) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/92.0.4515.159 Safari/537.36'}\n    )\n    # 通过正则表达式获取class属性为title且标签体不以\u0026开头的span标签并用捕获组提取标签内容\n    pattern1 = re.compile(r'\u003cspan class=\"title\"\u003e([^\u0026]*?)\u003c/span\u003e')\n    titles = pattern1.findall(resp.text)\n    # 通过正则表达式获取class属性为rating_num的span标签并用捕获组提取标签内容\n    pattern2 = re.compile(r'\u003cspan class=\"rating_num\".*?\u003e(.*?)\u003c/span\u003e')\n    ranks = pattern2.findall(resp.text)\n    # 使用zip压缩两个列表，循环遍历所有的电影标题和评分\n    for title, rank in zip(titles, ranks):\n        print(title, rank)\n    # 随机休眠1-5秒，避免爬取页面过于频繁\n    time.sleep(random.random() * 4 + 1)\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138712369,"last_edited_time":1703139230598,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"9db2bd27-f6e1-4e44-b0d5-4b1a00ef171d":{"value":{"id":"9db2bd27-f6e1-4e44-b0d5-4b1a00ef171d","version":2,"type":"quote","properties":{"title":[["说明：通过分析豆瓣网的robots协议，我们发现豆瓣网并不拒绝百度爬虫获取它的数据，因此我们也可以将爬虫伪装成百度的爬虫，将get函数的headers参数修改为：headers={'User-Agent': 'BaiduSpider'}。"]]},"created_time":1703138712369,"last_edited_time":1703138712378,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"3fd4e41f-0599-4bdb-9599-9aa26ff42702":{"value":{"id":"3fd4e41f-0599-4bdb-9599-9aa26ff42702","version":2,"type":"sub_sub_header","properties":{"title":[["使用 IP 代理"]]},"created_time":1703138712369,"last_edited_time":1703138712378,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"434dfbe9-6331-4038-ae32-e69c4af22f78":{"value":{"id":"434dfbe9-6331-4038-ae32-e69c4af22f78","version":2,"type":"text","properties":{"title":[["让爬虫程序隐匿自己的身份对编写爬虫程序来说是比较重要的，很多网站对爬虫都比较反感的，因为爬虫会耗费掉它们很多的网络带宽并制造很多无效的流量。要隐匿身份通常需要使用"],["商业 IP 代理",[["b"]]],["（如蘑菇代理、芝麻代理、快代理等），让被爬取的网站无法获取爬虫程序来源的真实 IP 地址，也就无法简单的通过 IP 地址对爬虫程序进行封禁。"]]},"created_time":1703138712369,"last_edited_time":1703138712378,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"62ad3b27-4995-4b65-8323-6ca2f4af90fa":{"value":{"id":"62ad3b27-4995-4b65-8323-6ca2f4af90fa","version":2,"type":"text","properties":{"title":[["下面以"],["蘑菇代理",[["a","http://www.moguproxy.com/"]]],["为例，为大家讲解商业 IP 代理的使用方法。首先需要在该网站注册一个账号，注册账号后就可以"],["购买",[["a","http://www.moguproxy.com/buy"]]],["相应的套餐来获得商业 IP 代理。作为商业用途，建议大家购买不限量套餐，这样可以根据实际需要获取足够多的代理 IP 地址；作为学习用途，可以购买包时套餐或根据自己的需求来决定。蘑菇代理提供了两种接入代理的方式，分别是 API 私密代理和 HTTP 隧道代理，前者是通过请求蘑菇代理的 API 接口获取代理服务器地址，后者是直接使用统一的入口（蘑菇代理提供的域名）进行接入。"]]},"created_time":1703138712369,"last_edited_time":1703138712378,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"b9f3484f-9574-47ba-83e6-21c04c45989e":{"value":{"id":"b9f3484f-9574-47ba-83e6-21c04c45989e","version":12,"type":"image","properties":{"size":[["294.3KB"]],"title":[["20210829080647.png"]],"source":[["https://prod-files-secure.s3.us-west-2.amazonaws.com/dcfc0b10-f3f6-4bfe-a7f8-895b46badeca/1b6b48dc-7c95-4df3-8b19-451530e50f10/20210829080647.png"]]},"format":{"block_width":1860,"display_source":"https://prod-files-secure.s3.us-west-2.amazonaws.com/dcfc0b10-f3f6-4bfe-a7f8-895b46badeca/1b6b48dc-7c95-4df3-8b19-451530e50f10/20210829080647.png","block_full_width":false,"block_page_width":true,"block_aspect_ratio":0.6763440860215054,"block_preserve_scale":true},"created_time":1703204807980,"last_edited_time":1703204812209,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"file_ids":["1b6b48dc-7c95-4df3-8b19-451530e50f10"],"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"3b7129aa-9094-4e1e-9099-bf3658932c0c":{"value":{"id":"3b7129aa-9094-4e1e-9099-bf3658932c0c","version":4,"type":"text","created_time":1703138712369,"last_edited_time":1703204805174,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"1d5197a4-5dc2-442b-b1d0-6d5a99f52657":{"value":{"id":"1d5197a4-5dc2-442b-b1d0-6d5a99f52657","version":2,"type":"text","properties":{"title":[["下面，我们以HTTP隧道代理为例，为大家讲解接入 IP 代理的方式，大家也可以直接参考蘑菇代理官网提供的代码来为爬虫设置代理。"]]},"created_time":1703138712369,"last_edited_time":1703138712378,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"f209656b-a016-4836-965d-55e972807154":{"value":{"id":"f209656b-a016-4836-965d-55e972807154","version":4,"type":"code","properties":{"title":[["import requests\n\nAPP_KEY = 'Wnp******************************XFx'\nPROXY_HOST = 'secondtransfer.moguproxy.com:9001'\n\nfor page in range(1, 11):\n    resp = requests.get(\n        url=f'\u003chttps://movie.douban.com/top250?start=\u003e{(page - 1) * 25}',\n        # 需要在HTTP请求头设置代理的身份认证方式\n        headers={\n            'Proxy-Authorization': f'Basic {APP_KEY}',\n            'User-Agent': 'Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_6) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/92.0.4515.159 Safari/537.36',\n            'Accept-Language': 'zh-CN,zh;q=0.8,en-US;q=0.6,en;q=0.4'\n        },\n        # 设置代理服务器\n        proxies={\n            'http': f'http://{PROXY_HOST}',\n            'https': f'https://{PROXY_HOST}'\n        },\n        verify=False\n    )\n    pattern1 = re.compile(r'\u003cspan class=\"title\"\u003e([^\u0026]*?)\u003c/span\u003e')\n    titles = pattern1.findall(resp.text)\n    pattern2 = re.compile(r'\u003cspan class=\"rating_num\".*?\u003e(.*?)\u003c/span\u003e')\n    ranks = pattern2.findall(resp.text)\n    for title, rank in zip(titles, ranks):\n        print(title, rank)\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138712369,"last_edited_time":1703139238736,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"27c0ee2c-3889-4ba4-9ce7-995f700454ca":{"value":{"id":"27c0ee2c-3889-4ba4-9ce7-995f700454ca","version":2,"type":"quote","properties":{"title":[["说明：上面的代码需要修改APP_KEY为自己创建的订单对应的Appkey值，这个值可以在用户中心用户订单中查看到。蘑菇代理提供了免费的 API 代理和 HTTP 隧道代理试用，但是试用的代理接通率不能保证，建议大家还是直接购买一个在自己支付能力范围内的代理服务来体验。"]]},"created_time":1703138712369,"last_edited_time":1703138712378,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"91956bbd-fe67-49e5-89ac-e34b15274b3d":{"value":{"id":"91956bbd-fe67-49e5-89ac-e34b15274b3d","version":2,"type":"sub_sub :["f209c09f-4f4a-404c-8e83-d97629ca5dce"],"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"d4715e29-d5bd-445e-935a-5bf6b3f544c8":{"value":{"id":"d4715e29-d5bd-445e-935a-5bf6b3f544c8","version":2,"type":"text","properties":{"title":[["代码的第"],["1",[["c"]]],["行是文档类型声明，第"],["2",[["c"]]],["行的"],["\u003chtml\u003e",[["c"]]],["标签是整个页面根标签的开始标签，最后一行是根标签的结束标签"],["\u003c/html\u003e",[["c"]]],["。"],["\u003chtml\u003e",[["c"]]],["标签下面有两个子标签"],["\u003chead\u003e",[["c"]]],["和"],["\u003cbody\u003e",[["c"]]],["，放在"],["\u003cbody\u003e",[["c"]]],["标签下的内容会显示在浏览器窗口中，这部分内容是网页的主体；放在"],["\u003chead\u003e",[["c"]]],["标签下的内容不会显示在浏览器窗口中，但是却包含了页面重要的元信息，通常称之为网页的头部。HTML 页面大致的代码结构如下所示。"]]},"created_time":1703138742807,"last_edited_time":1703138742832,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"483232cb-6a4f-4555-96a7-4183b17286df":{"value":{"id":"483232cb-6a4f-4555-96a7-4183b17286df","version":4,"type":"code","properties":{"title":[["\u003c!doctype html\u003e\n\u003chtml\u003e\n    \u003chead\u003e\n        \u003c!-- 页面的元信息，如字符编码、标题、关键字、媒体查询等 --\u003e\n    \u003c/head\u003e\n    \u003cbody\u003e\n        \u003c!-- 页面的主体，显示在浏览器窗口中的内容 --\u003e\n    \u003c/body\u003e\n\u003c/html\u003e\n"]],"language":[["HTML"]]},"format":{"code_wrap":true},"created_time":1703138742807,"last_edited_time":1703139252463,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"3b54ea75-e830-4feb-a51d-c58d02bbdf1e":{"value":{"id":"3b54ea75-e830-4feb-a51d-c58d02bbdf1e","version":2,"type":"text","properties":{"title":[["标签、层叠样式表（CSS）、JavaScript 是构成 HTML 页面的三要素，其中标签用来承载页面要显示的内容，CSS 负责对页面的渲染，而 JavaScript 用来控制页面的交互式行为。要实现 HTML 页面的解析，可以使用 XPath 的语法，它原本是 XML 的一种查询语法，可以根据 HTML 标签的层次结构提取标签中的内容或标签属性；此外，也可以使用 CSS 选择器来定位页面元素，就跟用 CSS 渲染页面元素是同样的道理。"]]},"created_time":1703138742807,"last_edited_time":17031 edited_time":1703138742832,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"08c283d0-6f73-4de4-8d93-783ce990f6bc":{"value":{"id":"08c283d0-6f73-4de4-8d93-783ce990f6bc","version":2,"type":"text","properties":{"title":[["下面我们用 XPath 解析方式改写之前获取豆瓣电影 Top250的代码，如下所示。"]]},"created_time":1703138742816,"last_edited_time":1703138742832,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"9d75fac1-a914-4160-b542-6de3b73326a0":{"value":{"id":"9d75fac1-a914-4160-b542-6de3b73326a0","version":4,"type":"code","properties":{"title":[["from lxml import etree\nimport requests\n\nfor page in range(1, 11):\n    resp = requests.get(\n        url=f'\u003chttps://movie.douban.com/top250?start=\u003e{(page - 1) * 25}',\n        headers={'User-Agent': 'BaiduSpider'}\n    )\n    tree = etree.HTML(resp.text)\n    # 通过XPath语法从页面中提取电影标题\n    title_spans = tree.xpath('//*[@id=\"content\"]/div/div[1]/ol/li/div/div[2]/div[1]/a/span[1]')\n    # 通过XPath语法从页面中提取电影评分\n    rank_spans = tree.xpath('//*[@id=\"content\"]/div/div[1]/ol/li[1]/div/div[2]/div[2]/div/span[2]')\n    for title_span, rank_span in zip(title_spans, rank_spans):\n        print(title_span.text, rank_span.text)\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138742816,"last_edited_time":1703139280848,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"240de1f5-b305-462a-bff3-10d675bab978":{"value":{"id":"240de1f5-b305-462a-bff3-10d675bab978","version":2,"type":"sub_sub_header","properties":{"title":[["CSS 选择器解析"]]},"created_time":1703138742816,"last_edited_time":1703138742832,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"b091b6c3-0380-499d-a9e5-9e4aa194d675":{"value":{"id":"b091b6c3-0380-499d-a9e5-9e4aa194d675","version":2,"type":"text","properties":{"title":[["对于熟悉 CSS 选择器和 JavaScript 的开发者来说，通过 CSS 选择器获取页面元素可能是更为简单的选择，因为浏览器中运行的 JavaScript 本身就可以"],["document",[["c"]]],["对象的"],["querySelector()",[["c"]]],["和"],["querySelectorAll()",[["c"]]],["方法基于 CSS 选择器获取页面元素。在 Python 中，我们可以利用三方库"],["beautifulsoup4",[["c"]]],["或"],["pyquery",[["c"]]],["来做同样的事情。Beautiful Soup 可以用来解析 HTML 和 XML 文档，修复含有未闭合标签等错误的文档，通过为待解析的页面在内存中创建一棵树结构，实现对从页面中提取数据操作的封装。可以用下面的命令来安装 Beautiful Soup。"]]},"created_time":1703138742817,"last_edited_time":1703138742832,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"ce95b2b3-ae38-46cb-8e4f-3a73caeb11db":{"value":{"id":"ce95b2b3-ae38-46cb-8e4f-3a73caeb11db","version":2,"type":"code","properties":{"title":[["pip install beautifulsoup4\n"]],"language":[["Plain Text"]]},"format":{"code_wrap":true},"created_time":1703138742817,"last_edited_time":1703138742832,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"c7905f97-2a97-453f-b44b-a50b761e29f2":{"value":{"id":"c7905f97-2a97-453f-b44b-a50b761e29f2","version":2,"type":"text","properties":{"title":[["下面是使用"],["bs4",[["c"]]],["改写的获取豆瓣电影Top250电影名称的代码。"]]},"created_time":1703138742817,"last_edited_time":1703138742832,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"ca87a2a3-e2d0-436c-818c-adf88a5807e7":{"value":{"id":"ca87a2a3-e2d0-436c-818c-adf88a5807e7","version":4,"type":"code","properties":{"title":[["import bs4\nimport requests\n\nfor page in range(1, 11):\n    resp = requests.get(\n        url=f'\u003chttps://movie.douban.com/top250?start=\u003e{(page - 1) * 25}',\n        headers={'User-Agent': 'BaiduSpider'}\n    )\n    # 创建BeautifulSoup对象\n    soup = bs4.BeautifulSoup(resp.text, 'lxml')\n    # 通过CSS选择器从页面中提取包含电影标题的span标签\n    title_spans = soup.select('div.info \u003e div.hd \u003e a \u003e span:nth-child(1)')\n    # 通过CSS选择器从页面中提取包含电影评分的span标签\n    rank_spans = soup.select('div.info \u003e div.bd \u003e div \u003e span.rating_num')\n    for title_span, rank_span in zip(title_spans, rank_spans):\n        print(title_span.text, rank_span.text)\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138742817,"last_edited_time":1703139306980,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"e8a970f2-1b39-4a8e-b549-09f079844f4d":{"value":{"id":"e8a970f2-1b39-4a8e-b549-09f079844f4d","version":2,"type":"text","properties":{"title":[["关于 BeautifulSoup 更多的知识，可以参考它的"],["官方文档",[["a","https://www.crummy.com/software/BeautifulSoup/bs4/doc.zh/"]]],["。"]]},"created_time":1703138742817,"last_edited_time":1703138742832,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"d58e3c93-b41b-4020-bac0-98a8fa445c48":{"value":{"id":"d58e3c93-b41b-4020-bac0-98a8fa445c48","version":2,"type":"sub_sub_header","properties":{"title":[["简单的总结"]]},"created_time":1703138742817,"last_edited_time":1703138742832,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"86e251f4-607e-476a-ab3e-78fce55e66d8":{"value":{"id":"86e251f4-607e-476a-ab3e-78fce55e66d8","version":2,"type":"text","properties":{"title":[["下面我们对三种解析方式做一个简单比较。"]]},"created_time":1703138742817,"last_edited_time":1703138742832,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"2297b68c-a46d-4039-b20f-0df038675cdf":{"value":{"id":"2297b68c-a46d-4039-b20f-0df038675cdf","version":2,"type":"table","content":["c0aa634e-c36a-4b77-902e-833144390c0c","dead3fbb-d9ef-4381-bf07-c3554c32ea02","c982ae75-4096-479f-ac5f-2048d3e81bfa","5ef89c53-b4a4-426a-8db0-6758f76fee88"],"format":{"table_block_column_order":["yNAv","Dtbu","fty^","egTH"]},"created_time":1703138742818,"last_edited_time":1703138742832,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"49074f5b-c22c-4c36-aa80-5eff4f3fa9e6":{"value":{"id":"49074f5b-c22c-4c36-aa80-5eff4f3fa9e6","version":8,"type":"text","format":{"copied_from_pointer":{"id":"99779fe2-fe15-47f5-bcf2-4fba31251f84","table":"block","spaceId":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"}},"created_time":1703138457085,"last_edited_time":1703138734894,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"copied_from":"99779fe2-fe15-47f5-bcf2-4fba31251f84","space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"ee945404-4f7b-43f6-8c8d-bdbb2c61ee8e":{"value":{"id":"ee945404-4f7b-43f6-8c8d-bdbb2c61ee8e","version":2,"type":"sub_header","properties":{"title":[["Python中的并发编程-1"]]},"created_time":1703138768093,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"af415df9-ed6c-4165-b135-5af0dac66656":{"value":{"id":"af415df9-ed6c-4165-b135-5af0dac66656","version":2,"type":"text","properties":{"title":[["现如今，我们使用的计算机早已是多 CPU 或多核的计算机，而我们使用的操作系统基本都支持“多任务”，这使得我们可以同时运行多个程序，也可以将一个程序分解为若干个相对独立的子任务，让多个子任务“并行”或“并发”的执行，从而缩短程序的执行时间，同时也让用户获得更好的体验。因此当下，不管用什么编程语言进行开发，实现“并行”或“并发”编程已经成为了程序员的标配技能。为了讲述如何在 Python 程序中实现“并行”或“并发”，我们需要先了解两个重要的概念：进程和线程。"]]},"created_time":1703138768093,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"94dd243d-7abf-4c1a-94d9-5db50564de67":{"value":{"id":"94dd243d-7abf-4c1a-94d9-5db50564de67","version":2,"type":"sub_sub_header","properties":{"title":[["线程和进程"]]},"created_time":1703138768093,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"e0bcc63d-7db6-450c-85e0-ae25148c1fb8":{"value":{"id":"e0bcc63d-7db6-450c-85e0-ae25148c1fb8","version":2,"type":"text","properties":{"title":[["我们通过操作系统运行一个程序会创建出一个或多个进程，进程是具有一定独立功能的程序关于某个数据集合上的一次运行活动。简单的说，进程是操作系统分配存储空间的基本单位，每个进程都有自己的地址空间、数据栈以及其他用于跟踪进程执行的辅助数据；操作系统管理所有进程的执行，为它们合理的分配资源。一个进程可以通过 fork 或 spawn 的方式创建新的进程来执行其他的任务，不过新的进程也有自己独立的内存空间，因此两个进程如果要共享数据，必须通过进程间通信机制来实现，具体的方式包括管道、信号、套接字等。"]]},"created_time":1703138768093,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"c1a470e0-40a3-4296-8d3e-0283655c200f":{"value":{"id":"c1a470e0-40a3-4296-8d3e-0283655c200f","version":2,"type":"text","properties":{"title":[["一个进程还可以拥有多个执行线索，简单的说就是拥有多个可以获得 CPU 调度的执行单元，这就是所谓的线程。由于线程在同一个进程下，它们可以共享相同的上下文，因此相对于进程而言，线程间的信息共享和通信更加容易。当然在单核 CPU 系统中，多个线程不可能同时执行，因为在某个时刻只有一个线程能够获得 CPU，多个线程通过共享 CPU 执行时间的方式来达到并发的效果。"]]},"created_time":1703138768093,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"c1e0ef3f-aded-4130-805d-34a85e78156a":{"value":{"id":"c1e0ef3f-aded-4130-805d-34a85e78156a","version":2,"type":"text","properties":{"title":[["在程序中使用多线程技术通常都会带来不言而喻的好处，最主要的体现在提升程序的性能和改善用户体验，今天我们使用的软件几乎都用到了多线程技术，这一点可以利用系统自带的进程监控工具（如 macOS 中的“活动监视器”、Windows 中的“任务管理器”）来证实，如下图所示。"]]},"created_time":1703138768093,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"8b1be8b2-28df-4bc3-9bf1-406771190386":{"value":{"id":"8b1be8b2-28df-4bc3-9bf1-406771190386","version":12,"type":"image","properties":{"size":[["142.0KB"]],"title":[["20210822094243.png"]],"source":[["https://prod-files-secure.s3.us-west-2.amazonaws.com/dcfc0b10-f3f6-4bfe-a7f8-895b46badeca/abb51878-bc09-4f42-ba45-9dffbe0138c0/20210822094243.png"]]},"format":{"block_width":800,"display_source":"https://prod-files-secure.s3.us-west-2.amazonaws.com/dcfc0b10-f3f6-4bfe-a7f8-895b46badeca/abb51878-bc09-4f42-ba45-9dffbe0138c0/20210822094243.png","block_full_width":false,"block_page_width":true,"block_aspect_ratio":0.70125,"block_preserve_scale":true},"created_time":1703140562091,"last_edited_time":1703140567440,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"file_ids":["abb51878-bc09-4f42-ba45-9dffbe0138c0"],"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"a2cf81a0-76c4-471a-b1bf-d5e4d2e6a221":{"value":{"id":"a2cf81a0-76c4-471a-b1bf-d5e4d2e6a221","version":9,"type":"text","created_time":1703138768094,"last_edited_time":1703140559314,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"5f5a198d-67e9-4359-8ccf-66db9996aa47":{"value":{"id":"5f5a198d-67e9-4359-8ccf-66db9996aa47","version":2,"type":"text","properties":{"title":[["这里，我们还需要跟大家再次强调两个概念："],["并发",[["b"]]],["（concurrency）和"],["并行",[["b"]]],["（parallel）。"],["并发",[["b"]]],["通常是指同一时刻只能有一条指令执行，但是多个线程对应的指令被快速轮换地执行。比如一个处理器，它先执行线程 A 的指令一段时间，再执行线程 B 的指令一段时间，再切回到线程 A 执行一段时间。由于处理器执行指令的速度和切换的速度极快，人们完全感知不到计算机在这个过程中有多个线程切换上下文执行的操作，这就使得宏观上看起来多个线程在同时运行，但微观上其实只有一个线程在执行。"],["并行",[["b"]]],["是指同一时刻，有多条指令在多个处理器上同时执行，并行必须要依赖于多个处理器，不论是从宏观上还是微观上，多个线程可以在同一时刻一起执行的。很多时候，我们并不用严格区分并发和并行两个词，所以我们有时候也把 Python 中的多线程、多进程以及异步 I/O 都视为实现并发编程的手段，但实际上前面两者也可以实现并行编程，当然这里还有一个全局解释器锁（GIL）的问题，我们稍后讨论。"]]},"created_time":1703138768094,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"bff0c7c3-ea54-4a26-bf97-e5abbb56aee5":{"value":{"id":"bff0c7c3-ea54-4a26-bf97-e5abbb56aee5","version":2,"type":"sub_sub_header","properties":{"title":[["多线程编程"]]},"created_time":1703138768094,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"b705a732-41af-477e-9f8e-794f1b0d6a3c":{"value":{"id":"b705a732-41af-477e-9f8e-794f1b0d6a3c","version":2,"type":"text","properties":{"title":[["Python 标准库中"],["threading",[["c"]]],["模块的"],["Thread",[["c"]]],["类可以帮助我们非常轻松的实现多线程编程。我们用一个联网下载文件的例子来对比使用多线程和不使用多线程到底有什么区别，代码如下所示。"]]},"created_time":1703138768094,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"efcdd094-a6bc-4fc6-a618-7efc1a3de691":{"value":{"id":"efcdd094-a6bc-4fc6-a618-7efc1a3de691","version":2,"type":"text","properties":{"title":[["不使用多线程的下载。"]]},"created_time":1703138768094,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"1dff56df-33e4-448a-80b5-5f65f0faa847":{"value":{"id":"1dff56df-33e4-448a-80b5-5f65f0faa847","version":4,"type":"code","properties":{"title":[["import random\nimport time\n\n\ndef download(*, filename):\n    start = time.time()\n    print(f'开始下载 {filename}.')\n    time.sleep(random.randint(3, 6))\n    print(f'{filename} 下载完成.')\n    end = time.time()\n    print(f'下载耗时: {end - start:.3f}秒.')\n\n\ndef main():\n    start = time.time()\n    download(filename='Python从入门到住院.pdf')\n    download(filename='MySQL从删库到跑路.avi')\n    download(filename='Linux从精通到放弃.mp4')\n    end = time.time()\n    print(f'总耗时: {end - start:.3f}秒.')\n\n\nif __name__ == '__main__':\n    main()\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138768094,"last_edited_time":1703139312335,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"92ea20a9-6e1d-43c6-b294-aace67b09b87":{"value":{"id":"92ea20a9-6e1d-43c6-b294-aace67b09b87","version":2,"type":"quote","properties":{"title":[["说明：上面的代码并没有真正实现联网下载的功能，而是通过time.sleep()休眠一段时间来模拟下载文件需要一些时间上的开销，跟实际下载的状况比较类似。"]]},"created_time":1703138768094,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"4e7f8691-0ed2-4163-83fa-9602cf9f88bc":{"value":{"id":"4e7f8691-0ed2-4163-83fa-9602cf9f88bc","version":2,"type":"text","properties":{"title":[["运行上面的代码，可以得到如下所示的运行结果。可以看出，当我们的程序只有一个工作线程时，每个下载任务都需要等待上一个下载任务执行结束才能开始，所以程序执行的总耗时是三个下载任务各自执行时间的总和。"]]},"created_time":1703138768094,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"f739bb98-ecdd-454d-add1-19133aba4539":{"value":{"id":"f739bb98-ecdd-454d-add1-19133aba4539","version":2,"type":"code","properties":{"title":[["开始下载Python从入门到住院.pdf.\nPython从入门到住院.pdf下载完成.\n下载耗时: 3.005秒.\n开始下载MySQL从删库到跑路.avi.\nMySQL从删库到跑路.avi下载完成.\n下载耗时: 5.006秒.\n开始下载Linux从精通到放弃.mp4.\nLinux从精通到放弃.mp3下载完成.\n下载耗时: 6.007秒.\n总耗时: 14.018秒.\n"]],"language":[["Plain Text"]]},"format":{"code_wrap":true},"created_time":1703138768094,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"5f4008e1-686a-46c9-a631-03a50ecd75f5":{"value":{"id":"5f4008e1-686a-46c9-a631-03a50ecd75f5","version":2,"type":"text","properties":{"title":[["事实上，上面的三个下载任务之间并没有逻辑上的因果关系，三者是可以“并发”的，下一个下载任务没有必要等待上一个下载任务结束，为此，我们可以使用多线程编程来改写上面的代码。"]]},"created_time":1703138768094,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"ea704574-94f7-4451-ac40-c0aca03336d0":{"value":{"id":"ea704574-94f7-4451-ac40-c0aca03336d0","version":4,"type":"code","properties":{"title":[["import random\nimport time\nfrom threading import Thread\n\n\ndef download(*, filename):\n    start = time.time()\n    print(f'开始下载 {filename}.')\n    time.sleep(random.randint(3, 6))\n    print(f'{filename} 下载完成.')\n    end = time.time()\n    print(f'下载耗时: {end - start:.3f}秒.')\n\n\ndef main():\n    threads = [\n        Thread(target=download, kwargs={'filename': 'Python从入门到住院.pdf'}),\n        Thread(target=download, kwargs={'filename': 'MySQL从删库到跑路.avi'}),\n        Thread(target=download, kwargs={'filename': 'Linux从精通到放弃.mp4'})\n    ]\n    start = time.time()\n    # 启动三个线程\n    for thread in threads:\n        thread.start()\n    # 等待线程结束\n    for thread in threads:\n        thread.join()\n    end = time.time()\n    print(f'总耗时: {end - start:.3f}秒.')\n\n\nif __name__ == '__main__':\n    main()\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138768094,"last_edited_time":1703139318271,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"0a323a54-14f4-412a-ab40-c63323819542":{"value":{"id":"0a323a54-14f4-412a-ab40-c63323819542","version":2,"type":"text","properties":{"title":[["某次的运行结果如下所示。"]]},"created_time":1703138768094,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"061916a4-97f3-4146-8478-4685d1024eb4":{"value":{"id":"061916a4-97f3-4146-8478-4685d1024eb4","version":2,"type":"code","properties":{"title":[["开始下载 Python从入门到住院.pdf.\n开始下载 MySQL从删库到跑路.avi.\n开始下载 Linux从精通到放弃.mp4.\nMySQL从删库到跑路.avi 下载完成.\n下载耗时: 3.005秒.\nPython从入门到住院.pdf 下载完成.\n下载耗时: 5.006秒.\nLinux从精通到放弃.mp4 下载完成.\n下载耗时: 6.003秒.\n总耗时: 6.004秒.\n"]],"language":[["Plain Text"]]},"format":{"code_wrap":true},"created_time":1703138768094,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"8f9fb63e-6a78-4234-8768-23cf0520e3cc":{"value":{"id":"8f9fb63e-6a78-4234-8768-23cf0520e3cc","version":2,"type":"text","properties":{"title":[["通过上面的运行结果可以发现，整个程序的执行时间几乎等于耗时最长的一个下载任务的执行时间，这也就意味着，三个下载任务是并发执行的，不存在一个等待另一个的情况，这样做很显然提高了程序的执行效率。简单的说，如果程序中有非常耗时的执行单元，而这些耗时的执行单元之间又没有逻辑上的因果关系，即 B 单元的执行不依赖于 A 单元的执行结果，那么 A 和 B 两个单元就可以放到两个不同的线程中，让他们并发的执行。这样做的好处除了减少程序执行的等待时间，还可以带来更好的用户体验，因为一个单元的阻塞不会造成程序的“假死”，因为程序中还有其他的单元是可以运转的。"]]},"created_time":1703138768094,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"8c35160c-99ee-4dee-9a0e-b97bf1b76228":{"value":{"id":"8c35160c-99ee-4dee-9a0e-b97bf1b76228","version":2,"type":"sub_sub_header","properties":{"title":[["使用 Thread 类创建线程对象"]]},"created_time":1703138768094,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"32eda68e-ce1c-4a79-bd4f-0bb5a2c28fbb":{"value":{"id":"32eda68e-ce1c-4a79-bd4f-0bb5a2c28fbb","version":2,"type":"text","properties":{"title":[["通过上面的代码可以看出，直接使用"],["Thread",[["c"]]],["类的构造器就可以创建线程对象，而线程对象的"],["start()",[["c"]]],["方法可以启动一个线程。线程启动后会执行"],["target",[["c"]]],["参数指定的函数，当然前提是获得 CPU 的调度；如果"],["target",[["c"]]],["指定的线程要执行的目标函数有参数，需要通过"],["args",[["c"]]],["参数为其进行指定，对于关键字参数，可以通过"],["kwargs",[["c"]]],["参数进行传入。"],["Thread",[["c"]]],["类的构造器还有很多其他的参数，我们遇到的时候再为大家进行讲解，目前需要大家掌握的，就是"],["target",[["c"]]],["、"],["args",[["c"]]],["和"],["kwargs",[["c"]]],["。"]]},"created_time":1703138768095,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"49eb651b-cfc6-4f48-9c89-93b951be9ce7":{"value":{"id":"49eb651b-cfc6-4f48-9c89-93b951be9ce7","version":2,"type":"sub_sub_header","properties":{"title":[["继承 Thread 类自定义线程"]]},"created_time":1703138768095,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"207733e7-18d3-4ad9-96d3-62b134007324":{"value":{"id":"207733e7-18d3-4ad9-96d3-62b134007324","version":2,"type":"text","properties":{"title":[["除了上面的代码展示的创建线程的方式外，还可以通过继承"],["Thread",[["c"]]],["类并重写"],["run()",[["c"]]],["方法的方式来自定义线程，具体的代码如下所示。"]]},"created_time":1703138768095,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"eace0444-d794-4198-9553-a8808c903b00":{"value":{"id":"eace0444-d794-4198-9553-a8808c903b00","version":4,"type":"code","properties":{"title":[["import random\nimport time\nfrom threading import Thread\n\n\nclass DownloadThread(Thread):\n\n    def __init__(self, filename):\n        self.filename = filename\n        super().__init__()\n\n    def run(self):\n        start = time.time()\n        print(f'开始下载 {self.filename}.')\n        time.sleep(random.randint(3, 6))\n        print(f'{self.filename} 下载完成.')\n        end = time.time()\n        print(f'下载耗时: {end - start:.3f}秒.')\n\n\ndef main():\n    threads = [\n        DownloadThread('Python从入门到住院.pdf'),\n        DownloadThread('MySQL从删库到跑路.avi'),\n        DownloadThread('Linux从精通到放弃.mp4')\n    ]\n    start = time.time()\n    # 启动三个线程\n    for thread in threads:\n        thread.start()\n    # 等待线程结束\n    for thread in threads:\n        thread.join()\n    end = time.time()\n    print(f'总耗时: {end - start:.3f}秒.')\n\n\nif __name__ == '__main__':\n    main()\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138768095,"last_edited_time":1703139323924,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"f9a49af5-0246-499b-8e68-77cdc147ea52":{"value":{"id":"f9a49af5-0246-499b-8e68-77cdc147ea52","version":2,"type":"sub_sub_header","properties":{"title":[["使用线程池"]]},"created_time":1703138768095,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"bd5e63c6-bf83-466b-8109-98b200850ead":{"value":{"id":"bd5e63c6-bf83-466b-8109-98b200850ead","version":2,"type":"text","properties":{"title":[["我们还可以通过线程池的方式将任务放到多个线程中去执行，通过线程池来使用线程应该是多线程编程最理想的选择。事实上，线程的创建和释放都会带来较大的开销，频繁的创建和释放线程通常都不是很好的选择。利用线程池，可以提前准备好若干个线程，在使用的过程中不需要再通过自定义的代码创建和释放线程，而是直接复用线程池中的线程。Python 内置的"],["concurrent.futures",[["c"]]],["模块提供了对线程池的支持，代码如下所示。"]]},"created_time":1703138768095,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"210ec30c-268f-4deb-9c2e-138483becdf0":{"value":{"id":"210ec30c-268f-4deb-9c2e-138483becdf0","version":4,"type":"code","properties":{"title":[["import random\nimport time\nfrom concurrent.futures import ThreadPoolExecutor\nfrom threading import Thread\n\n\ndef download(*, filename):\n    start = time.time()\n    print(f'开始下载 {filename}.')\n    time.sleep(random.randint(3, 6))\n    print(f'{filename} 下载完成.')\n    end = time.time()\n    print(f'下载耗时: {end - start:.3f}秒.')\n\n\ndef main():\n    with ThreadPoolExecutor(max_workers=4) as pool:\n        filenames = ['Python从入门到住院.pdf', 'MySQL从删库到跑路.avi', 'Linux从精通到放弃.mp4']\n        start = time.time()\n        for filename in filenames:\n            pool.submit(download, filename=filename)\n    end = time.time()\n    print(f'总耗时: {end - start:.3f}秒.')\n\n\nif __name__ == '__main__':\n    main()\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138768095,"last_edited_time":1703139329064,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"dcee8c58-1188-4d48-8e37-ff2bd21f6924":{"value":{"id":"dcee8c58-1188-4d48-8e37-ff2bd21f6924","version":2,"type":"sub_sub_header","properties":{"title":[["守护线程"]]},"created_time":1703138768095,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"7cf82cc8-2ce9-4fb5-9a14-aa83e9006a88":{"value":{"id":"7cf82cc8-2ce9-4fb5-9a14-aa83e9006a88","version":2,"type":"text","properties":{"title":[["所谓“守护线程”就是在主线程结束的时候，不值得再保留的执行线程。这里的不值得保留指的是守护线程会在其他非守护线程全部运行结束之后被销毁，它守护的是当前进程内所有的非守护线程。简单的说，守护线程会跟随主线程一起挂掉，而主线程的生命周期就是一个进程的生命周期。如果不理解，我们可以看一段简单的代码。"]]},"created_time":1703138768095,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"5a93d405-6354-4f53-b046-7b0d1e0dccdf":{"value":{"id":"5a93d405-6354-4f53-b046-7b0d1e0dccdf","version":4,"type":"code","properties":{"title":[["import time\nfrom threading import Thread\n\n\ndef display(content):\n    while True:\n        print(content, end='', flush=True)\n        time.sleep(0.1)\n\n\ndef main():\n    Thread(target=display, args=('Ping', )).start()\n    Thread(target=display, args=('Pong', )).start()\n\n\nif __name__ == '__main__':\n    main()\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138768095,"last_edited_time":1703139334202,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"93c7304d-654e-45ae-9c42-da15b680f73d":{"value":{"id":"93c7304d-654e-45ae-9c42-da15b680f73d","version":2,"type":"quote","properties":{"title":[["说明：上面的代码中，我们将print函数的参数flush设置为True，这是因为flush参数的值如果为False，而print又没有做换行处理，就会导致每次print输出的内容被放到操作系统的输出缓冲区，直到缓冲区被输出的内容塞满，才会清空缓冲区产生一次输出。上述现象是操作系统为了减少 I/O 中断，提升 CPU 利用率做出的设定，为了让代码产生直观交互，我们才将flush参数设置为True，强制每次输出都清空输出缓冲区。"]]},"created_time":1703138768095,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"258d63b2-2d5a-4111-a38a-2ee649885cbc":{"value":{"id":"258d63b2-2d5a-4111-a38a-2ee649885cbc","version":2,"type":"text","properties":{"title":[["上面的代码运行起来之后是不会停止的，因为两个子线程中都有死循环，除非你手动中断代码的执行。但是，如果在创建线程对象时，将名为"],["daemon",[["c"]]],["的参数设置为"],["True",[["c"]]],["，这两个线程就会变成守护线程，那么在其他线程结束时，即便有死循环，两个守护线程也会挂掉，不会再继续执行下去，代码如下所示。"]]},"created_time":1703138768095,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"125cafe8-4b90-4129-838b-70c30a674b3f":{"value":{"id":"125cafe8-4b90-4129-838b-70c30a674b3f","version":4,"type":"code","properties":{"title":[["import time\nfrom threading import Thread\n\n\ndef display(content):\n    while True:\n        print(content, end='', flush=True)\n        time.sleep(0.1)\n\n\ndef main():\n    Thread(target=display, args=('Ping', ), daemon=True).start()\n    Thread(target=display, args=('Pong', ), daemon=True).start()\n    time.sleep(5)\n\n\nif __name__ == '__main__':\n    main()\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138768095,"last_edited_time":1703139338986,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"19b12035-e6a0-4343-a0b1-931e8861773e":{"value":{"id":"19b12035-e6a0-4343-a0b1-931e8861773e","version":2,"type":"text","properties":{"title":[["上面的代码，我们在主线程中添加了一行"],["time.sleep(5)",[["c"]]],["让主线程休眠5秒，在这个过程中，输出"],["Ping",[["c"]]],["和"],["Pong",[["c"]]],["的守护线程会持续运转，直到主线程在5秒后结束，这两个守护线程也被销毁，不再继续运行。"]]},"created_time":1703138768095,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"85b6a1d3-75bd-4216-ba3f-7d2a9352582f":{"value":{"id":"85b6a1d3-75bd-4216-ba3f-7d2a9352582f","version":2,"type":"quote","properties":{"title":[["思考：如果将上面代码第12行的daemon=True去掉，代码会怎样执行？有兴趣的读者可以尝试一下，并看看实际执行的结果跟你想象的是否一致。"]]},"created_time":1703138768095,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"33b30d11-684e-4b1f-86e2-9660a27d5cbd":{"value":{"id":"33b30d11-684e-4b1f-86e2-9660a27d5cbd","version":2,"type":"sub_sub_header","properties":{"title":[["资源竞争"]]},"created_time":1703138768095,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"f0db16e2-dbcd-470f-a4ed-1a993821f1a2":{"value":{"id":"f0db16e2-dbcd-470f-a4ed-1a993821f1a2","version":2,"type":"text","properties":{"title":[["在编写多线程代码时，不可避免的会遇到多个线程竞争同一个资源（对象）的情况。在这种情况下，如果没有合理的机制来保护被竞争的资源，那么就有可能出现非预期的状况。下面的代码创建了"],["100",[["c"]]],["个线程向同一个银行账户（初始余额为"],["0",[["c"]]],["元）转账，每个线程转账金额为"],["1",[["c"]]],["元。在正常的情况下，我们的银行账户最终的余额应该是"],["100",[["c"]]],["元，但是运行下面的代码我们并不能得到"],["100",[["c"]]],["元这个结果。"]]},"created_time":1703138768095,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"a3da8199-93d8-41f1-a40e-94d9ad3f852a":{"value":{"id":"a3da8199-93d8-41f1-a40e-94d9ad3f852a","version":4,"type":"code","properties":{"title":[["import time\n\nfrom concurrent.futures import ThreadPoolExecutor\n\n\nclass Account(object):\n    \"\"\"银行账户\"\"\"\n\n    def __init__(self):\n        self.balance = 0.0\n\n    def deposit(self, money):\n        \"\"\"存钱\"\"\"\n        new_balance = self.balance + money\n        time.sleep(0.01)\n        self.balance = new_balance\n\n\ndef main():\n    \"\"\"主函数\"\"\"\n    account = Account()\n    with ThreadPoolExecutor(max_workers=16) as pool:\n        for _ in range(100):\n            pool.submit(account.deposit, 1)\n    print(account.balance)\n\n\nif __name__ == '__main__':\n    main()\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138768095,"last_edited_time":1703139343606,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"b6b50dd4-d455-4a94-b111-d517e78a49b0":{"value":{"id":"b6b50dd4-d455-4a94-b111-d517e78a49b0","version":2,"type":"text","properties":{"title":[["上面代码中的"],["Account",[["c"]]],["类代表了银行账户，它的"],["deposit",[["c"]]],["方法代表存款行为，参数"],["money",[["c"]]],["代表存入的金额，该方法通过"],["time.sleep",[["c"]]],["函数模拟受理存款需要一段时间。我们通过线程池的方式启动了"],["100",[["c"]]],["个线程向一个账户转账，但是上面的代码并不能运行出"],["100",[["c"]]],["这个我们期望的结果，这就是在多个线程竞争一个资源的时候，可能会遇到的数据不一致的问题。注意上面代码的第"],["14",[["c"]]],["行，当多个线程都执行到这行代码时，它们会在相同的余额上执行加上存入金额的操作，这就会造成“丢失更新”现象，即之前修改数据的成果被后续的修改给覆盖掉了，所以才得不到正确的结果。"]]},"created_time":1703138768096,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"9ec066ef-965d-4bf9-8e2d-fcd02a2cf768":{"value":{"id":"9ec066ef-965d-4bf9-8e2d-fcd02a2cf768","version":2,"type":"text","properties":{"title":[["要解决上面的问题，可以使用锁机制，通过锁对操作数据的关键代码加以保护。Python 标准库的"],["threading",[["c"]]],["模块提供了"],["Lock",[["c"]]],["和"],["RLock",[["c"]]],["类来支持锁机制，这里我们不去深究二者的区别，建议大家直接使用"],["RLock",[["c"]]],["。接下来，我们给银行账户添加一个锁对象，通过锁对象来解决刚才存款时发生“丢失更新”的问题，代码如下所示。"]]},"created_time":1703138768096,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"65ce9fd4-30ce-4877-9a11-6b661fbafcdc":{"value":{"id":"65ce9fd4-30ce-4877-9a11-6b661fbafcdc","version":4,"type":"code","properties":{"title":[["import time\n\nfrom concurrent.futures import ThreadPoolExecutor\nfrom threading import RLock\n\n\nclass Account(object):\n    \"\"\"银行账户\"\"\"\n\n    def __init__(self):\n        self.balance = 0.0\n        self.lock = RLock()\n\n    def deposit(self, money):\n        # 获得锁\n        self.lock.acquire()\n        try:\n            new_balance = self.balance + money\n            time.sleep(0.01)\n            self.balance = new_balance\n        finally:\n            # 释放锁\n            self.lock.release()\n\n\ndef main():\n    \"\"\"主函数\"\"\"\n    account = Account()\n    with ThreadPoolExecutor(max_workers=16) as pool:\n        for _ in range(100):\n            pool.submit(account.deposit, 1)\n    print(account.balance)\n\n\nif __name__ == '__main__':\n    main()\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138768096,"last_edited_time":1703139348637,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"f2524c49-1255-49d9-be35-52544e06e35c":{"value":{"id":"f2524c49-1255-49d9-be35-52544e06e35c","version":2,"type":"text","properties":{"title":[["上面代码中，获得锁和释放锁的操作也可以通过上下文语法来实现，使用上下文语法会让代码更加简单优雅，这也是我们推荐大家使用的方式。"]]},"created_time":1703138768096,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"99f5f1e9-2e83-4868-b702-34bff7b0a330":{"value":{"id":"99f5f1e9-2e83-4868-b702-34bff7b0a330","version":4,"type":"code","properties":{"title":[["import time\n\nfrom concurrent.futures import ThreadPoolExecutor\nfrom threading import RLock\n\n\nclass Account(object):\n    \"\"\"银行账户\"\"\"\n\n    def __init__(self):\n        self.balance = 0.0\n        self.lock = RLock()\n\n    def deposit(self, money):\n        # 通过上下文语法获得锁和释放锁\n        with self.lock:\n            new_balance = self.balance + money\n            time.sleep(0.01)\n            self.balance = new_balance\n\n\ndef main():\n    \"\"\"主函数\"\"\"\n    account = Account()\n    with ThreadPoolExecutor(max_workers=16) as pool:\n        for _ in range(100):\n            pool.submit(account.deposit, 1)\n    print(account.balance)\n\n\nif __name__ == '__main__':\n    main()\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138768096,"last_edited_time":1703139354991,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"c09f35c9-dd7a-4c8c-a688-60890e1a8aac":{"value":{"id":"c09f35c9-dd7a-4c8c-a688-60890e1a8aac","version":2,"type":"quote","properties":{"title":[["思考：将上面的代码修改为5个线程向银行账户存钱，5个线程从银行账户取钱，取钱的线程在银行账户余额不足时，需要停下来等待存钱的线程将钱存入后再尝试取钱。这里需要用到线程调度的知识，大家可以自行研究下threading模块中的Condition类，看看是否能够完成这个任务。"]]},"created_time":1703138768096,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"1bc1fd68-7274-4f16-acea-a39b629c0130":{"value":{"id":"1bc1fd68-7274-4f16-acea-a39b629c0130","version":2,"type":"sub_sub_header","properties":{"title":[["GIL问题"]]},"created_time":1703138768096,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"de76c833-e707-499a-b132-aaf6f2028b4f":{"value":{"id":"de76c833-e707-499a-b132-aaf6f2028b4f","version":2,"type":"text","properties":{"title":[["如果使用官方的 Python 解释器（通常称之为 CPython）运行 Python 程序，我们并不能通过使用多线程的方式将 CPU 的利用率提升到逼近400%（对于4核 CPU）或逼近800%（对于8核 CPU）这样的水平，因为 CPython 在执行代码时，会受到 GIL（全局解释器锁）的限制。具体的说，CPython 在执行任何代码时，都需要对应的线程先获得 GIL，然后每执行100条（字节码）指令，CPython 就会让获得 GIL 的线程主动释放 GIL，这样别的线程才有机会执行。因为 GIL 的存在，无论你的 CPU 有多少个核，我们编写的 Python 代码也没有机会真正并行的执行。"]]},"created_time":1703138768096,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"08510a8f-0d1f-4a2f-a460-5c1aad3276bd":{"value":{"id":"08510a8f-0d1f-4a2f-a460-5c1aad3276bd","version":2,"type":"text","properties":{"title":[["GIL 是官方 Python 解释器在设计上的历史遗留问题，要解决这个问题，让多线程能够发挥 CPU 的多核优势，需要重新实现一个不带 GIL 的 Python 解释器。这个问题按照官方的说法，在 Python 发布4.0版本时会得到解决，就让我们拭目以待吧。当下，对于 CPython 而言，如果希望充分发挥 CPU 的多核优势，可以考虑使用多进程，因为每个进程都对应一个 Python 解释器，因此每个进程都有自己独立的 GIL，这样就可以突破 GIL 的限制。在下一个章节中，我们会为大家介绍关于多进程的相关知识，并对多线程和多进程的代码及其执行效果进行比较。"]]},"created_time":1703138768096,"last_edited_time":1703138768109,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"613d2fb8-b309-4114-8fb9-0d14e0d3867d":{"value":{"id":"613d2fb8-b309-4114-8fb9-0d14e0d3867d","version":6,"type":"text","format":{"copied_from_pointer":{"id":"99779fe2-fe15-47f5-bcf2-4fba31251f84","table":"block","spaceId":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"}},"created_time":1703138457085,"last_edited_time":1703138758078,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"copied_from":"99779fe2-fe15-47f5-bcf2-4fba31251f84","space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"d51844e4-92b0-4c4d-b21e-64bdfbf7935b":{"value":{"id":"d51844e4-92b0-4c4d-b21e-64bdfbf7935b","version":8,"type":"text","format":{"copied_from_pointer":{"id":"99779fe2-fe15-47f5-bcf2-4fba31251f84","table":"block","spaceId":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"}},"created_time":1703138457085,"last_edited_time":1703138776261,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"copied_from":"99779fe2-fe15-47f5-bcf2-4fba31251f84","space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"36f36a3c-b355-43a8-8dc8-d8ccd4a7d808":{"value":{"id":"36f36a3c-b355-43a8-8dc8-d8ccd4a7d808","version":2,"type":"sub_header","properties":{"title":[["Python中的并发编程-2"]]},"created_time":1703138782070,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"7e5e7a14-79a8-4432-a1ce-1ebe93d1d684":{"value":{"id":"7e5e7a14-79a8-4432-a1ce-1ebe93d1d684","version":2,"type":"text","properties":{"title":[["在上一课中我们说过，由于 GIL 的存在，CPython 中的多线程并不能发挥 CPU 的多核优势，如果希望突破 GIL 的限制，可以考虑使用多进程。对于多进程的程序，每个进程都有一个属于自己的 GIL，所以多进程不会受到 GIL 的影响。那么，我们应该如何在 Python 程序中创建和使用多进程呢？"]]},"created_time":1703138782070,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"20568bd2-1204-498b-b5eb-84438a3beed8":{"value":{"id":"20568bd2-1204-498b-b5eb-84438a3beed8","version":2,"type":"text","properties":{"title":[["###创建进程"]]},"created_time":1703138782071,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"4d8803f0-9998-44b1-aa41-04679ce62657":{"value":{"id":"4d8803f0-9998-44b1-aa41-04679ce62657","version":2,"type":"text","properties":{"title":[["在 Python 中可以基于"],["Process",[["c"]]],["类来创建进程，虽然进程和线程有着本质的差别，但是"],["Process",[["c"]]],["类和"],["Thread",[["c"]]],["类的用法却非常类似。在使用"],["Process",[["c"]]],["类的构造器创建对象时，也是通过"],["target",[["c"]]],["参数传入一个函数来指定进程要执行的代码，而"],["args",[["c"]]],["和"],["kwargs",[["c"]]],["参数可以指定该函数使用的参数值。"]]},"created_time":1703138782071,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"5f184731-f5d6-4c8b-8193-54614d3e6a0a":{"value":{"id":"5f184731-f5d6-4c8b-8193-54614d3e6a0a","version":4,"type":"code","properties":{"title":[["from multiprocessing import Process, current_process\nfrom time import sleep\n\n\ndef sub_task(content, nums):\n    # 通过current_process函数获取当前进程对象\n    # 通过进程对象的pid和name属性获取进程的ID号和名字\n    print(f'PID: {current_process().pid}')\n    print(f'Name: {current_process().name}')\n    # 通过下面的输出不难发现，每个进程都有自己的nums列表，进程之间本就不共享内存\n    # 在创建子进程时复制了父进程的数据结构，三个进程从列表中pop(0)得到的值都是20\n    counter, total = 0, nums.pop(0)\n    print(f'Loop count: {total}')\n    sleep(0.5)\n    while counter \u003c total:\n        counter += 1\n        print(f'{counter}: {content}')\n        sleep(0.01)\n\n\ndef main():\n    nums = [20, 30, 40]\n    # 创建并启动进程来执行指定的函数\n    Process(target=sub_task, args=('Ping', nums)).start()\n    Process(target=sub_task, args=('Pong', nums)).start()\n    # 在主进程中执行sub_task函数\n    sub_task('Good', nums)\n\n\nif __name__ == '__main__':\n    main()\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138782071,"last_edited_time":1703139360999,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"7e2cde62-aaa2-435c-9d1a-2fc42d0f0ecc":{"value":{"id":"7e2cde62-aaa2-435c-9d1a-2fc42d0f0ecc","version":2,"type":"quote","properties":{"title":[["说明：上面的代码通过current_process函数获取当前进程对象，再通过进程对象的pid属性获取进程ID。在 Python 中，使用os模块的getpid函数也可以达到同样的效果。"]]},"created_time":1703138782071,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"b91ebd53-90cd-4599-91db-7dd4cfc39f46":{"value":{"id":"b91ebd53-90cd-4599-91db-7dd4cfc39f46","version":2,"type":"text","properties":{"title":[["如果愿意，也可以使用"],["os",[["c"]]],["模块的"],["fork",[["c"]]],["函数来创建进程，调用该函数时，操作系统自动把当前进程（父进程）复制一份（子进程），父进程的"],["fork",[["c"]]],["函数会返回子进程的ID，而子进程中的"],["fork",[["c"]]],["函数会返回"],["0",[["c"]]],["，也就是说这个函数调用一次会在父进程和子进程中得到两个不同的返回值。需要注意的是，Windows 系统并不支持"],["fork",[["c"]]],["函数，如果你使用的是 Linux 或 macOS 系统，可以试试下面的代码。"]]},"created_time":1703138782071,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"2e02da4e-a6ea-4c25-843f-6a8300236e18":{"value":{"id":"2e02da4e-a6ea-4c25-843f-6a8300236e18","version":4,"type":"code","properties":{"title":[["import os\n\nprint(f'PID: {os.getpid()}')\npid = os.fork()\nif pid == 0:\n    print(f'子进程 - PID: {os.getpid()}')\n    print('Todo: 在子进程中执行的代码')\nelse:\n    print(f'父进程 - PID: {os.getpid()}')\n    print('Todo: 在父进程中执行的代码')\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138782071,"last_edited_time":1703139375674,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"1a670f68-92ae-4677-ae87-7fc50071e12e":{"value":{"id":"1a670f68-92ae-4677-ae87-7fc50071e12e","version":2,"type":"text","properties":{"title":[["简而言之，我们还是推荐大家通过直接使用"],["Process",[["c"]]],["类、继承"],["Process",[["c"]]],["类和使用进程池（"],["ProcessPoolExecutor",[["c"]]],["）这三种方式来创建和使用多进程，这三种方式不同于上面的"],["fork",[["c"]]],["函数，能够保证代码的兼容性和可移植性。具体的做法跟之前讲过的创建和使用多线程的方式比较接近，此处不再进行赘述。"]]},"created_time":1703138782071,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"f507c861-8f1f-4d22-9a94-39a90d81b82a":{"value":{"id":"f507c861-8f1f-4d22-9a94-39a90d81b82a","version":2,"type":"sub_sub_header","properties":{"title":[["多进程和多线程的比较"]]},"created_time":1703138782071,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"513eb8cd-7fb8-4d1c-8a74-6ef3a26d4fcf":{"value":{"id":"513eb8cd-7fb8-4d1c-8a74-6ef3a26d4fcf","version":2,"type":"text","properties":{"title":[["对于爬虫这类 I/O 密集型任务来说，使用多进程并没有什么优势；但是对于计算密集型任务来说，多进程相比多线程，在效率上会有显著的提升，我们可以通过下面的代码来加以证明。下面的代码会通过多线程和多进程两种方式来判断一组大整数是不是质数，很显然这是一个计算密集型任务，我们将任务分别放到多个线程和多个进程中来加速代码的执行，让我们看看多线程和多进程的代码具体表现有何不同。"]]},"created_time":1703138782071,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"57592588-4c53-45b1-90c5-4a2eaac3f3a7":{"value":{"id":"57592588-4c53-45b1-90c5-4a2eaac3f3a7","version":2,"type":"text","properties":{"title":[["我们先实现一个多线程的版本，代码如下所示。"]]},"created_time":1703138782072,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"dcde29ee-8fcf-4d3f-87d1-76461ed513ad":{"value":{"id":"dcde29ee-8fcf-4d3f-87d1-76461ed513ad","version":4,"type":"code","properties":{"title":[["import concurrent.futures\n\nPRIMES = [\n    1116281,\n    1297337,\n    104395303,\n    472882027,\n    533000389,\n    817504243,\n    982451653,\n    112272535095293,\n    112582705942171,\n    112272535095293,\n    115280095190773,\n    115797848077099,\n    1099726899285419\n] * 5\n\n\ndef is_prime(n):\n    \"\"\"判断素数\"\"\"\n    for i in range(2, int(n ** 0.5) + 1):\n        if n % i == 0:\n            return False\n    return n != 1\n\n\ndef main():\n    \"\"\"主函数\"\"\"\n    with concurrent.futures.ThreadPoolExecutor(max_workers=16) as executor:\n        for number, prime in zip(PRIMES, executor.map(is_prime, PRIMES)):\n            print('%d is prime: %s' % (number, prime))\n\n\nif __name__ == '__main__':\n    main()\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138782072,"last_edited_time":1703139385316,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"61dfd5b7-fe96-4ebd-a629-e0e8d695dbb7":{"value":{"id":"61dfd5b7-fe96-4ebd-a629-e0e8d695dbb7","version":2,"type":"text","properties":{"title":[["假设上面的代码保存在名为"],["example.py",[["c"]]],["的文件中，在 Linux 或 macOS 系统上，可以使用"],["time python example.py",[["c"]]],["命令执行程序并获得操作系统关于执行时间的统计，在我的 macOS 上，某次的运行结果的最后一行输出如下所示。"]]},"created_time":1703138782072,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"1eaa7b87-72fe-4fcc-9f03-b38726cd9fd7":{"value":{"id":"1eaa7b87-72fe-4fcc-9f03-b38726cd9fd7","version":2,"type":"code","properties":{"title":[["python example09.py  38.69s user 1.01s system 101% cpu 39.213 total\n"]],"language":[["Plain Text"]]},"format":{"code_wrap":true},"created_time":1703138782072,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"4290d981-1f42-474c-83c4-d5b4dedbf275":{"value":{"id":"4290d981-1f42-474c-83c4-d5b4dedbf275","version":2,"type":"text","properties":{"title":[["从运行结果可以看出，多线程的代码只能让 CPU 利用率达到100%，这其实已经证明了多线程的代码无法利用 CPU 多核特性来加速代码的执行，我们再看看多进程的版本，我们将上面代码中的线程池（"],["ThreadPoolExecutor",[["c"]]],["）更换为进程池（"],["ProcessPoolExecutor",[["c"]]],["）。"]]},"created_time":1703138782072,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"8e5052df-2460-482b-a2b4-85f7709d2e32":{"value":{"id":"8e5052df-2460-482b-a2b4-85f7709d2e32","version":2,"type":"text","properties":{"title":[["多进程的版本。"]]},"created_time":1703138782072,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"233ad5ae-ce99-4f26-ad94-821f1cd8fd38":{"value":{"id":"233ad5ae-ce99-4f26-ad94-821f1cd8fd38","version":4,"type":"code","properties":{"title":[["import concurrent.futures\n\nPRIMES = [\n    1116281,\n    1297337,\n    104395303,\n    472882027,\n    533000389,\n    817504243,\n    982451653,\n    112272535095293,\n    112582705942171,\n    112272535095293,\n    115280095190773,\n    115797848077099,\n    1099726899285419\n] * 5\n\n\ndef is_prime(n):\n    \"\"\"判断素数\"\"\"\n    for i in range(2, int(n ** 0.5) + 1):\n        if n % i == 0:\n            return False\n    return n != 1\n\n\ndef main():\n    \"\"\"主函数\"\"\"\n    with concurrent.futures.ProcessPoolExecutor(max_workers=16) as executor:\n        for number, prime in zip(PRIMES, executor.map(is_prime, PRIMES)):\n            print('%d is prime: %s' % (number, prime))\n\n\nif __name__ == '__main__':\n    main()\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138782072,"last_edited_time":1703139394477,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"13c3f95c-17be-4942-8cc9-118eb2e080c6":{"value":{"id":"13c3f95c-17be-4942-8cc9-118eb2e080c6","version":2,"type":"quote","properties":{"title":[["提示：运行上面的代码时，可以通过操作系统的任务管理器（资源监视器）来查看是否启动了多个 Python  解释器进程。"]]},"created_time":1703138782072,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"5dd29b25-7f9a-4900-bd10-5f5ef48ef99d":{"value":{"id":"5dd29b25-7f9a-4900-bd10-5f5ef48ef99d","version":2,"type":"text","properties":{"title":[["我们仍然通过"],["time python example.py",[["c"]]],["的方式来执行上述代码，运行结果的最后一行如下所示。"]]},"created_time":1703138782072,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"01055cd5-5d47-4b78-ab1f-c637deb9ef6d":{"value":{"id":"01055cd5-5d47-4b78-ab1f-c637deb9ef6d","version":2,"type":"code","properties":{"title":[["python example09.py 106.63s user 0.57s system 389% cpu 27.497 total\n"]],"language":[["Plain Text"]]},"format":{"code_wrap":true},"created_time":1703138782072,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"0fb6786e-0428-4047-8cca-4c0c7479c857":{"value":{"id":"0fb6786e-0428-4047-8cca-4c0c7479c857","version":2,"type":"text","properties":{"title":[["可以看出，多进程的版本在我使用的这台电脑上，让 CPU 的利用率达到了将近400%，而运行代码时用户态耗费的 CPU 的时间（106.63秒）几乎是代码运行总时间（27.497秒）的4倍，从这两点都可以看出，我的电脑使用了一款4核的 CPU。当然，要知道自己的电脑有几个 CPU 或几个核，可以直接使用下面的代码。"]]},"created_time":1703138782072,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"2feb6476-f88d-4dc8-9132-e239791717d4":{"value":{"id":"2feb6476-f88d-4dc8-9132-e239791717d4","version":4,"type":"code","properties":{"title":[["import os\n\nprint(os.cpu_count())\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138782072,"last_edited_time":1703139399021,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reade
