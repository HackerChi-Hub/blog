r"},"e6947d10-d383-4ee8-afe3-0ee519e11b58":{"value":{"id":"e6947d10-d383-4ee8-afe3-0ee519e11b58","version":2,"type":"text","properties":{"title":[["综上所述，多进程可以突破 GIL 的限制，充分利用 CPU 多核特性，对于计算密集型任务，这一点是相当重要的。常见的计算密集型任务包括科学计算、图像处理、音视频编解码等，如果这些计算密集型任务本身是可以并行的，那么使用多进程应该是更好的选择。"]]},"created_time":1703138782072,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"ffd81c9b-4d24-455d-b66f-ee28925bab02":{"value":{"id":"ffd81c9b-4d24-455d-b66f-ee28925bab02","version":2,"type":"sub_sub_header","properties":{"title":[["进程间通信"]]},"created_time":1703138782072,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"d5343db2-7941-4bc4-bbab-82e774bb2697":{"value":{"id":"d5343db2-7941-4bc4-bbab-82e774bb2697","version":2,"type":"text","properties":{"title":[["在讲解进程间通信之前，先给大家一个任务：启动两个进程，一个输出“Ping”，一个输出“Pong”，两个进程输出的“Ping”和“Pong”加起来一共有50个时，就结束程序。听起来是不是非常简单，但是实际编写代码时，由于多个进程之间不能够像多个线程之间直接通过共享内存的方式交换数据，所以下面的代码是达不到我们想要的结果的。"]]},"created_time":1703138782072,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"a093ec14-d0ee-43cc-bc43-40b9eb9dcf74":{"value":{"id":"a093ec14-d0ee-43cc-bc43-40b9eb9dcf74","version":4,"type":"code","properties":{"title":[["from multiprocessing import Process\nfrom time import sleep\n\ncounter = 0\n\n\ndef sub_task(string):\n    global counter\n    while counter \u003c 50:\n        print(string, end='', flush=True)\n        counter += 1\n        sleep(0.01)\n\n\ndef main():\n    Process(target=sub_task, args=('Ping', )).start()\n    Process(target=sub_task, args=('Pong', )).start()\n\n\nif __name__ == '__main__':\n    main()\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138782072,"last_edited_time":1703139404390,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"71239ece-7e11-4ad2-86d9-af2e1bff63e5":{"value":{"id":"71239ece-7e11-4ad2-86d9-af2e1bff63e5","version":2,"type":"text","properties":{"title":[["上面的代码看起来没毛病，但是最后的结果是“Ping”和“Pong”各输出了50个。再次提醒大家，当我们在程序中创建进程的时候，子进程会复制父进程及其所有的数据结构，每个子进程有自己独立的内存空间，这也就意味着两个子进程中各有一个"],["counter",[["c"]]],["变量，它们都会从"],["0",[["c"]]],["加到"],["50",[["c"]]],["，所以结果就可想而知了。要解决这个问题比较简单的办法是使用"],["multiprocessing",[["c"]]],["模块中的"],["Queue",[["c"]]],["类，它是可以被多个进程共享的队列，底层是通过操作系统底层的管道和信号量（semaphore）机制来实现的，代码如下所示。"]]},"created_time":1703138782073,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"7bd55eb6-1461-4ef0-a8a2-4fdb89f0cc53":{"value":{"id":"7bd55eb6-1461-4ef0-a8a2-4fdb89f0cc53","version":4,"type":"code","properties":{"title":[["import time\nfrom multiprocessing import Process, Queue\n\n\ndef sub_task(content, queue):\n    counter = queue.get()\n    while counter \u003c 50:\n        print(content, end='', flush=True)\n        counter += 1\n        queue.put(counter)\n        time.sleep(0.01)\n        counter = queue.get()\n\n\ndef main():\n    queue = Queue()\n    queue.put(0)\n    p1 = Process(target=sub_task, args=('Ping', queue))\n    p1.start()\n    p2 = Process(target=sub_task, args=('Pong', queue))\n    p2.start()\n    while p1.is_alive() and p2.is_alive():\n        pass\n    queue.put(50)\n\n\nif __name__ == '__main__':\n    main()\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138782073,"last_edited_time":1703139410522,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"99b911ae-6c4a-4004-bbd9-26e82819678a":{"value":{"id":"99b911ae-6c4a-4004-bbd9-26e82819678a","version":2,"type":"quote","properties":{"title":[["提示：multiprocessing.Queue对象的get方法默认在队列为空时是会阻塞的，直到获取到数据才会返回。如果不希望该方法阻塞以及需要指定阻塞的超时时间，可以通过指定block和timeout参数进行设定。"]]},"created_time":1703138782073,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"3cfb40c8-7491-4cbf-b14b-9aaae3714e20":{"value":{"id":"3cfb40c8-7491-4cbf-b14b-9aaae3714e20","version":2,"type":"text","properties":{"title":[["上面的代码通过"],["Queue",[["c"]]],["类的"],["get",[["c"]]],["和"],["put",[["c"]]],["方法让三个进程（"],["p1",[["c"]]],["、"],["p2",[["c"]]],["和主进程）实现了数据的共享，这就是所谓的进程间的通信，通过这种方式，当"],["Queue",[["c"]]],["中取出的值已经大于等于"],["50",[["c"]]],["时，"],["p1",[["c"]]],["和"],["p2",[["c"]]],["就会跳出"],["while",[["c"]]],["循环，从而终止进程的执行。代码第22行的循环是为了等待"],["p1",[["c"]]],["和"],["p2",[["c"]]],["两个进程中的一个结束，这时候主进程还需要向"],["Queue",[["c"]]],["中放置一个大于等于"],["50",[["c"]]],["的值，这样另一个尚未结束的进程也会因为读到这个大于等于"],["50",[["c"]]],["的值而终止。"]]},"created_time":1703138782073,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"799b9dfb-9ab8-4aef-9b44-12d18435ab96":{"value":{"id":"799b9dfb-9ab8-4aef-9b44-12d18435ab96","version":2,"type":"text","properties":{"title":[["进程间通信的方式还有很多，比如使用套接字也可以实现两个进程的通信，甚至于这两个进程并不在同一台主机上，有兴趣的读者可以自行了解。"]]},"created_time":1703138782073,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"f01a4685-022b-4834-9171-e47bb0a283ae":{"value":{"id":"f01a4685-022b-4834-9171-e47bb0a283ae","version":2,"type":"sub_sub_header","properties":{"title":[["简单的总结"]]},"created_time":1703138782073,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"934a5f74-e8f0-4413-80de-3916659417ba":{"value":{"id":"934a5f74-e8f0-4413-80de-3916659417ba","version":2,"type":"text","properties":{"title":[["在 Python 中，我们还可以通过"],["subprocess",[["c"]]],["模块的"],["call",[["c"]]],["函数执行其他的命令来创建子进程，相当于就是在我们的程序中调用其他程序，这里我们暂不探讨这些知识，有兴趣的读者可以自行研究。"]]},"created_time":1703138782073,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"dbd4178e-a061-4024-9a15-6326aa8f7740":{"value":{"id":"dbd4178e-a061-4024-9a15-6326aa8f7740","version":2,"type":"text","properties":{"title":[["对于Python开发者来说，以下情况需要考虑使用多线程："]]},"created_time":1703138782073,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"d0019fbb-3b7c-4adc-83c1-6761c29d90d3":{"value":{"id":"d0019fbb-3b7c-4adc-83c1-6761c29d90d3","version":2,"type":"numbered_list","properties":{"title":[["程序需要维护许多共享的状态（尤其是可变状态），Python 中的列表、字典、集合都是线程安全的（多个线程同时操作同一个列表、字典或集合，不会引发错误和数据问题），所以使用线程而不是进程维护共享状态的代价相对较小。"]]},"created_time":1703138782073,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"c13497da-c44d-4f4c-a698-c8ac280dfefe":{"value":{"id":"c13497da-c44d-4f4c-a698-c8ac280dfefe","version":2,"type":"numbered_list","properties":{"title":[["程序会花费大量时间在 I/O 操作上，没有太多并行计算的需求且不需占用太多的内存。"]]},"created_time":1703138782073,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"df451da7-ee07-465c-9973-a6789a9a3fe6":{"value":{"id":"df451da7-ee07-465c-9973-a6789a9a3fe6","version":2,"type":"text","properties":{"title":[["那么在遇到下列情况时，应该考虑使用多进程："]]},"created_time":1703138782073,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"0378226b-6e0b-48d9-bf7b-24fb73b10f64":{"value":{"id":"0378226b-6e0b-48d9-bf7b-24fb73b10f64","version":2,"type":"numbered_list","properties":{"title":[["程序执行计算密集型任务（如：音视频编解码、数据压缩、科学计算等）。"]]},"created_time":1703138782074,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"0f05d22a-03ee-4241-8f1f-e97fda17a6f2":{"value":{"id":"0f05d22a-03ee-4241-8f1f-e97fda17a6f2","version":2,"type":"numbered_list","properties":{"title":[["程序的输入可以并行的分成块，并且可以将运算结果合并。"]]},"created_time":1703138782074,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"751fc7fe-ad8f-4123-95e0-e52ba50d9aa1":{"value":{"id":"751fc7fe-ad8f-4123-95e0-e52ba50d9aa1","version":2,"type":"numbered_list","properties":{"title":[["程序在内存使用方面没有任何限制且不强依赖于 I/O 操作（如读写文件、套接字等）。"]]},"created_time":1703138782074,"last_edited_time":1703138782089,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"d907741a-1b41-4e02-aec5-7b0c3a5df264":{"value":{"id":"d907741a-1b41-4e02-aec5-7b0c3a5df264","version":6,"type":"text","format":{"copied_from_pointer":{"id":"99779fe2-fe15-47f5-bcf2-4fba31251f84","table":"block","spaceId":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"}},"created_time":1703138457085,"last_edited_time":1703138788221,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"copied_from":"99779fe2-fe15-47f5-bcf2-4fba31251f84","space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"a241a5e6-2adf-4ca9-b2d2-3f2bf94b005a":{"value":{"id":"a241a5e6-2adf-4ca9-b2d2-3f2bf94b005a","version":6,"type":"text","format":{"copied_from_pointer":{"id":"99779fe2-fe15-47f5-bcf2-4fba31251f84","table":"block","spaceId":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"}},"created_time":1703138457085,"last_edited_time":1703138788401,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"copied_from":"99779fe2-fe15-47f5-bcf2-4fba31251f84","space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"b577ea96-68d2-4cea-8125-aac9292cb4a5":{"value":{"id":"b577ea96-68d2-4cea-8125-aac9292cb4a5","version":2,"type":"sub_header","properties":{"title":[["Python中的并发编程-3"]]},"created_time":1703138801176,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"60312f9d-254c-4339-b944-d45a886c4cb2":{"value":{"id":"60312f9d-254c-4339-b944-d45a886c4cb2","version":2,"type":"text","properties":{"title":[["爬虫是典型的 I/O 密集型任务，I/O 密集型任务的特点就是程序会经常性的因为 I/O 操作而进入阻塞状态，比如我们之前使用"],["requests",[["c"]]],["获取页面代码或二进制内容，发出一个请求之后，程序必须要等待网站返回响应之后才能继续运行，如果目标网站不是很给力或者网络状况不是很理想，那么等待响应的时间可能会很久，而在这个过程中整个程序是一直阻塞在那里，没有做任何的事情。通过前面的课程，我们已经知道了可以通过多线程的方式为爬虫提速，使用多线程的本质就是，当一个线程阻塞的时候，程序还有其他的线程可以继续运转，因此整个程序就不会在阻塞和等待中浪费了大量的时间。"]]},"created_time":1703138801176,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"925630ee-bb46-40d8-90cc-86c4f5427ffd":{"value":{"id":"925630ee-bb46-40d8-90cc-86c4f5427ffd","version":2,"type":"text","properties":{"title":[["事实上，还有一种非常适合 I/O 密集型任务的并发编程方式，我们称之为异步编程，你也可以将它称为异步 I/O。这种方式并不需要启动多个线程或多个进程来实现并发，它是通过多个子程序相互协作的方式来提升 CPU 的利用率，解决了 I/O 密集型任务 CPU  利用率很低的问题，我一般将这种方式称为“协作式并发”。这里，我不打算探讨操作系统的各种 I/O 模式，因为这对很多读者来说都太过抽象；但是我们得先抛出两组概念给大家，一组叫做“阻塞”和“非阻塞”，一组叫做“同步”和“异步”。"]]},"created_time":1703138801176,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"9f5f1735-ba73-4908-85f2-d805e769cf50":{"value":{"id":"9f5f1735-ba73-4908-85f2-d805e769cf50","version":2,"type":"sub_sub_header","properties":{"title":[["基本概念"]]},"created_time":1703138801176,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"d1f4cb6e-cb3c-495b-b91a-028f13127e34":{"value":{"id":"d1f4cb6e-cb3c-495b-b91a-028f13127e34","version":2,"type":"sub_sub_header","properties":{"title":[["阻塞"]]},"created_time":1703138801176,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"fa65d1c4-c670-4d49-973c-58c8e2fc18f8":{"value":{"id":"fa65d1c4-c670-4d49-973c-58c8e2fc18f8","version":2,"type":"text","properties":{"title":[["阻塞状态指程序未得到所需计算资源时被挂起的状态。程序在等待某个操作完成期间，自身无法继续处理其他的事情，则称该程序在该操作上是阻塞的。阻塞随时都可能发生，最典型的就是 I/O 中断（包括网络 I/O 、磁盘 I/O 、用户输入等）、休眠操作、等待某个线程执行结束，甚至包括在 CPU 切换上下文时，程序都无法真正的执行，这就是所谓的阻塞。"]]},"created_time":1703138801176,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"6ab1d0fd-9a7d-4344-b710-eacd1d7d8955":{"value":{"id":"6ab1d0fd-9a7d-4344-b710-eacd1d7d8955","version":2,"type":"sub_sub_header","properties":{"title":[["非阻塞"]]},"created_time":1703138801176,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"f892b1b3-f721-4e39-b1ee-8c9db1369b2a":{"value":{"id":"f892b1b3-f721-4e39-b1ee-8c9db1369b2a","version":2,"type":"text","properties":{"title":[["程序在等待某操作过程中，自身不被阻塞，可以继续处理其他的事情，则称该程序在该操作上是非阻塞的。非阻塞并不是在任何程序级别、任何情况下都可以存在的。仅当程序封装的级别可以囊括独立的子程序单元时，它才可能存在非阻塞状态。显然，某个操作的阻塞可能会导程序耗时以及效率低下，所以我们会希望把它变成非阻塞的。"]]},"created_time":1703138801176,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"7fd810e3-e4c0-4612-821a-ac9ccb7d1781":{"value":{"id":"7fd810e3-e4c0-4612-821a-ac9ccb7d1781","version":2,"type":"sub_sub_header","properties":{"title":[["同步"]]},"created_time":1703138801176,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"1b39a47c-5990-44f7-ae4a-b758ebde99f6":{"value":{"id":"1b39a47c-5990-44f7-ae4a-b758ebde99f6","version":2,"type":"text","properties":{"title":[["不同程序单元为了完成某个任务，在执行过程中需靠某种通信方式以协调一致，我们称这些程序单元是同步执行的。例如前面讲过的给银行账户存钱的操作，我们在代码中使用了“锁”作为通信信号，让多个存钱操作强制排队顺序执行，这就是所谓的同步。"]]},"created_time":1703138801176,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"068a11d6-bf00-48e3-bef4-648e7b2e00ab":{"value":{"id":"068a11d6-bf00-48e3-bef4-648e7b2e00ab","version":2,"type":"sub_sub_header","properties":{"title":[["异步"]]},"created_time":1703138801176,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"1d867f97-07c3-4984-bdf2-2d14c7fbd60c":{"value":{"id":"1d867f97-07c3-4984-bdf2-2d14c7fbd60c","version":2,"type":"text","properties":{"title":[["不同程序单元在执行过程中无需通信协调，也能够完成一个任务，这种方式我们就称之为异步。例如，使用爬虫下载页面时，调度程序调用下载程序后，即可调度其他任务，而无需与该下载任务保持通信以协调行为。不同网页的下载、保存等操作都是不相关的，也无需相互通知协调。很显然，异步操作的完成时刻和先后顺序并不能确定。"]]},"created_time":1703138801176,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"41d545a2-14d9-44da-821c-e451046fdbc2":{"value":{"id":"41d545a2-14d9-44da-821c-e451046fdbc2","version":2,"type":"text","properties":{"title":[["很多人都不太能准确的把握这几个概念，这里我们简单的总结一下，同步与异步的关注点是"],["消息通信机制",[["b"]]],["，最终表现出来的是“有序”和“无序”的区别；阻塞和非阻塞的关注点是"],["程序在等待消息时状态",[["b"]]],["，最终表现出来的是程序在等待时能不能做点别的。如果想深入理解这些内容，推荐大家阅读经典著作"],["《UNIX网络编程》",[["a","https://item.jd.com/11880047.html"]]],["，这本书非常的赞。"]]},"created_time":1703138801177,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"a329d251-5dc1-47a0-8584-2bd62b247525":{"value":{"id":"a329d251-5dc1-47a0-8584-2bd62b247525","version":2,"type":"sub_sub_header","properties":{"title":[["生成器和协程"]]},"created_time":1703138801177,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"3e7bb257-5faa-467c-9be6-043ade13b7e7":{"value":{"id":"3e7bb257-5faa-467c-9be6-043ade13b7e7","version":2,"type":"text","properties":{"title":[["前面我们说过，异步编程是一种“协作式并发”，即通过多个子程序相互协作的方式提升 CPU 的利用率，从而减少程序在阻塞和等待中浪费的时间，最终达到并发的效果。我们可以将多个相互协作的子程序称为“协程”，它是实现异步编程的关键。在介绍协程之前，我们先通过下面的代码，看看什么是生成器。"]]},"created_time":1703138801177,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"721dc12d-821e-4de8-8396-4c4b414fb2a1":{"value":{"id":"721dc12d-821e-4de8-8396-4c4b414fb2a1","version":2,"type":"code","properties":{"title":[["def fib(max_count):\n    a, b = 0, 1\n    for _ in range(max_count):\n        a, b = b, a + b\n        yield a\n"]],"language":[["Plain Text"]]},"format":{"code_wrap":true},"created_time":1703138801177,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"8f74cc98-f1f4-42b7-8b46-b6c1c10f6f14":{"value":{"id":"8f74cc98-f1f4-42b7-8b46-b6c1c10f6f14","version":2,"type":"text","properties":{"title":[["上面我们编写了一个生成斐波那契数列的生成器，调用上面的"],["fib",[["c"]]],["函数并不是执行该函数获得返回值，因为"],["fib",[["c"]]],["函数中有一个特殊的关键字"],["yield",[["c"]]],["。这个关键字使得"],["fib",[["c"]]],["函数跟普通的函数有些区别，调用该函数会得到一个生成器对象，我们可以通过下面的代码来验证这一点。"]]},"created_time":1703138801177,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"5b8f556e-939e-41fe-b49d-71c35a8e2b7b":{"value":{"id":"5b8f556e-939e-41fe-b49d-71c35a8e2b7b","version":2,"type":"code","properties":{"title":[["gen_obj = fib(20)\nprint(gen_obj)\n"]],"language":[["Plain Text"]]},"format":{"code_wrap":true},"created_time":1703138801177,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"0ccc5de6-bfd6-417b-b488-348cb19ca340":{"value":{"id":"0ccc5de6-bfd6-417b-b488-348cb19ca340","version":2,"type":"text","properties":{"title":[["输出："]]},"created_time":1703138801177,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"4884bd89-b4e0-4a74-9a1f-2a2a75db88fa":{"value":{"id":"4884bd89-b4e0-4a74-9a1f-2a2a75db88fa","version":2,"type":"code","properties":{"title":[["\u003cgenerator object fib at 0x106daee40\u003e\n"]],"language":[["Plain Text"]]},"format":{"code_wrap":true},"created_time":1703138801177,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"06a589d3-8410-4829-b545-af344c846425":{"value":{"id":"06a589d3-8410-4829-b545-af344c846425","version":2,"type":"text","properties":{"title":[["我们可以使用内置函数"],["next",[["c"]]],["从生成器对象中获取斐波那契数列的值，也可以通过"],["for-in",[["c"]]],["循环对生成器能够提供的值进行遍历，代码如下所示。"]]},"created_time":1703138801177,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"beee5c0c-58f8-4a4e-be8c-2e6f32968a5d":{"value":{"id":"beee5c0c-58f8-4a4e-be8c-2e6f32968a5d","version":2,"type":"code","properties":{"title":[["for value in gen_obj:\n    print(value)\n"]],"language":[["Plain Text"]]},"format":{"code_wrap":true},"created_time":1703138801177,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"f5459517-72d8-4284-a536-2358afc88bcf":{"value":{"id":"f5459517-72d8-4284-a536-2358afc88bcf","version":2,"type":"text","properties":{"title":[["生成器经过预激活，就是一个协程，它可以跟其他子程序协作。"]]},"created_time":1703138801177,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"3dc77faf-8585-48f5-bb5b-11c3a45019b1":{"value":{"id":"3dc77faf-8585-48f5-bb5b-11c3a45019b1","version":4,"type":"code","properties":{"title":[["def calc_average():\n    total, counter = 0, 0\n    avg_value = None\n    while True:\n        curr_value = yield avg_value\n        total += curr_value\n        counter += 1\n        avg_value = total / counter\n\n\ndef main():\n    obj = calc_average()\n    # 生成器预激活\n    obj.send(None)\n    for _ in range(5):\n        print(obj.send(float(input())))\n\n\nif __name__ == '__main__':\n    main()\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138801177,"last_edited_time":1703139419232,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"a61c6468-9d44-49c4-9bf6-434d01ca30c2":{"value":{"id":"a61c6468-9d44-49c4-9bf6-434d01ca30c2","version":2,"type":"text","properties":{"title":[["上面的"],["main",[["c"]]],["函数首先通过生成器对象的"],["send",[["c"]]],["方法发送一个"],["None",[["c"]]],["值来将其激活为协程，也可以通过"],["next(obj)",[["c"]]],["达到同样的效果。接下来，协程对象会接收"],["main",[["c"]]],["函数发送的数据并产出（"],["yield",[["c"]]],["）数据的平均值。通过上面的例子，不知道大家是否看出两段子程序是怎么“协作”的。"]]},"created_time":1703138801177,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"85e51849-8974-4066-9bb8-5c75494d2010":{"value":{"id":"85e51849-8974-4066-9bb8-5c75494d2010","version":2,"type":"sub_sub_header","properties":{"title":[["异步函数"]]},"created_time":1703138801177,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"a532ec27-dd8b-4039-9cc8-e6127ea7a7c1":{"value":{"id":"a532ec27-dd8b-4039-9cc8-e6127ea7a7c1","version":2,"type":"text","properties":{"title":[["Python 3.5版本中，引入了两个非常有意思的元素，一个叫"],["async",[["c"]]],["，一个叫"],["await",[["c"]]],["，它们在Python 3.7版本中成为了正式的关键字。通过这两个关键字，可以简化协程代码的编写，可以用更为简单的方式让多个子程序很好的协作起来。我们通过一个例子来加以说明，请大家先看看下面的代码。"]]},"created_time":1703138801178,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"b668f020-6cd9-489f-bcea-ba36af2c760a":{"value":{"id":"b668f020-6cd9-489f-bcea-ba36af2c760a","version":4,"type":"code","properties":{"title":[["import time\n\n\ndef display(num):\n    time.sleep(1)\n    print(num)\n\n\ndef main():\n    start = time.time()\n    for i in range(1, 10):\n        display(i)\n    end = time.time()\n    print(f'{end - start:.3f}秒')\n\n\nif __name__ == '__main__':\n    main()\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138801178,"last_edited_time":1703139428003,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"1767bc0a-a5b9-40c6-962b-387c993b6bb7":{"value":{"id":"1767bc0a-a5b9-40c6-962b-387c993b6bb7","version":2,"type":"text","properties":{"title":[["上面的代码每次执行都会依次输出"],["1",[["c"]]],["到"],["9",[["c"]]],["的数字，每个间隔"],["1",[["c"]]],["秒钟，整个代码需要执行大概需要"],["9",[["c"]]],["秒多的时间，这一点我相信大家都能看懂。不知道大家是否意识到，这段代码就是以同步和阻塞的方式执行的，同步可以从代码的输出看出来，而阻塞是指在调用"],["display",[["c"]]],["函数发生休眠时，整个代码的其他部分都不能继续执行，必须等待休眠结束。"]]},"created_time":1703138801178,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"7cfa3b71-ea1a-4e44-9c2e-615c91593f4a":{"value":{"id":"7cfa3b71-ea1a-4e44-9c2e-615c91593f4a","version":2,"type":"text","properties":{"title":[["接下来，我们尝试用异步的方式改写上面的代码，让"],["display",[["c"]]],["函数以异步的方式运转。"]]},"created_time":1703138801178,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"125b3d9d-cf60-4a09-bd56-636fadca6341":{"value":{"id":"125b3d9d-cf60-4a09-bd56-636fadca6341","version":4,"type":"code","properties":{"title":[["import asyncio\nimport time\n\n\nasync def display(num):\n    await asyncio.sleep(1)\n    print(num)\n\n\ndef main():\n    start = time.time()\n    objs = [display(i) for i in range(1, 10)]\n    loop = asyncio.get_event_loop()\n    loop.run_until_complete(asyncio.wait(objs))\n    loop.close()\n    end = time.time()\n    print(f'{end - start:.3f}秒')\n\n\nif __name__ == '__main__':\n    main()\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138801178,"last_edited_time":1703139434943,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"fd76fe29-c8e7-4202-a15a-48b2d3b0facb":{"value":{"id":"fd76fe29-c8e7-4202-a15a-48b2d3b0facb","version":2,"type":"text","properties":{"title":[["Python 中的"],["asyncio",[["c"]]],["模块提供了对异步 I/O 的支持。上面的代码中，我们首先在"],["display",[["c"]]],["函数前面加上了"],["async",[["c"]]],["关键字使其变成一个异步函数，调用异步函数不会执行函数体而是获得一个协程对象。我们将"],["display",[["c"]]],["函数中的"],["time.sleep(1)",[["c"]]],["修改为"],["await asyncio.sleep(1)",[["c"]]],["，二者的区别在于，后者不会让整个代码陷入阻塞，因为"],["await",[["c"]]],["操作会让其他协作的子程序有获得 CPU 资源而得以运转的机会。为了让这些子程序可以协作起来，我们需要将他们放到一个事件循环（实现消息分派传递的系统）上，因为"],["当协程遭遇 I/O 操作阻塞时，就会到事件循环中监听 I/O 操作是否完成，并注册自身的上下文以及自身的唤醒函数（以便恢复执行），之后该协程就变为阻塞状态",[["b"]]],["。上面的第12行代码创建了"],["9",[["c"]]],["个协程对象并放到一个列表中，第13行代码通过"],["asyncio",[["c"]]],["模块的"],["get_event_loop",[["c"]]],["函数获得了系统的事件循环，第14行通过"],["asyncio",[["c"]]],["模块的"],["run_until_complete",[["c"]]],["函数将协程对象挂载到事件循环上。执行上面的代码会发现，"],["9",[["c"]]],["个分别会阻塞"],["1",[["c"]]],["秒钟的协程总共只阻塞了约"],["1",[["c"]]],["秒种的时间，因为"],["阻塞的协程对象会放弃对 CPU 的占有而不是让 CPU 处于闲置状态，这种方式大大的提升了 CPU 的利用率",[["b"]]],["。而且我们还会注意到，数字并不是按照从"],["1",[["c"]]],["到"],["9",[["c"]]],["的顺序打印输出的，这正是我们想要的结果，说明它们是"],["异步执行",[["b"]]],["的。对于爬虫这样的 I/O 密集型任务来说，这种协作式并发在很多场景下是比使用多线程更好的选择，因为这种做法减少了管理和维护多个线程以及多个线程切换所带来的开销。"]]},"created_time":1703138801179,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"0aa4d472-716e-4917-b9ca-664f4b2ba342":{"value":{"id":"0aa4d472-716e-4917-b9ca-664f4b2ba342","version":2,"type":"sub_sub_header","properties":{"title":[["aiohttp库"]]},"created_time":1703138801179,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"59bffd03-85d2-4b47-b944-9dfa7f5a95c5":{"value":{"id":"59bffd03-85d2-4b47-b944-9dfa7f5a95c5","version":2,"type":"text","properties":{"title":[["我们之前使用的"],["requests",[["c"]]],["三方库并不支持异步 I/O，如果希望使用异步 I/O 的方式来加速爬虫代码的执行，我们可以安装和使用名为"],["aiohttp",[["c"]]],["的三方库。"]]},"created_time":1703138801179,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"89914fe1-21d2-4432-a2e9-f00879b2a337":{"value":{"id":"89914fe1-21d2-4432-a2e9-f00879b2a337","version":2,"type":"text","properties":{"title":[["安装"],["aiohttp",[["c"]]],["。"]]},"created_time":1703138801179,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"48aebeb2-cc4f-4270-8263-492bf6a7138e":{"value":{"id":"48aebeb2-cc4f-4270-8263-492bf6a7138e","version":2,"type":"code","properties":{"title":[["pip install aiohttp\n"]],"language":[["Plain Text"]]},"format":{"code_wrap":true},"created_time":1703138801179,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"35f8b1c7-c3f1-416c-9125-7d7d11b1e7fe":{"value":{"id":"35f8b1c7-c3f1-416c-9125-7d7d11b1e7fe","version":2,"type":"text","properties":{"title":[["下面的代码使用"],["aiohttp",[["c"]]],["抓取了"],["10",[["c"]]],["个网站的首页并解析出它们的标题。"]]},"created_time":1703138801179,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"40064b92-37cb-483f-a388-ee82d84282d1":{"value":{"id":"40064b92-37cb-483f-a388-ee82d84282d1","version":4,"type":"code","properties":{"title":[["import asyncio\nimport re\n\nimport aiohttp\nfrom aiohttp import ClientSession\n\nTITLE_PATTERN = re.compile(r'\u003ctitle.*?\u003e(.*?)\u003c/title\u003e', re.DOTALL)\n\n\nasync def fetch_page_title(url):\n    async with aiohttp.ClientSession(headers={\n        'User-Agent': 'Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_6) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.69 Safari/537.36',\n    }) as session:  # type: ClientSession\n        async with session.get(url, ssl=False) as resp:\n            if resp.status == 200:\n                html_code = await resp.text()\n                matcher = TITLE_PATTERN.search(html_code)\n                title = matcher.group(1).strip()\n                print(title)\n\n\ndef main():\n    urls = [\n        '\u003chttps://www.python.org/\u003e',\n        '\u003chttps://www.jd.com/\u003e',\n        '\u003chttps://www.baidu.com/\u003e',\n        '\u003chttps://www.taobao.com/\u003e',\n        '\u003chttps://git-scm.com/\u003e',\n        '\u003chttps://www.sohu.com/\u003e',\n        '\u003chttps://gitee.com/\u003e',\n        '\u003chttps://www.amazon.com/\u003e',\n        '\u003chttps://www.usa.gov/\u003e',\n        '\u003chttps://www.nasa.gov/\u003e'\n    ]\n    objs = [fetch_page_title(url) for url in urls]\n    loop = asyncio.get_event_loop()\n    loop.run_until_complete(asyncio.wait(objs))\n    loop.close()\n\n\nif __name__ == '__main__':\n    main()\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138801179,"last_edited_time":1703139441922,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"ca5fb77c-a7fb-4b73-a429-35346271c891":{"value":{"id":"ca5fb77c-a7fb-4b73-a429-35346271c891","version":2,"type":"text","properties":{"title":[["输出："]]},"created_time":1703138801179,"last_edited_time":1703138801196,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"}," value":{"id":"e184c146-545e-4852-9726-47823b9d1909","version":4,"type":"code","properties":{"title":[["\"\"\"\nexample04.py - 单线程版本爬虫\n\"\"\"\nimport os\n\nimport requests\n\n\ndef download_picture(url):\n    filename = url[url.rfind('/') + 1:]\n    resp = requests.get(url)\n    if resp.status_code == 200:\n        with open(f'images/beauty/{filename}', 'wb') as file:\n            file.write(resp.content)\n\n\ndef main():\n    if not os.path.exists('images/beauty'):\n        os.makedirs('images/beauty')\n    for page in range(3):\n        resp = requests.get(f'\u003chttps://image.so.com/zjl?ch=beauty\u0026sn=\u003e{page * 30}')\n        if resp.status_code == 200:\n            pic_dict_list = resp.json()['list']\n            for pic_dict in pic_dict_list:\n                download_picture(pic_dict['qhimg_url'])\n\nif __name__ == '__main__':\n    main()\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138815550,"last_edited_time":1703139455563,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"6d2921fd-d716-4c7b-aafe-7a3ea3ed6887":{"value":{"id":"6d2921fd-d716-4c7b-aafe-7a3ea3ed6887","version":2,"type":"text","properties":{"title":[["在 macOS 或 Linux 系统上，我们可以使用"],["time",[["c"]]],["命令来了解上面代码的执行时间以及 CPU 的利用率，如下所示。"]]},"created_time":1703138815550,"last_edited_time":1703138815564,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"55ca61a2-3002-4b29-9a92-ee0ffeec9301":{"value":{"id":"55ca61a2-3002-4b29-9a92-ee0ffeec9301","version":2,"type":"code","properties":{"title":[["time python3 example04.py\n"]],"language":[["Plain Text"]]},"format":{"code_wrap":true},"created_time":1703138815550,"last_edited_time":1703138815564,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f 465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"b373b9ef-f973-4492-bc12-13a58f107bf9":{"value":{"id":"b373b9ef-f973-4492-bc12-13a58f107bf9","version":6,"type":"code","properties":{"title":[["\"\"\"\nexample05.py - 多线程版本爬虫\n\"\"\"\nimport os\nfrom concurrent.futures import ThreadPoolExecutor\n\nimport requests\n\n\ndef download_picture(url):\n    filename = url[url.rfind('/') + 1:]\n    resp = requests.get(url)\n    if resp.status_code == 200:\n        with open(f'images/beauty/{filename}', 'wb') as file:\n            file.write(resp.content)\n\n\ndef main():\n    if not os.path.exists('images/beauty'):\n        os.makedirs('images/beauty')\n    with ThreadPoolExecutor(max_workers=16) as pool:\n        for page in range(3):\n            resp = requests.get(f'\u003chttps://image.so.com/zjl?ch=beauty\u0026sn=\u003e{page * 30}')\n            if resp.status_code == 200:\n                pic_dict_list = resp.json()['list']\n                for pic_dict in pic_dict_list:\n                    pool.submit(download_picture, pic_dict['qhimg_url'])\n\n\nif __name__ == '__main__':\n    main()\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138815550,"last_edited_time":1703139465587,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"dc64d02d-f564-451c-8818-17ded1d43887":{"value":{"id":"dc64d02d-f564-451c-8818-17ded1d43887","version":2,"type":"text","properties":{"title":[["执行如下所示的命令。"]]},"created_time":1703138815550,"last_edited_time":1703138815564,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"b2c11552-a3b9-44ff-9959-434db53ce774":{"value":{"id":"b2c11552-a3b9-44ff-9959-434db53ce774","version":2,"type":"code","properties":{"title":[["time python3 example05.py\n bfe-a7f8-895b46badeca"},"role":"reader"},"ea2e1c8c-309d-4780-80ae-cfa482a60cd0":{"value":{"id":"ea2e1c8c-309d-4780-80ae-cfa482a60cd0","version":2,"type":"code","properties":{"title":[["pip install aiohttp aiofile\n"]],"language":[["Plain Text"]]},"format":{"code_wrap":true},"created_time":1703138815550,"last_edited_time":1703138815564,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"5874ce3a-565c-4d4f-8d2a-698d5f4d0133":{"value":{"id":"5874ce3a-565c-4d4f-8d2a-698d5f4d0133","version":2,"type":"text","properties":{"title":[["aiohttp",[["c"]]],[" 的用法在之前的课程中已经做过简要介绍，"],["aiofile",[["c"]]],["模块中的"],["async_open",[["c"]]],["函数跟 Python 内置函数"],["open",[["c"]]],["的用法大致相同，只不过它支持异步操作。下面是异步 I/O 版本的爬虫代码。"]]},"created_time":1703138815551,"last_edited_time":1703138815564,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"c495f303-c0c7-47f3-bf79-83851938cfe6":{"value":{"id":"c495f303-c0c7-47f3-bf79-83851938cfe6","version":4,"type":"code","properties":{"title":[["\"\"\"\nexample06.py - 异步I/O版本爬虫\n\"\"\"\nimport asyncio\nimport json\nimport os\n\nimport aiofile\nimport aiohttp\n\n\nasync def download_picture(session, url):\n    filename = url[url.rfind('/') + 1:]\n    async with session.get(url, ssl=False) as resp:\n        if resp.status == 200:\n            data = await resp.read()\n            async with aiofile.async_open(f'images/beauty/{filename}', 'wb') as file:\n                await file.write(data)\n\n\nasync def fetch_json():\n    async with aiohttp.ClientSession() as session:\n        for page in range(3):\n            async with session.get(\n                url=f'\u003chttps://image.so.com/zjl?ch=beauty\u0026sn=\u003e{page * 30}',\n                ssl=False\n            ) as resp:\n                if resp.status == 200:\n                    json_str = await resp.text()\n                    result = json.loads(json_str)\n                    for pic_dict in result['list']:\n                        await download_picture(session, pic_dict['qhimg_url'])\n\n\ndef main():\n    if not os.path.exists('images/beauty'):\n        os.makedirs('images/beauty')\n    loop = asyncio.get_event_loop()\n    loop.run_until_complete(fetch_json())\n    loop.close()\n\n\nif __name__ == '__main__':\n    main()\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138815551,"last_edited_time":1703139470051,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"f4916959-6e8d-4c2d-a114-b5e8a3d5983f":{"value":{"id":"f4916959-6e8d-4c2d-a114-b5e8a3d5983f","version":2,"type":"text","properties":{"title":[["执行如下所示的命令。"]]},"created_time":1703138815551,"last_edited_time":1703138815564,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"daad8769-b884-49cc-ac47-3c1313a33dc7":{"value":{"id":"daad8769-b884-49cc-ac47-3c1313a33dc7","version":2,"type":"code","properties":{"title":[["time python3 example06.py\n"]],"language":[["Plain Text"]]},"format":{"code_wrap":true},"created_time":1703138815551,"last_edited_time":1703138815564,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"a6fe92c6-feef-4e0a-8909-3d0a46045710":{"value":{"id":"a6fe92c6-feef-4e0a-8909-3d0a46045710","version":2,"type":"text","properties":{"title":[["代码的执行结果如下所示："]]},"created_time":1703138815551,"last_edited_time":1703138815564,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"aedb6e2a-fce1-4267-889a-8ab79127b827":{"value":{"id":"aedb6e2a-fce1-4267-889a-8ab79127b alive":true,"copied_from":"99779fe2-fe15-47f5-bcf2-4fba31251f84","space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"c290780b-0cc7-47d5-89e4-6142e67ebc78":{"value":{"id":"c290780b-0cc7-47d5-89e4-6142e67ebc78","version":6,"type":"text","format":{"copied_from_pointer":{"id":"99779fe2-fe15-47f5-bcf2-4fba31251f84","table":"block","spaceId":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"}},"created_time":1703138457085,"last_edited_time":1703138821749,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"copied_from":"99779fe2-fe15-47f5-bcf2-4fba31251f84","space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"f96b02ae-9851-4a47-9c75-19531394f821":{"value":{"id":"f96b02ae-9851-4a47-9c75-19531394f821","version":2,"type":"sub_header","properties":{"title":[["使用Selenium抓取网页动态内容"]]},"created_time":1703138826932,"last_edited_time":1703138826986,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"f4813c07-3815-4862-9e2e-2bf564194d85":{"value":{"id":"f4813c07-3815-4862-9e2e-2bf564194d85","version":2,"type":"text","properties":{"title":[["根据权威机构发布的全球互联网可访问性审计报告，全球约有四分之三的网站其内容或部分内容是通过JavaScript动态生成的，这就意味着在浏览器窗口中“查看网页源代码”时无法在HTML代码中找到这些内容，也就是说我们之前用的抓取数据的方式无法正常运转了。解决这样的问题基本上有两种方案，一是获取提供动态内容的数据接口，这种方式也适用于抓取手机 App 的数据；另一种是通过自动化测试工具 Selenium 运行浏览器获取渲染后的动态内容。对于第一种方案，我们可以使用浏览器的“开发者工具”或者更为专业的抓包工具（如：Charles、Fiddler、Wireshark等）来获取到数据接口，后续的操作跟上一个章节中讲解的获取“360图片”网站的数据是一样的，这里我们不再进行赘述。这一章我们重点讲解如何使用自动化测试工具 Selenium 来获取网站的动态内容。"]]},"created_time":1703138826932,"last_edited_time":1703138826986,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"16d3d841-a2a0-43a4-a00f-1b23a1df4ba5":{"value":{"id":"16d3d841-a2a0-43a4-a00f-1b23a1df4ba5","version":2,"type":"sub_sub_header","properties":{"title":[["Selenium 介绍"]]},"created_time":1703138826932,"last_edited_time":1703138826986,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"90b90c86-b376-45ed-b652-d2e999a7c437":{"value":{"id":"90b90c86-b376-45ed-b652-d2e999a7c437","version":2,"type":"text","properties":{"title":[["Selenium 是一个自动化测试工具，利用它可以驱动浏览器执行特定的行为，最终帮助爬虫开发者获取到网页的动态内容。简单的说，只要我们在浏览器窗口中能够看到的内容，都可以使用 Selenium 获取到，对于那些使用了 JavaScript 动态渲染技术的网站，Selenium 会是一个重要的选择。下面，我们还是以 Chrome 浏览器为例，来讲解 Selenium 的用法，大家需要先安装 Chrome 浏览器并下载它的驱动。Chrome 浏览器的驱动程序可以在"],["ChromeDriver官网",[["a","https://chromedriver.chromium.org/downloads"]]],["进行下载，驱动的版本要跟浏览器的版本对应，如果没有完全对应的版本，就选择版本代号最为接近的版本。"]]},"created_time":1703138826932,"last_edited_time":1703138826986,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"7d67d879-42de-418e-bebb-0344e61d8498":{"value":{"id":"7d67d879-42de-418e-bebb-0344e61d8498","version":12,"type":"image","properties":{"size":[["226.1KB"]],"title":[["20220310134558.png"]],"source":[["https://prod-files-secure.s3.us-west-2.amazonaws.com/dcfc0b10-f3f6-4bfe-a7f8-895b46badeca/8632a220-51ae-4d7c-94f4-c4382a485c10/20220310134558.png"]]},"format":{"block_width":2158,"display_source":"https://prod-files-secure.s3.us-west-2.amazonaws.com/dcfc0b10-f3f6-4bfe-a7f8-895b46badeca/8632a220-51ae-4d7c-94f4-c4382a485c10/20220310134558.png","block_full_width":false,"block_page_width":true,"block_aspect_ratio":0.5458758109360519,"block_preserve_scale":true},"created_time":1703140719668,"last_edited_time":1703140724069,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"file_ids":["8632a220-51ae-4d7c-94f4-c4382a485c10"],"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"6934a719-fc5a-4401-a219-aabc75265c83":{"value":{"id":"6934a719-fc5a-4401-a219-aabc75265c83","version":4,"type":"text","created_time":1703138826932,"last_edi ":2,"type":"text","properties":{"title":[["解决这个问题的办法有三种："]]},"created_time":1703138826938,"last_edited_time":1703138826986,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"e8432af5-e192-46c1-b49c-69b72e1ec24f":{"value":{"id":"e8432af5-e192-46c1-b49c-69b72e1ec24f","version":2,"type":"numbered_list","properties":{"title":[["将下载的 ChromeDriver 放到已有的 PATH 环境变量下，建议直接跟 Python 解释器放在同一个目录，因为之前安装 Python 的时候我们已经将 Python 解释器的路径放到 PATH 环境变量中了。"]]},"created_time":1703138826939,"last_edited_time":1703138826986,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"f8fd1d2e-3fe3-447b-81ec-4e0f347d72c3":{"value":{"id":"f8fd1d2e-3fe3-447b-81ec-4e0f347d72c3","version":2,"type":"numbered_list","properties":{"title":[["将 ChromeDriver 放到项目虚拟环境下的 "],["bin",[["c"]]],[" 文件夹中（Windows 系统对应的目录是 "],["Scripts",[["c"]]],["），这样 ChromeDriver 就跟虚拟环境下的 Python 解释器在同一个位置，肯定是能够找到的。"]]},"created_time":1703138826939,"last_edited_time":1703138826986,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"3617e31d-a4ad-4eb9-b8cf-5779f7263e36":{"value":{"id":"3617e31d-a4ad-4eb9-b8cf-5779f7263e36","version":2,"type":"numbered_list","properties":{"title":[["修改上面的代码，在创建 Chrome 对象时，通过"],["service",[["c"]]],["参数配置"],["Service",[["c"]]],["对象，并通过创建"],["Service",[["c"]]],["对象的"],["executable_path",[["c"]]],["参数指定 ChromeDriver 所在的位置，如下所示："]]},"content":["c92c768a-d422-43bf-98be-1e2eacdda71b"],"created_time":1703138826939,"last_edited_time":1703138826986,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"b2b6de5c-9b32-4c6d-859a-2964d13e736f":{"value":{"id":"b2b6de5c-9b32-4c6d-859a-2964d13e736f","version":2,"type":"sub_sub_header","properties":{"title":[["查找元素和模拟用户行为"]]},"created_time":1703138826939,"last_edited_time":1703138826986,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"f4835207-5e6e-44f6-9de9-0f72eec98810":{"value":{"id":"f4835207-5e6e-44f6-9de9-0f72eec98810","version":2,"type":"text","properties":{"title":[["接下来，我们可以尝试模拟用户在百度首页的文本框输入搜索关键字并点击“百度一下”按钮。在完成页面加载后，可以通过"],["Chrome",[["c"]]],["对象的"],["find_element",[["c"]]],["和"],["find_elements",[["c"]]],["方法来获取页面元素，Selenium 支持多种获取元素的方式，包括：CSS 选择器、XPath、元素名字（标签名）、元素 ID、类名等，前者可以获取单个页面元素（"],["WebElement",[["c"]]],["对象），后者可以获取多个页面元素构成的列表。获取到"],["WebElement",[["c"]]],["对象以后，可以通过"],["send_keys",[["c"]]],["来模拟用户输入行为，可以通过"],["click",[["c"]]],["来模拟用户点击操作，代码如下所示。"]]},"created_time":1703138826939,"last_edited_time":1703138826986,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"da009b4d-c8b9-4aa7-bf28-52128623abac":{"value":{"id":"da009b4d-c8b9-4aa7-bf28-52128623abac","version":4,"type":"code","properties":{"title":[["from selenium import webdriver\nfrom selenium.webdriver.common.by import By\n\nbrowser = webdriver.Chrome()\nbrowser.get('\u003chttps://www.baidu.com/\u003e')\n# 通过元素ID获取元素\nkw_input = browser.find_element(By.ID, 'kw')\n# 模拟用户输入行为\nkw_input.send_keys('Python')\n# 通过CSS选择器获取元素\nsu_button = browser.find_element(By.CSS_SELECTOR, '#su')\n# 模拟用户点击行为\nsu_button.click()\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138826939,"last_edited_time":1703139479154,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"3c35b61b-5605-460c-858f-fa45452b601d":{"value":{"id":"3c35b61b-5605-460c-858f-fa45452b601d","version":2,"type":"text","properties":{"title":[["如果要执行一个系列动作，例如模拟拖拽操作，可以创建"],["ActionChains",[["c"]]],["对象，有兴趣的读者可以自行研究。"]]},"created_time":1703138826940,"last_edited_time":1703138826986,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"dafaff89-fff6-48d1-9b4b-466f7d98fb24":{"value":{"id":"dafaff89-fff6-48d1-9b4b-466f7d98fb24","version":2,"type":"sub_sub_header","properties":{"title":[["隐式等待和显式等待"]]},"created_time":1703138826940,"last_edited_time":1703138826986,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"a5e6111d-0770-4477-8abd-c909325d1f61":{"value":{"id":"a5e6111d-0770-4477-8abd-c909325d1f61","version":2,"type":"text","properties":{"title":[["这里还有一个细节需要大家知道，网页上的元素可能是动态生成的，在我们使用"],["find_element",[["c"]]],["或"],["find_elements",[["c"]]],["方法获取的时候，可能还没有完成渲染，这时会引发"],["NoSuchElementException",[["c"]]],["错误。为了解决这个问题，我们可以使用隐式等待的方式，通过设置等待时间让浏览器完成对页面元素的渲染。除此之外，我们还可以使用显示等待，通过创建"],["WebDriverWait",[["c"]]],["对象，并设置等待时间和条件，当条件没有满足时，我们可以先等待再尝试进行后续的操作，具体的代码如下所示。"]]},"created_time":1703138826940,"last_edited_time":1703138826986,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"ddab809f-5285-477e-b401-af2d4ba36278":{"value":{"id":"ddab809f-5285-477e-b401-af2d4ba36278","version":4,"type":"code","properties":{"title":[["from selenium import webdriver\nfrom selenium.webdriver.common.by import By\nfrom selenium.webdriver.support import expected_conditions\nfrom selenium.webdriver.support.wait import WebDriverWait\n\nbrowser = webdriver.Chrome()\n# 设置浏览器窗口大小\nbrowser.set_window_size(1200, 800)\nbrowser.get('\u003chttps://www.baidu.com/\u003e')\n# 设置隐式等待时间为10秒\nbrowser.implicitly_wait(10)\nkw_input = browser.find_element(By.ID, 'kw')\nkw_input.send_keys('Python')\nsu_button = browser.find_element(By.CSS_SELECTOR, '#su')\nsu_button.click()\n# 创建显示等待对象\nwait_obj = WebDriverWait(browser, 10)\n# 设置等待条件（等搜索结果的div出现）\nwait_obj.until(\n    expected_conditions.presence_of_element_located(\n        (By.CSS_SELECTOR, '#content_left')\n    )\n)\n# 截屏\nbrowser.get_screenshot_as_file('python_result.png')\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138826940,"last_edited_time":1703139482835,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"209475f3-ddbb-4e06-a6ce-313dfbe8f2cd":{"value":{"id":"209475f3-ddbb-4e06-a6ce-313dfbe8f2cd","version":2,"type":"text","properties":{"title":[["上面设置的等待条件"],["presence_of_element_located",[["c"]]],["表示等待指定元素出现，下面的表格列出了常用的等待条件及其含义。"]]},"created_time":1703138826940,"last_edited_time":1703138826986,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"6c4f94c2-ca76-42b8-ad14-4e7dfaa6e0ef":{"value":{"id":"6c4f94c2-ca76-42b8-ad14-4e7dfaa6e0ef","version":2,"type":"table","content":["5e202b12-976f-4075-b5ba-d914b4a3aa92","979b60a1-1e4d-4056-88c9-050c29e7c9de","1ca9655b-c3bf-490e-8f59-b9282267869e","fa4e0757-abbf-4939-9988-207599d0e7bf","5b3da03a-2fa8-44ad-9607-1e1dd6cbe565","8decbfa3-4b3d-4372-85ec-dcd04f22e3f4","a0448f5e-e9bd-4207-80a7-f2a646ab5b25","4f388643-33e7-4e2c-b7a6-981f9adb078f","a6f09fb5-c13d-465e-9ec1-f24c10f492bc","ec61b518-dc14-45df-8a0a-e589725bb3a2","a73db912-fd00-4dcd-8aa6-0fa35f9e6957","fe5afa2b-9fe5-46a5-bf7c-ecc922b1f32c","17b2ad9f-c40d-49c0-93a2-94b36bd2c7d2","383f6c59-4496-448b-9839-cdec03f66073"],"format":{"table_block_column_order":[";:`b","PI=:"]},"created_time":1703138826943,"last_edited_time":1703138826986,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"ae50d10e-5963-4c56-8d40-ef77be121f92":{"value":{"id":"ae50d10e-5963-4c56-8 pool:\n    for img in imgs:\n        pic_url = img.get_attribute('src')\n        pool.submit(download_picture, pic_url)\n"]],"language":[["Python"]]},"format":{"code_wrap":true},"created_time":1703138826949,"last_edited_time":1703139491693,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"1fbfe95c-abe4-40a1-afc8-d0da7e208837":{"value":{"id":"1fbfe95c-abe4-40a1-afc8-d0da7e208837","version":14,"type":"text","properties":{"title":[["运行上面的代码，检查指定的目录下是否下载了根据关键词搜索到的图片。"]]},"created_time":1703138826949,"last_edited_time":1703138836668,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"bf0a40df-a7b8-49bb-b156-a8888fd7ce33":{"value":{"id":"bf0a40df-a7b8-49bb-b156-a8888fd7ce33","version":6,"type":"text","created_time":1703138837353,"last_edited_time":1703138837517,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"89be4b2d-175b-4b97-930c-34c4c66badaa":{"value":{"id":"89be4b2d-175b-4b97-930c-34c4c66badaa","version":2,"type":"sub_header","properties":{"title":[["爬虫框架Scrapy简介"]]},"created_time":1703138846880,"last_edited_time":1703138846902,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"f9250007-5f2f-4810-8c52-d380b631fb26":{"value":{"id":"f9250007-5f2f-4810-8c52-d380b631fb26","version":2,"type":"text","properties":{"title":[["当你写了很多个爬虫程序之后，你会发现每次写爬虫程序时，都需要将页面获取、页面解析、爬虫调度、异常处理、反爬应对这些代码从头至尾实现一遍，这里面有很多工作其实都是简单乏味的重复劳动。那么，有没有什么办法可以提升我们编写爬虫代码的效率呢？答案是肯定的，那就是利用爬虫框架，而在所有的爬虫框架中，Scrapy 应该是最流行、最强大的框架。"]]},"created_time":1703138846880,"last_edited_time":1703138846902,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10- red_list","properties":{"title":[["蜘蛛程序（Spiders）：蜘蛛是用户自定义的用来解析网页并抓取特定URL的类，每个蜘蛛都能处理一个域名或一组域名，简单的说就是用来定义特定网站的抓取和解析规则的模块。"]]},"created_time":1703138846881,"last_edited_time":1703138846902,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"6d46aac4-a980-4bbc-b30f-d4f4ae3afa56":{"value":{"id":"6d46aac4-a980-4bbc-b30f-d4f4ae3afa56","version":2,"type":"numbered_list","properties":{"title":[["数据管道（Item Pipeline）：管道的主要责任是负责处理有蜘蛛从网页中抽取的数据条目，它的主要任务是清理、验证和存储数据。当页面被蜘蛛解析后，将被发送到数据管道，并经过几个特定的次序处理数据。每个数据管道组件都是一个 Python 类，它们获取了数据条目并执行对数据条目进行处理的方法，同时还需要确定是否需要在数据管道中继续执行下一步或是直接丢弃掉不处理。数据管道通常执行的任务有：清理 HTML 数据、验证解析到的数据（检查条目是否包含必要的字段）、检查是不是重复数据（如果重复就丢弃）、将解析到的数据存储到数据库（关系型数据库或 NoSQL 数据库）中。"]]},"created_time":1703138846881,"last_edited_time":1703138846902,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"f79246ca-7f11-4d73-8001-a13061ac96d1":{"value":{"id":"f79246ca-7f11-4d73-8001-a13061ac96d1","version":2,"type":"numbered_list","properties":{"title":[["中间件（Middlewares）：中间件是介于引擎和其他组件之间的一个钩子框架，主要是为了提供自定义的代码来拓展 Scrapy 的功能，包括下载器中间件和蜘蛛中间件。"]]},"created_time":1703138846881,"last_edited_time":1703138846902,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"ee8182ce-d409-46f7-b7e5-613178cc2fa5":{"value":{"id":"ee8182ce-d409-46f7-b7e5-613178cc2fa5","version":2,"type":"sub_sub_header","properties":{"title":[["数据处理流程"]]},"created_time":1703138846881,"last_edited_time":1703138846902,"parent_id":"c3af7a5f-a96b-465c-976e-c2c3a791120e","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca"},"role":"reader"},"02b27574-72aa-405e-a8db-a186f9784b13":{"value":{"id":"02b27574-72aa-405e-a8db-a186f9784b13","version":2,"type":"text","properties":{"title":[["Scrapy 的整个数据处理流程由
